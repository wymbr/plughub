# infra/registry/tenant_demo.yaml
#
# Declaração completa do ambiente demo para o tenant_demo.
# Lido pelo RegistrySyncer no startup do orchestrator-bridge.
#
# Regras:
#   - pools são imutáveis após criação (estruturais — 409 é ignorado silenciosamente)
#   - agent_types são upsert (POST → 409 → PATCH para corrigir pools/permissões)
#   - Esta é a única fonte de verdade de configuração — não edite direto no banco
#
# Alterações aqui são aplicadas automaticamente no próximo restart do
# orchestrator-bridge, sem precisar de seed manual.

tenant_id: tenant_demo

# ─────────────────────────────────────────────────────────────────────────────
# Channel endpoints — identificador de canal → pool (slug webchat, DIN, número WA…).
# Migrados do antigo infra/seed/seed.py (config-consolidation F1.1b); sincronizados
# pelo RegistrySyncer via POST /v1/channel-endpoints (idempotente, 409 = já existe).
# ─────────────────────────────────────────────────────────────────────────────

channel_endpoints:
  - channel: webchat
    identifier: demo
    pool_id: demo_ia
    display_name: "WebChat Demo IA"
  - channel: webchat
    identifier: sac
    pool_id: sac_ia
    display_name: "WebChat SAC IA"
  - channel: webhook
    identifier: crm-callback
    pool_id: retencao_humano
    display_name: "CRM Callback"

# ─────────────────────────────────────────────────────────────────────────────
# Pools
# ─────────────────────────────────────────────────────────────────────────────

pools:

  - pool_id: demo_ia
    agent_kind: ai
    deploy: { skill_id: skill_triagem_v2, max_concurrent_sessions: 10 }
    description: "Pool IA — entry point do fluxo IVR com botões (agente_demo_ia_v1)"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 480000

  - pool_id: sac_ia
    agent_kind: ai
    deploy: { skill_id: skill_atendimento_sac_v1, max_concurrent_sessions: 10 }
    description: "Pool IA — atendimento SAC via LLM (Claude)"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 480000
    # NPS de fim-de-contato via hook on_contact_end (mecanismo genérico — o MESMO pool
    # nps_ia do humano retencao_humano). O bridge segura a sessão do cliente (posatt) e
    # roda o skill nps_ia (skill_nps_v1) NA conferência; nps_on_disconnect=skip não
    # oferece se o cliente caiu. O skill ramifica o GRÃO pelo contexto: humano (há
    # surveyed_segment_id) → grão segment; IA (sem segmento) → grão session — um pool
    # serve os dois. A survey OUTBOUND (skill_survey_v1) NÃO é usada aqui — fica como
    # padrão de SKILL para casos especiais (multi-humano). Ver §14.2 de
    # docs/arcos/analytics-agents-workbench.md.
    hooks:
      on_contact_end:
        - pool: nps_ia
          side: customer
          nps_on_disconnect: skip

  - pool_id: fila_humano
    agent_kind: ai
    deploy: { skill_id: skill_fila_v1, max_concurrent_sessions: 50 }
    description: "Pool intermediário — fila para agente humano"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 300000

  - pool_id: retencao_humano
    # Capacity-governance item 2: tipagem explícita — pool humano (queue_config
    # exige human; logins contam contra C_human). Pools IA declaram agent_kind: ai.
    agent_kind: human
    description: "Pool de agentes humanos — retenção e suporte especializado"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 300000
    # Fase C (queue-attended-model): agente de fila — ativado pelo bridge no
    # conversations.queued enquanto o contato espera; gera segmento role=queue
    # (ledger de fila da Fase D). skill_id explícito porque agent_types estão
    # aposentados (o bridge resolve o flow direto pela skill).
    queue_config:
      agent_type_id: agente_fila_v1
      skill_id: skill_fila_v1
      # Fase E: teto de espera da fila (max_wait_exceeded). Validado com 30s
      # em 2026-06-03; valor de produção:
      max_wait_s: 1800
    # @mention routing: aliases disponíveis para agentes humanos desta fila
    # "@copilot" → convida/envia comando ao co-pilot SAC do pool copilot_sac
    mentionable_pools:
      copilot:    copilot_sac
      auth:       auth_ia       # @auth      → convida agente_auth_ia_v1 (PIN texto)
      auth_form:  auth_form_ia  # @auth_form → convida agente_auth_form_v1 (formulário)
      humanoxxx:  humanoxxx     # @humanoxxx → convida um agente HUMANO do pool humanoxxx (specialist)
    # Destinos de transferência pool→pool oferecidos no botão "Transfer" do Console.
    # Lidos pelo mcp-server supervisor_capabilities → capabilities.escalations.
    # enabled=false: sem monitoramento de supervisor IA; só declara os destinos.
    supervisor_config:
      enabled: false
      escalation_pools:
        - sac_ia
        - reembolso_ia
        - portabilidade_ia
    # Pool lifecycle hooks — acionam especialistas em pontos do ciclo de atendimento.
    # on_human_start:  reservado para avaliadores em tempo real (Echo desativado no demo).
    # on_human_end:    fim-de-SEGMENTO humano → wrap-up (agents_only).
    # on_contact_end:  fim-de-CONTATO → NPS (customer-only). G7 Fase 3b: NPS saiu do
    #                  on_human_end (não pega mais carona no último segmento humano).
    hooks:
      on_human_start: []  # Echo evaluator removido do demo — era agente de debug do receive step
      on_human_end:
        # Arc 14: side=agent → segmento interage com o agente humano.
        # wrap_up_pending gravado no Redis enquanto este segmento estiver ativo —
        # routing-engine não aloca novo contato ao agente até o wrap-up concluir.
        - pool: wrapup_ia
          side: agent
      # G7 Fase 3b: NPS é hook de fim-de-CONTATO (1ª classe), dispara 1× quando o
      # contato encerra de fato (no_continuation) — dono = pool do primary corrente.
      on_contact_end:
        # side=customer → segmento interage com o cliente.
        # nps_on_disconnect=skip → se o cliente desconectou, NPS não é disparado.
        - pool: nps_ia
          side: customer
          nps_on_disconnect: skip
      post_human: []

  - pool_id: avaliacao_ia
    agent_kind: ai
    deploy: { skill_id: skill_avaliacao_v1, max_concurrent_sessions: 20 }
    # IMPORTANTE: este pool NÃO deve estar na cadeia de roteamento ao vivo.
    # Apenas agentes de avaliação pós-sessão devem ser registrados aqui.
    description: "Pool exclusivo para avaliação pós-sessão — sem tráfego ao vivo"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 600000

  - pool_id: contexto_ia
    agent_kind: ai
    deploy: { skill_id: skill_contexto_ia_v1, max_concurrent_sessions: 20 }
    # IMPORTANTE: pool de agentes especialistas em acumulação de contexto.
    # Invocados via task step (mode: assist) — sem tráfego direto de clientes.
    # Qualquer agente especialista pode invocar este pool para enriquecer
    # o contact_context antes de iniciar seu atendimento.
    description: "Pool de agentes especialistas em context-aware progressive resolution"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 30000

  - pool_id: portabilidade_ia
    agent_kind: ai
    deploy: { skill_id: skill_portabilidade_intake_v1, max_concurrent_sessions: 10 }
    # Pool do agente de intake de portabilidade.
    # Coleta número atual + operadora destino e persiste no ContextStore.
    # Phase 1: agente_portabilidade_ia_v1 com skill_portabilidade_intake_v1.
    # Phase 2: trocar para skill_atendimento_portabilidade_v1 (Tier 2 com task step).
    description: "Pool do agente de portabilidade — coleta dados do cliente"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 300000

  - pool_id: portabilidade_processo_ia
    agent_kind: ai
    deploy: { skill_id: skill_portabilidade_demo_v1, max_concurrent_sessions: 20 }
    # Arc 19: pool webhook para o processo assíncrono de portabilidade.
    # Disparado pelo intake via workflow_trigger MCP tool.
    # Executa skill_portabilidade_demo_v1: suspend 48h → collect → complete.
    # Capacidade real = slots do deploy (Bootstrap) + admissão (Fase B).
    # max_concurrent_sessions pool-level REMOVIDO (2026-06-04): era capacidade
    # fictícia exibida no Monitor — o campo é throttle opcional de downstream,
    # só setar quando o sistema downstream (ex. ERP) exigir backpressure.
    description: "Pool webhook — processo assíncrono de portabilidade (Arc 19)"
    channel_types: [webhook]
    skill_id: skill_portabilidade_demo_v1
    # webhook_skill_id = endpoint (DNIS) — resolução determinística por skill_id
    # agora que há >1 pool webhook (survey_processo_ia foi adicionado na F10.2b).
    webhook_skill_id: skill_portabilidade_demo_v1
    sla_target_ms: 172800000  # 48h em ms

  - pool_id: portabilidade_confirmacao
    agent_kind: ai
    deploy: { skill_id: skill_agente_confirmacao_portabilidade_v1, max_concurrent_sessions: 10 }
    # Arc 19 delegate pattern: pool do agente de I/O de confirmação de portabilidade.
    # Acionado pelo delegate() step em skill_portabilidade_demo_v1 após aprovação
    # da operadora. O agente notifica o cliente e coleta sua confirmação.
    # O agente chama workflow_resume ao concluir, retomando o processo webhook.
    description: "Pool de confirmação de portabilidade com o cliente (delegate I/O)"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 86400000  # 24h em ms

  - pool_id: survey_processo_ia
    agent_kind: ai
    # max_concurrent baixo: survey é rápido/fire-and-forget. A governança de
    # capacidade exige Σ deploys ≤ C ({tenant}:quota:max_concurrent_sessions);
    # se C estiver cheio, suba o teto (ver passo de validação F10.2b).
    deploy: { skill_id: skill_survey_v1, max_concurrent_sessions: 5 }
    # F10.2b: pool webhook do workflow de pesquisa de sessão. Disparado pelo passo
    # final do fluxo primário via workflow_trigger (origin_session_id = a sessão
    # pesquisada). Executa skill_survey_v1: grava o sinal via survey_record contra
    # a sessão original. F10.2b.1 esqueleto (valor semeado); F10.2b.2 coleta via collect.
    description: "Pool webhook — survey de pesquisa grão session (F10.2b)"
    channel_types: [webhook]
    skill_id: skill_survey_v1
    # webhook_skill_id = endpoint (DNIS) que o routing usa para resolver pool por
    # skill_id. Necessário quando há >1 pool webhook (senão o trigger cai no scan).
    webhook_skill_id: skill_survey_v1
    sla_target_ms: 3600000  # 1h em ms

  - pool_id: survey_collector_ia
    agent_kind: ai
    deploy: { skill_id: skill_survey_nps_v1, max_concurrent_sessions: 5 }
    # F10.2b.2: pool coletor de NPS (channel-aware). Acionado pelo step delegate em
    # skill_survey_v1; o agente faz I/O com o cliente (notify+menu NPS) e devolve a
    # nota via workflow_resume. NÃO é webhook (delegate cria sessão-filho com pool
    # direto). Consome quota — INCRBY na quota se C estiver cheio.
    description: "Pool coletor de NPS do survey (delegate I/O channel-aware)"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 600000  # 10 min

  - pool_id: survey_reconnect_ia
    agent_kind: ai
    deploy: { skill_id: skill_survey_reconnect_v1, max_concurrent_sessions: 5 }
    # F10.2b.2 (inbound_only): pool de ENTRADA onde o cliente reconecta para
    # retomar uma pesquisa pendente. Faz pending_workflow_get e delega ao coletor.
    # Conecte o webchat de teste a este pool para responder o NPS real.
    description: "Pool de reconexão do survey (inbound_only) — cliente retoma pesquisa pendente"
    channel_types: [webchat]
    sla_target_ms: 300000  # 5 min

  - pool_id: reembolso_ia
    agent_kind: ai
    deploy: { skill_id: skill_reembolso_intake_v1, max_concurrent_sessions: 10 }
    # Pool do agente de intake de reembolso.
    # Coleta número do pedido + motivo e persiste no ContextStore.
    # Phase 1: agente_reembolso_ia_v1 com skill_reembolso_intake_v1.
    # Phase 2: trocar para skill_atendimento_reembolso_v1 (Tier 2 com task step).
    description: "Pool do agente de reembolso — coleta dados do cliente"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 300000

  - pool_id: auth_sac_ia
    agent_kind: ai
    deploy: { skill_id: skill_atendimento_auth_v1, max_concurrent_sessions: 10 }
    # Pool da composição Auth → SAC (Tier 2 — Sprint 1D).
    # Verifica identidade do cliente antes de rotear para sac_ia.
    # Phase 1: código demo hardcoded "1234" (sem masking real).
    # Phase 2: trocar step de coleta por task step → skill_auth_form_v1 (masking real).
    # Triagem v2: opção "🔐 SAC autenticado" aponta para este pool.
    description: "Pool de composição auth → SAC — verifica identidade antes do atendimento"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 180000

  - pool_id: copilot_sac
    agent_kind: ai
    deploy: { skill_id: skill_copilot_sac_v1, max_concurrent_sessions: 10 }
    # Pool do co-pilot especialista SAC.
    # Ativado via @mention pelo agente humano de retenção (@copilot).
    # Nunca recebe tráfego direto de clientes — apenas convites via conferência.
    description: "Pool do co-pilot SAC — especialista @mention com sugestões contextuais"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 15000

  - pool_id: auth_ia
    agent_kind: ai
    deploy: { skill_id: skill_auth_ia_v1, max_concurrent_sessions: 20 }
    # Pool do agente de autenticação segura.
    # Executa o fluxo masked begin_transaction → coletar_pin → validar_pin → end_transaction.
    # Pode ser ativado diretamente ou via task step de outro agente.
    description: "Pool do agente de autenticação — fluxo masked com PIN seguro"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 60000

  - pool_id: auth_form_ia
    agent_kind: ai
    deploy: { skill_id: skill_auth_form_v1, max_concurrent_sessions: 20 }
    # Pool do agente de autenticação via formulário.
    # Demonstra field-level masking: email (plain) + senha + codigo_2fa (masked).
    # Ideal para testar a renderização do formulário mascarado no webchat.
    description: "Pool do agente de autenticação via formulário seguro — campos mistos"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 60000

  - pool_id: wrapup_ia
    agent_kind: ai
    deploy: { skill_id: skill_wrapup_v1, max_concurrent_sessions: 20 }
    # Pool do agente de wrap-up pós-atendimento.
    # Acionado via pool hook on_human_end — obrigatório quando configurado.
    # Coleta notas internas do agente humano (resumo, classificação, próximos passos).
    # Usa visibility agents_only — cliente não vê o wrap-up.
    description: "Pool do agente de wrap-up — notas internas pós-atendimento (agents_only)"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 180000

  - pool_id: nps_ia
    agent_kind: ai
    deploy: { skill_id: skill_nps_v1, max_concurrent_sessions: 20 }
    # Pool do agente NPS pós-atendimento.
    # Acionado via pool hook on_human_end, em paralelo com wrapup_ia.
    # Conversa exclusivamente com o cliente via visibility array.
    # O agente humano NÃO vê as mensagens de NPS.
    description: "Pool do agente NPS — pesquisa isolada com o cliente (visibility array)"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 120000

  - pool_id: evaluador_echo_ia
    agent_kind: ai
    deploy: { skill_id: skill_evaluador_echo_v1, max_concurrent_sessions: 20 }
    # Pool do avaliador echo — teste do receive step em tempo real.
    # Acionado via pool hook on_human_start do pool retencao_humano.
    # NÃO recebe tráfego direto de clientes — apenas via conferência.
    # Escuta mensagens de primary e customer e ecoa como nota agents_only.
    # Use para validar o mecanismo receive → notify → receive (cyclic DAG).
    description: "Pool do avaliador echo — teste do receive step (agents_only)"
    channel_types: [webchat, whatsapp]
    sla_target_ms: 30000

# ─────────────────────────────────────────────────────────────────────────────
# Agent Types — entidade APOSENTADA (Fase 3d/C).
# Provisionamento de IA vem do bloco `deploy:` de cada pool (seção Pools); o
# bridge sintetiza um agent_type native a partir da skill no 404. Agentes humanos
# são login-driven (instância `human-{userId}` com execution_model=stateful no
# Redis) — não há agent_type no registry. O RegistrySyncer não lê esta seção.
# ─────────────────────────────────────────────────────────────────────────────

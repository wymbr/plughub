# clamd.conf — antivírus da esteira de anexos (ATT-05, 2026-10-01)
#
# Montado sobre o /etc/clamav/clamd.conf da imagem `clamav/clamav`. O padrão da imagem tem só
# socket, porta e usuário, e os tetos compilados (100 MB por stream) recusariam vídeo — a
# allowlist do anexo aceita MP4/WebM até 512 MB (`attachment_store.MIME_LIMITS`).
#
# ⚠️ Arquivo montado SOZINHO: editado com o container de pé, o `docker restart` não o relê —
# use `docker compose up -d --force-recreate clamav`.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
StreamMaxLength 600M
MaxFileSize 600M
MaxScanSize 600M

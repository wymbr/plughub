# infra/modules.yaml
# Declaração de todos os módulos da plataforma PlugHub.
# Carregado pelo auth-api no startup e registrado em auth.module_registry.
#
# Estrutura de permission_schema:
#   <key>:
#     label:      string — rótulo exibido na UI de usuários
#     domain:     list   — valores válidos para 'access'
#     scopable:   bool   — se true, permite escopo por pool/campanha
#     scope_type: string — "pool" | "campaign" (apenas quando scopable: true)
#     default:    string — valor padrão para novos usuários
#
# Domínio de 'access': [none, read_only, read_write]
# (`write_only` REMOVIDO na AUT-40, 2026-09-09: 0 domínios o ofereciam e 0 grants
#  o usavam. Ver `packages/py-authz/src/plughub_authz/__init__.py`.)

modules:

  # ── Avaliação de Qualidade ────────────────────────────────────────────────────
  - module_id: evaluation
    label: Avaliação de Qualidade
    icon: "⭐"
    nav_path: /evaluation
    permission_schema:
      contestar:
        label: Contestar avaliações recebidas
        domain: [none, read_write]
        scopable: true
        scope_type: pool
        default: none
        role_defaults:
          admin: read_write
          operator: read_write
        # MOD-08/G1b (2026-09-08): o supervisor CONTRATA operador, e o guard de RANK
        # da MOD-02 exige `preset(operator)` contido em `preset(supervisor)`. Sem este
        # campo o supervisor nao consegue criar o operador mais ordinario do sistema —
        # medido, e foi o que refutou a ideia de hierarquia de papeis.
          supervisor: read_write
      revisar:
        label: Revisar e decidir sobre avaliações
        domain: [none, read_only, read_write]
        scopable: true
        scope_type: pool
        default: none
        role_defaults:
          admin: read_write
          supervisor: read_write
      # T5/5a — campos por round (contestação/réplica/tréplica). Cada um concede um round;
      # um perfil combina o que precisar. contestar/revisar = round 1.
      contestar_replica:
        label: Contestar avaliações (réplica - round 2)
        domain: [none, read_write]
        scopable: true
        scope_type: pool
        default: none
        role_defaults:
          admin: read_write
      contestar_treplica:
        label: Contestar avaliações (tréplica - round 3)
        domain: [none, read_write]
        scopable: true
        scope_type: pool
        default: none
        role_defaults:
          admin: read_write
      revisar_replica:
        label: Revisar réplica (round 2)
        domain: [none, read_only, read_write]
        scopable: true
        scope_type: pool
        default: none
        role_defaults:
          admin: read_write
      revisar_treplica:
        label: Revisar tréplica (round 3)
        domain: [none, read_only, read_write]
        scopable: true
        scope_type: pool
        default: none
        role_defaults:
          admin: read_write
      # Slice auth quality (2026-06-25): curadoria + calibração (Arc 13 Fase H).
      # read_only = ver fila/contexto cego; read_write = re-pontuar, resolver, flag de viés.
      # Não tem rounds (≠ revisar/contestar). Concedido pela tela de Access, escopo por pool.
      curar:
        label: Curar e calibrar avaliações
        domain: [none, read_only, read_write]
        scopable: true
        scope_type: pool
        default: none
        role_defaults:
          admin: read_write
          supervisor: read_write
      report:
        label: Visualizar relatórios de qualidade
        domain: [none, read_only]
        scopable: false
        default: none
        role_defaults:
          admin: read_only
          business: read_only
          supervisor: read_only
      formularios:
        label: Gerenciar formulários e campanhas
        domain: [none, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
      # T8-D — gerir a rubrica-template/prompt do avaliador (perfil "mantenedor de prompt",
      # ortogonal a formulários). Gate da página Rubrica/Prompt (spec §16.3).
      gerir_rubrica:
        label: Gerenciar rubrica/prompt do avaliador
        domain: [none, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write

  # ── Contatos ──────────────────────────────────────────────────────────────────
  - module_id: contacts
    label: Contatos
    icon: "📞"
    nav_path: /contacts
    permission_schema:
      # MOD-05 / corte #1 da D6 (2026-09-08). `contacts.operacao` carregava DOIS fatos
      # com detentores diferentes — o proprio rotulo os listava: "Monitor em tempo
      # real, Agent Assist". O supervisor OBSERVA; o operador ATENDE.
      #
      # ⚠️ O corte NAO criou `contacts.atender`: o campo do atendimento JA EXISTIA,
      # orfao desde sempre — `agent_assist.atender` ("Receber e atender contatos"),
      # sem uma entrada de menu sequer. Criar um segundo seria a duplicacao que este
      # repositorio caca; o corte apenas lhe deu o consumidor que faltava.
      monitorar:
        label: "Monitor: observar a operação ao vivo (sessões, agentes, pools)"
        domain: [none, read_only, read_write]
        scopable: true
        scope_type: pool
        default: none
        role_defaults:
          admin: read_write
          operator: read_write
          supervisor: read_write
      # MOD-07 / corte #4 da D6 (2026-09-08). O rotulo tinha um "e" e eram dois
      # fatos com sensibilidade LGPD diferente: as LISTAS e agregados da Analise x o
      # DIALOGO verbatim de um contato. Medido antes de cortar: o campo nao era
      # exigido em backend nenhum — um token com `contacts.monitorar` e sem
      # `visualizar` lia a transcricao inteira (200). Ele so escondia menu.
      visualizar:
        label: "Analytics: relatórios e agregados de contatos (listas e traços de execução)"
        domain: [none, read_only]
        scopable: true
        scope_type: pool
        default: none
        role_defaults:
          admin: read_only
          business: read_only
          devops: read_only
          operator: read_only
          supervisor: read_only
      transcricao:
        label: Ler a transcrição de um contato (diálogo verbatim)
        domain: [none, read_only]
        scopable: true
        scope_type: pool
        default: none
        role_defaults:
          # Quem ATENDE e quem SUPERVISIONA leem o dialogo; `business` (analise
          # agregada) e `developer`/devops (depura execucao) ficam de fora — os dois
          # continuam com `visualizar`, que e o que a funcao deles pede. Este e o
          # unico corte da D6 que ESTREITA a populacao de um campo, e por isso o
          # backfill copia o que cada um JA tinha, em vez de aplicar o preset.
          admin: read_only
          operator: read_only
          supervisor: read_only
      exportar:
        label: Exportar dados de contatos
        domain: [none, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
          supervisor: read_write

  # ── `workflows` REMOVIDO em 2026-09-08 (MOD-11) ─────────────────────────────
  #
  # Eram seis campos com ZERO consumidores (medido por varredura do repositorio
  # inteiro): `operacao`, `visualizar`, `cancelar`, `webhooks`, `journey_read` e
  # `journey_resume`. Nao foi corte de granularidade nem faxina de orfaos: a
  # modularizacao inteira foi SUPERADA, e cada funcao tem hoje um sucessor que
  # ja e gateado por outro campo. Removido para que nao exista uma segunda casa
  # concedendo o que outro campo decide.
  #
  #   operacao       -> os tres nomes do rotulo se separaram: editor em
  #                     `/agent-flow/editor` (`skill_flows.operacao`), monitor em
  #                     `/flow/monitor` (`contacts.monitorar`) e calendario em
  #                     `/monitor/schedules` (`scheduler.operacao`) +
  #                     `/config/schedules` e `/config/calendars` (`config.calendars`)
  #   visualizar     -> Arc 19 Fase E: workflow e sessao `channel=webhook`, com
  #                     filtro de status `suspended` em `/analise/sessions`
  #                     (`contacts.visualizar`) e no Monitor (`contacts.monitorar`)
  #   cancelar       -> a rota `/instances/{id}/cancel` foi APAGADA em 2026-08-07;
  #                     encerra-se por SESSAO em `POST /api/force-complete/{sid}`
  #                     (`agent_assist.supervisionar`, AUT-38)
  #   webhooks       -> registro unico e o `ChannelEndpoint` do agent-registry
  #                     (`/v1/channel-endpoints`, tela `/config/channels`,
  #                     `config.channels`). O ADR `adr-webhook-endpoint-single-registry`
  #                     ja carimbava a tabela antiga como `legacy_token` (D6), e ela
  #                     foi medida em ZERO linhas
  #   journey_read   -> `approvals.operacao` ("ver e reivindicar tarefas de aprovacao")
  #                     — a fila pull de workflow no Console
  #   journey_resume -> `approvals.decide` ("aprovar / recusar / encaminhar"), que e
  #                     o gate VIVO do ingress de resume (`webhook.py:991`)
  #
  # Os dois `journey_*` nomeavam tools (`journey_list_suspended`, `journey_resume`)
  # que nao existem desde a Fase F do Arc 19 (2026-05-28).
  #
  # ⚠️ Nao recriar sem consumidor. Campo declarado que nao gateia nada e pior que
  # campo ausente: quem concede acredita ter negado.

  # ── Campanhas ─────────────────────────────────────────────────────────────────
  - module_id: campaigns
    label: Campanhas de Coleta
    icon: "📣"
    nav_path: /campaigns
    permission_schema:
      visualizar:
        label: Visualizar campanhas e resultados
        domain: [none, read_only]
        scopable: false
        default: none
        role_defaults:
          admin: read_only
          business: read_only
      gerenciar:
        label: Criar e gerenciar campanhas
        domain: [none, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write

  # ── Atendimento (Agent Assist) ────────────────────────────────────────────────
  - module_id: agent_assist
    label: Atendimento
    icon: "🎧"
    nav_path: /agent-assist
    permission_schema:
      atender:
        label: Receber e atender contatos (Console, Agent Assist, fila de trabalho)
        domain: [none, read_write]
        scopable: true
        scope_type: pool
        default: none
        role_defaults:
          # MOD-05: herdados de `contacts.operacao`, que foi cortado. Sem isto o corte
          # REBAIXA em silencio quem ja atendia, e o sintoma seria o Console sumindo do
          # menu de todo operador.
          admin: read_write
          operator: read_write
          supervisor: read_write
      supervisionar:
        label: Monitorar e intervir em sessões ativas
        domain: [none, read_only, read_write]
        scopable: true
        scope_type: pool
        default: none
        role_defaults:
          # AUT-38 (2026-09-08): `supervisor` ENTROU aqui porque este campo passou a
          # ser o portao de `force-complete` e `work_queue/expire`, que a allowlist de
          # papel dava a `["supervisor", "admin"]`. Sem isto a troca de portao viraria
          # uma REVOGACAO silenciosa: o supervisor perderia o botao de encerrar item
          # da fila, e o sintoma seria "a tela parou de deixar".
          admin: read_write
          supervisor: read_write

  # ── Faturamento ───────────────────────────────────────────────────────────────
  - module_id: billing
    label: Faturamento
    icon: "💳"
    nav_path: /config/billing
    permission_schema:
      visualizar:
        label: Visualizar fatura e recursos
        domain: [none, read_only]
        scopable: false
        default: none
        role_defaults:
          admin: read_only
          business: read_only
      gerenciar:
        label: Gerenciar recursos e ativar reservas
        domain: [none, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write

  # ── Configuração da Plataforma ────────────────────────────────────────────────
  - module_id: config
    label: Configuração da Plataforma
    icon: "⚙️"
    nav_path: /config
    permission_schema:
      # ⚠️ `platform` era o catch-all de CINCO telas (Dashboards, Platform, Channels,
      # Calendars, DialogForms) — medido 2026-08-27. Conceder uma delas concedia as
      # cinco, e o `channels` abaixo existia sem nenhum consumidor no menu (o backend
      # do config-api ja gateava os namespaces de canal nele; era o MENU que apontava
      # para `platform`). Os campos abaixo desfazem o catch-all.
      platform:
        label: Configurações gerais (namespaces, valores)
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
      dashboards:
        label: Dashboards (templates e catálogo por papel)
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
      calendars:
        label: Calendários e feriados
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
          supervisor: read_write
      dialog_forms:
        label: Formulários de diálogo (DialogForms)
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
      resources:
        # MOD-06 (2026-09-08): o rotulo citava quatro coisas e o campo nao gateava tres
        # delas — `/v1/instances` esta FORA do gate por decisao, `/v1/agent-types` nao
        # existe como rota, e `/v1/skills` (skill flows) passou a exigir
        # `skill_flows.editar`, que e o campo que a tela do Editor ja declarava.
        label: Recursos de roteamento (Pools, competências, contas de LLM)
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
      channels:
        label: Configuração de canais e credenciais
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
      # ⚠️ 'users' x 'permissions' — SPLIT de 2026-08-27, e a razão é de
      # SEGURANÇA, não de organização. O campo único "Gestão de usuários e
      # permissões" era a chave-mestra: quem o tinha podia se auto-conceder qualquer
      # módulo, trocar o próprio papel, alargar 'accessible_pools', ligar
      # 'unrestricted' e redefinir a senha de um admin. Ou seja, TODA fronteira ABAC
      # colapsava em "tem config.users".
      #
      # É a família "container largo para um fato estreito": administrar uma PESSOA e
      # conceder CAPACIDADE a ela são dois fatos com donos diferentes. O supervisor
      # precisa do primeiro (criar operador, resetar senha, ativar/desativar) e não
      # pode ter o segundo — senão as decisões de escopo que o dono tomou viram
      # sugestão, revogáveis por quem elas restringem.
      users:
        label: Gestão de usuários (criar, editar dados, ativar/desativar)
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
          supervisor: read_write
      permissions:
        label: Conceder permissões (papéis, módulos, escopo de pools)
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
      masking:
        label: Configuração de mascaramento de dados (catálogo de tipos)
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
      # ALW-03 (2026-09-02) — grant PRÓPRIO para o MAPA do ContextStore, separado do
      # catálogo de tipos acima. Os dois viviam em `masking`, e por isso o cadastro de
      # campo ficava fora do alcance de quem AUTORA flow: `skill_flows.operacao`/`editar`
      # nascem para admin+developer, `config.masking` só para admin. O ADR nomeia essa
      # fricção como o que faz gente contornar o cadastro.
      #
      # O `developer` está no preset DE PROPÓSITO: é a metade da decisão que a torna
      # mecanismo em vez de prosa. O que ele NÃO ganha é o catálogo — pode dizer que um
      # campo é `cpf_br`, não pode redefinir o que `cpf_br` mascara nem sua classe LGPD.
      context_map:
        label: Cadastro de campos do ContextStore (o mapa)
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
          devops: read_write

  # ── Skill Flows / AgentFlow ───────────────────────────────────────────────────
  - module_id: skill_flows
    label: Skill Flows
    icon: "🔧"
    nav_path: /agent-flow
    permission_schema:
      operacao:
        label: Acesso operacional (Editor, Monitor, Deploy)
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
          devops: read_write
      visualizar:
        label: Visualizar relatórios de agent flow
        domain: [none, read_only]
        scopable: false
        default: none
        role_defaults:
          admin: read_only
          business: read_only
          devops: read_only
      editar:
        label: Criar e editar skill flows
        domain: [none, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
          devops: read_write

  # ── Aprovações (fila de trabalho humano) ──────────────────────────────────────
  # ADR docs/adr/adr-human-approval-workflow-step.md. Aprovação = passo de workflow
  # (delegate/collect a um pool pull); o aprovador é um agente logado que trata a fila.
  # operacao = ver/reivindicar a tarefa; decide = a decisão que roteia o workflow.
  #
  # NÃO-scopable de propósito: o recorte de POOL vem de `accessible_pools` (dimensão
  # separada), NÃO de um scope[] por campo — para aprovação as duas colapsam
  # ("quais pools posso aprovar" = ter a capacidade E o pool ∈ accessible_pools).
  # O enforcement é pool-agnóstico na capacidade (ApprovalPanel) + accessible_pools
  # no inbox pull. Evita pedir/duplicar a lista de pools em dois lugares.
  - module_id: approvals
    label: Aprovações
    icon: "✅"
    nav_path: /approvals
    permission_schema:
      operacao:
        label: Ver e reivindicar tarefas de aprovação
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
          operator: read_write
        # MOD-08/G1b (2026-09-08): o supervisor CONTRATA operador, e o guard de RANK
        # da MOD-02 exige `preset(operator)` contido em `preset(supervisor)`. Sem este
        # campo o supervisor nao consegue criar o operador mais ordinario do sistema —
        # medido, e foi o que refutou a ideia de hierarquia de papeis.
          supervisor: read_write
      decide:
        label: Decidir (aprovar / recusar / encaminhar)
        domain: [none, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
          operator: read_write
        # MOD-08/G1b (2026-09-08): o supervisor CONTRATA operador, e o guard de RANK
        # da MOD-02 exige `preset(operator)` contido em `preset(supervisor)`. Sem este
        # campo o supervisor nao consegue criar o operador mais ordinario do sistema —
        # medido, e foi o que refutou a ideia de hierarquia de papeis.
          supervisor: read_write

  # ── Agendas (Scheduler) ───────────────────────────────────────────────────────
  # Scheduler Fase 3. Grant-first (strict, sem bypass de admin): a nav /config/schedules
  # e a aba Agendas do Monitor só aparecem para quem recebe o campo explicitamente na
  # tela de Acesso — sem role default (decisão D2). `configurar` = criar/editar agendas
  # (autoria); `operacao` = ver/operar o Monitor (disparar-já, pausar/retomar, cancelar).
  - module_id: scheduler
    label: Agendas
    icon: "⏰"
    nav_path: /config/schedules
    permission_schema:
      configurar:
        label: Criar e editar agendas
        domain: [none, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
          supervisor: read_write
      operacao:
        label: Operar agendas no Monitor (disparar, pausar, cancelar)
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
          supervisor: read_write

  # ── Outbound (mailings + campanhas + entregas) ────────────────────────────────
  # Módulo Outbound (fatia 1b). Grant-first (strict, sem bypass de admin): a nav
  # /config/outbound só aparece para quem recebe o campo explicitamente em Acesso (D2).
  # `configurar` = criar/editar mailings e campanhas + importar arquivo (autoria);
  # `operacao` = ver/monitorar entregas (reservado p/ split monitor futuro).
  - module_id: outbound
    label: Outbound
    icon: "📣"
    nav_path: /config/outbound
    permission_schema:
      configurar:
        label: Criar e editar mailings e campanhas
        domain: [none, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write
      operacao:
        label: Monitorar entregas
        domain: [none, read_only, read_write]
        scopable: false
        default: none
        role_defaults:
          admin: read_write

  # ── Auditoria LGPD ────────────────────────────────────────────────────────────
  # AUT-41 (2026-09-08). O módulo EXISTIA em prosa e não no catálogo: o
  # `Sidebar.tsx` gateia `nav.audit` por `audit.sessions` e a analytics-api o
  # enforça de verdade (`_check_audit_access`, 5 ramos), mas nem o YAML nem o
  # `auth.module_registry` vivo o traziam. Sob o portão grant-first isso fazia o
  # item do DPO ser INVISÍVEL para todos, e — pior — INCONCEDÍVEL pela tela: o
  # `ModulePermissionForm` renderiza o catálogo, então só um `PUT module-config`
  # à mão o alcançava. Medido antes: 0 portadores. Terceira testemunha do buraco:
  # `access.json` já tinha 12 entradas em `moduleNames`, incluindo `audit` — o
  # locale sabia de um módulo que o catálogo não tinha.
  #
  # ⚠️ SEM `role_defaults`, e isso é decisão do dono (2026-09-08): auditoria é
  # ortogonal a papel — ninguém NASCE com ela, o DPO a recebe por concessão
  # explícita na tela de Acesso. O mecanismo já garante isso sem regra extra:
  # `presets.build_module_config` pula campo sem preset para os papéis do
  # usuário, então ausência é negação por construção.
  #
  # ⚠️ `domain: [none, read_only]` porque o portão é `abac_can(claims, "audit",
  # field, "read_only")` — é gate de LEITURA. Declarar `read_write` ofereceria um
  # nível que nada consome.
  #
  # ⚠️ `scopable: false` porque `_check_audit_access` NÃO passa `scope_id`.
  # Declarar `true` seria promessa sem mecanismo, e pior que inerte: pelo ramo 3
  # do `abac_can` (`scope` não-vazio + `scope_id is None` → PASSA), o escopo
  # pareceria restringir sem restringir nada.
  #
  # ⚠️ DOIS campos, não cinco. `user_access`, `data_requests` e `config_snapshot`
  # estão descritos no `CLAUDE.md` mas são deferred (fichas AUD-01..04) e não têm
  # portão vivo. Declará-los agora poria três campos sem consumidor no catálogo —
  # a mesma família do `agent_assist.atender` órfão. Cada um entra com a sua
  # feature.
  - module_id: audit
    label: Auditoria LGPD
    icon: "🔎"
    nav_path: /audit
    permission_schema:
      sessions:
        label: Consultar trilha de acesso a sessões
        domain: [none, read_only]
        scopable: false
        default: none
      mcp_calls:
        label: Consultar trilha de chamadas MCP
        domain: [none, read_only]
        scopable: false
        default: none

# ── Pares de CONTRATAÇÃO ──────────────────────────────────────────────────────
# MOD-08 / fase G1b do `adr-abac-module-granularity-and-delegation.md`.
#
# Declara quem pode CRIAR usuário de qual papel. Não é hierarquia — a cadeia
# `admin > developer > supervisor > operator` foi proposta em 2026-09-08 e refutada
# pelo próprio catálogo: nenhum par adjacente estava ordenado, e `operator` tem
# campos que `supervisor` não tem de propósito (o operador CONTESTA a própria
# avaliação; o supervisor REVISA). Papéis são funções, não níveis — isto aqui é um
# grafo declarado, não uma ordem derivada.
#
# POR QUE ELE PRECISA EXISTIR COMO DADO
# -------------------------------------
# O guard de RANK da MOD-02 (`rank(concedido) <= rank(detido)`, campo a campo) só
# entrega contratação enquanto valer `preset(contratado) ⊆ preset(contratante)`.
# Isso NÃO é derivável de nada: é decisão de produto sobre quem contrata quem. Mas
# uma vez declarado, o `⊆` é conferível — e sem gate, a próxima edição de preset
# quebra a contratação em silêncio, com sintoma que não parece "preset errado" e sim
# "a tela não deixa".
#
# ⚠️ Editar um `role_defaults` acima E um par aqui têm de caber no MESMO diff. É
# para isso que os dois moram neste arquivo.
#
# Conferido por `infra/test/probe_hiring_pairs_subset.sh`.
hiring_pairs:
  - contratante: admin
    # ✅ `devops` desde a MOD-10 (2026-09-08). O rename foi decidido na E3 e adiado
    # por SEQUENCIA: 7 das ocorrencias eram listas de `requireJwtRole` no
    # `mcp-server-plughub`, que a AUT-38 removeu ao migrar aqueles portoes para
    # campo ABAC — renomear antes seria editar duas vezes o que ia sumir.
    contratados: [supervisor, operator, business, devops]
  - contratante: supervisor
    contratados: [operator]

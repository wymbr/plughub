<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlugHub — Documentação (em breve)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--primary:#1B4F8A;--secondary:#2D9CDB;--accent:#00B4D8;--ink:#16242f;--muted:#56697a;--line:#e3e8ee;--soft2:#eef4fa}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--soft2),#fff);min-height:100vh;display:flex;align-items:center;justify-content:center;line-height:1.6;padding:24px}
  a{color:inherit;text-decoration:none}
  .box{max-width:560px;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:22px;color:var(--primary);margin-bottom:28px}
  .dot{width:24px;height:24px;border-radius:6px;background:var(--primary);position:relative}
  .dot::after{content:"";position:absolute;inset:7px;border-radius:3px;background:var(--accent)}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--secondary)}
  h1{font-size:34px;font-weight:700;margin:8px 0 14px;letter-spacing:-.01em}
  p{color:var(--muted);font-size:17px}
  .links{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{font-weight:600;font-size:15px;padding:11px 20px;border-radius:9px;border:1.5px solid var(--line);color:var(--primary)}
  .btn:hover{border-color:var(--secondary)}
  .btn.p{background:var(--primary);color:#fff;border-color:var(--primary)}
</style>
</head>
<body>
  <div class="box">
    <a href="../index.html" class="brand"><span class="dot"></span>PlugHub</a>
    <p class="eyebrow">Documentação</p>
    <h1>A documentação está chegando.</h1>
    <p>Conceitos, contrato de execução, tipos de passo do Skill Flow, MCP e o CLI do SDK — com exemplos. Enquanto isso, explore a visão geral ou solicite um ambiente de teste.</p>
    <div class="links">
      <a class="btn p" href="../index.html">Voltar ao site →</a>
      <a class="btn" href="mailto:contato@opuscom.com.br?subject=PlugHub%20-%20documenta%C3%A7%C3%A3o">Falar com a equipe</a>
    </div>
  </div>
</body>
</html>

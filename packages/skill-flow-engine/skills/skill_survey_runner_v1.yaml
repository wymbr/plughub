# skill_survey_runner_v1.yaml
# Survey — RUNNER do pool de survey (perfil agent, canal webchat).
# Era `skill_survey_collect_v1` (renomeado 2026-07-14 — ver skill_survey_trigger_v1.yaml
# para o porquê da nomeação por PAPEL e não por grão).
# Spec: docs/product/journey-j4c-survey-collect-spec.md
#
# Atende a sessão inbound criada quando o cliente ABRE o link do survey (engajamento).
# Até o clique, o `collect` do workflow estava suspenso com ZERO recurso; a sessão só
# nasce aqui — por isso cota, max_concurrent_sessions e metering `sessions` incidem
# apenas sobre engajamentos reais.
#
# Como o cliente ESTÁ PRESENTE, o survey é SÍNCRONO — e é justamente isso que permite o
# interpretador único (`menu`, perfil agent) renderizar o DialogForm ao vivo. A espera
# assíncrona ficou toda no `collect` (perfil workflow), respeitando a segregação de
# perfis (`menu` e `suspend` nunca no mesmo skill).
#
# Interpretador ÚNICO dirigido por config: o form vem de @ctx.session.dialog_form_id.
# NENHUMA métrica hardcoded — `survey_record` compõe os sinais a partir do próprio
# DialogForm (dimensions/captures), e o output_key vem do render.
#
# Contexto semeado pelo channel-gateway (handle_collect_engage), antes do inbound:
#   session.dialog_form_id        — qual DialogForm renderizar
#   session.survey_grain          — GRÃO do sinal (journey | session | workflow)  [S2]
#   session.survey_target_id      — a sessão contra a qual o sinal é chaveado     [S2]
#   session.root_session_id       — raiz canônica da journey (pertença N1)
#   session.workflow_resume_token — token p/ retomar o collect do workflow (= collect_token)
#
# Fluxo:
#   carregar_form → coletar (menu ao vivo) → gravar_sinal → retomar (workflow_resume)
#                 → finalizar

id: skill_survey_runner_v1
name: "Survey Runner (contato de survey)"
version: "1.0"
description: |
  Runner genérico do pool de survey. Renderiza o DialogForm ao vivo para o cliente que
  abriu o link, grava o sinal contra a chave da journey e retoma o workflow suspenso no
  collect. Dirigido por config (form_id no ctx); domain-blind quanto à métrica — quem
  compõe os sinais é o DialogForm.
classification:
  type: horizontal
  domain: dialog

entry: carregar_form

steps:

  # ── 1. Conteúdo: carrega o DialogForm publicado ─────────────────────────────
  - id: carregar_form
    type: invoke
    tool: form_get
    input:
      form_id:   "@ctx.session.dialog_form_id"
      tenant_id: "$.tenant_id"
    output_as: dialog
    on_success: coletar
    on_failure: retomar_falha

  # ── 2. Canal: renderiza AO VIVO (cliente presente pós-clique) ───────────────
  # Render nativo single-question (§17.4): interaction/options/validation/retry/
  # timeout vêm do próprio form. Sem `visibility`: nesta sessão o cliente É o
  # contato (participante único), então o default (all) entrega corretamente.
  - id: coletar
    type: menu
    prompt: "{{$.pipeline_state.dialog.render.prompt}}"
    interaction: "$.pipeline_state.dialog.render.interaction"
    options: "$.pipeline_state.dialog.render.options"
    validation: "$.pipeline_state.dialog.render.validation"
    retry: "$.pipeline_state.dialog.render.retry"
    timeout_s: "$.pipeline_state.dialog.render.timeout_s"
    output_as: answers
    on_success: gravar_sinal
    on_failure: retomar_falha
    on_timeout: retomar_falha
    on_disconnect: retomar_falha

  # ── 3. Sinal — grão e chave vêm do CTX, não do skill (S2) ───────────────────
  # form_id + answers → survey_record compõe os sinais pelo DialogForm (dimensions e
  # captures). output_key vem do render → genérico, sem métrica no skill.
  #
  # O GRÃO é config de DEPLOY do workflow outbound (`$.config.grain`), e a tradução
  # grão→chave é feita pelo N2 (channel-gateway), que é quem tem o contexto do chamador
  # (raiz da journey, sessão de origem). Aqui o runner só LÊ o que já veio resolvido:
  #   session.survey_grain      — journey | session | workflow
  #   session.survey_target_id  — a sessão contra a qual o sinal é chaveado
  # Assim o runner é 100% genérico: zero métrica e zero grão hardcoded. Pesquisar a
  # journey ou a sessão vira um DEPLOY diferente, não um skill diferente.
  - id: gravar_sinal
    type: invoke
    tool: survey_record
    input:
      tenant_id:         "$.tenant_id"
      origin_session_id: "@ctx.session.survey_target_id"
      grain:             "@ctx.session.survey_grain"
      # Atribuição por segmento (só populados quando grain=segment; nos demais grãos as
      # tags não existem e a ref resolve para null — `.nullish()` no schema tolera).
      segment_id:        "@ctx.session.survey_segment_id"
      agent_key:         "@ctx.session.survey_agent_key"
      # Segurança Fase B (J4c) — pool da sessão PESQUISADA, resolvido pelo N2
      # (handle_collect) e semeado no engage. Esta sessão é de INFRA do survey, então
      # NÃO se usa session.pool.id daqui (seria o pool de survey, não o do atendimento).
      pool_id:           "@ctx.session.survey_pool_id"
      survey_session_id: "$.session_id"
      form_id:           "@ctx.session.dialog_form_id"
      answers:
        - output_key: "$.pipeline_state.dialog.render.output_key"
          value:      "$.pipeline_state.answers"
    on_success: retomar
    on_failure: retomar     # sinal falhou, mas o workflow não pode ficar pendurado

  # ── 4. Retoma o workflow (o collect resolve NO FIM — decisão do modelo) ─────
  # O collect_token dobra como resume_token (gravado por handle_collect), então reusa o
  # handle_resume que já existe — sem tópico nem consumer novo.
  - id: retomar
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.session.workflow_resume_token"
      decision: "input"
      payload:
        value: "$.pipeline_state.answers"
    on_success: finalizar
    on_failure: finalizar

  # ── 4b. Falha/timeout/desconexão — retoma como timeout (nunca pendura) ──────
  - id: retomar_falha
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.session.workflow_resume_token"
      decision: "timeout"
    on_success: finalizar
    on_failure: finalizar

  # ── 5. Fecha a sessão de survey (membro N1 da journey) ──────────────────────
  - id: finalizar
    type: complete
    outcome: resolved
    issue_status: survey_completed

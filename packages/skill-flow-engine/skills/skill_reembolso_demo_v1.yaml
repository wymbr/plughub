id: skill_reembolso_demo_v1
name: Reembolso Demo
version: "1.1"
description: |
  Fluxo de solicitação de reembolso — demonstração Arc 19 (webhook workflow).
  Processo multi-sessão com análise, aprovação financeira e confirmação de pagamento.
  Lê @ctx.session.numero_pedido e @ctx.session.motivo_reembolso escritos pelo intake
  (agente_reembolso_intake_v1). Collect steps usam requires: [text] — canal neutro.
  Tempo estimado: 2–5 dias úteis.
classification:
  type: vertical

entry: registrar_solicitacao

steps:
  - id: registrar_solicitacao
    type: notify
    message: "📋 Solicitação de reembolso registrada. Iniciando análise do caso..."
    on_success: analisar_caso
    on_failure: analisar_caso

  - id: analisar_caso
    type: suspend
    reason: approval
    timeout_hours: 72
    business_hours: true
    on_resume:
      next: verificar_analise
    on_timeout:
      next: escalar_analise

  - id: verificar_analise
    type: choice
    conditions:
      - field: "@ctx.core.workflow.review_decision"
        operator: eq
        value: "approved"
        next: notificar_aprovado
      - field: "@ctx.core.workflow.review_decision"
        operator: eq
        value: "rejected"
        next: notificar_rejeitado
      - field: "@ctx.core.workflow.review_decision"
        operator: eq
        value: "needs_info"
        next: coletar_informacoes
    default: notificar_rejeitado

  - id: coletar_informacoes
    type: collect
    target:
      type: customer
      id: "@ctx.core.contact.customer_participant_id"
    requires: [text]
    prompt: "📎 Para prosseguir com o reembolso do pedido {{@ctx.session.numero_pedido}}, precisamos de informações adicionais. Por favor, envie o comprovante de compra."
    timeout_hours: 48
    output_as: informacoes_adicionais
    on_response:
      next: analisar_caso
    on_timeout:
      next: timeout_cliente

  - id: notificar_aprovado
    type: notify
    message: "✅ Reembolso aprovado! O valor será creditado em sua conta em até 5 dias úteis."
    on_success: aguardar_pagamento
    on_failure: aguardar_pagamento

  - id: aguardar_pagamento
    type: suspend
    reason: timer
    timeout_hours: 120   # 5 dias úteis
    business_hours: true
    on_resume:
      next: confirmar_pagamento
    on_timeout:
      next: confirmar_pagamento

  - id: confirmar_pagamento
    type: collect
    target:
      type: customer
      id: "@ctx.core.contact.customer_participant_id"
    requires: [text]
    prompt: "💰 O reembolso do pedido {{@ctx.session.numero_pedido}} foi processado. Você já recebeu o crédito em sua conta?"
    timeout_hours: 24
    output_as: confirmacao_pagamento
    on_response:
      next: encerrar_sucesso
    on_timeout:
      next: encerrar_sucesso

  - id: notificar_rejeitado
    type: notify
    message: "❌ Reembolso não aprovado. O caso não atende aos critérios da política de devolução."
    on_success: encerrar_rejeitado
    on_failure: encerrar_rejeitado

  - id: escalar_analise
    type: notify
    message: "⚠️ Prazo de análise excedido. Caso escalado para supervisor."
    on_success: encerrar_timeout
    on_failure: encerrar_timeout

  - id: timeout_cliente
    type: notify
    message: "⏳ Informações não enviadas no prazo. Processo encerrado."
    on_success: encerrar_timeout
    on_failure: encerrar_timeout

  - id: encerrar_sucesso
    type: complete
    outcome: resolved

  - id: encerrar_rejeitado
    type: complete
    outcome: failed

  - id: encerrar_timeout
    type: complete
    outcome: failed

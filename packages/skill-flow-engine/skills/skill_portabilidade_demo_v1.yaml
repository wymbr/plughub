id: skill_portabilidade_demo_v1
name: Portabilidade Demo
version: "1.0"
description: |
  Fluxo de portabilidade de número — demonstração Arc 10 Journey.
  Processo multi-sessão com 3 etapas: coleta de dados, validação pela operadora,
  confirmação com o cliente. Criação automática de Journey via creates_journey: true.
  Tempo estimado: 1–3 dias úteis.
classification:
  type: vertical

creates_journey: true

entry: coletar_dados

steps:
  - id: coletar_dados
    type: notify
    message: "🔄 Processo de portabilidade iniciado. Coletando seus dados de cadastro..."
    on_success: solicitar_operadora

  - id: solicitar_operadora
    type: suspend
    reason: approval
    timeout_hours: 48
    business_hours: true
    on_resume:
      next: verificar_aprovacao
    on_timeout:
      next: timeout_operadora

  - id: verificar_aprovacao
    type: choice
    conditions:
      - field: "@ctx.session.review_decision"
        operator: eq
        value: "approved"
        next: notificar_aprovado
      - field: "@ctx.session.review_decision"
        operator: eq
        value: "rejected"
        next: notificar_rejeitado
    default: aguardar_confirmacao

  - id: aguardar_confirmacao
    type: collect
    channel: webchat
    message: "✅ Portabilidade pré-aprovada pela operadora! Confirme para prosseguir."
    timeout_hours: 24
    on_response:
      next: confirmar_portabilidade
    on_timeout:
      next: timeout_cliente

  - id: confirmar_portabilidade
    type: notify
    message: "🎉 Portabilidade confirmada! Em até 1 dia útil o número estará ativo na nova operadora."
    on_success: encerrar_sucesso

  - id: notificar_aprovado
    type: notify
    message: "✅ Portabilidade aprovada pela operadora. Aguardando confirmação do cliente."
    on_success: aguardar_confirmacao

  - id: notificar_rejeitado
    type: notify
    message: "❌ Portabilidade não aprovada pela operadora. Entre em contato para mais informações."
    on_success: encerrar_rejeitado

  - id: timeout_operadora
    type: notify
    message: "⏳ Prazo da operadora excedido. Reabrindo processo automaticamente."
    on_success: encerrar_timeout

  - id: timeout_cliente
    type: notify
    message: "⏳ Confirmação não recebida. Processo encerrado por inatividade."
    on_success: encerrar_timeout

  - id: encerrar_sucesso
    type: complete
    outcome: resolved

  - id: encerrar_rejeitado
    type: complete
    outcome: failed

  - id: encerrar_timeout
    type: complete
    outcome: abandoned

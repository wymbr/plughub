id: skill_portabilidade_demo_v1
name: Portabilidade Demo
version: "2.0"
description: |
  Fluxo de portabilidade de número — demonstração Arc 19 (webhook workflow).
  v2.0: usa step delegate para I/O com o cliente em vez de notify/collect direto.
  Princípio: workflow nunca faz I/O — delega a agentes via delegate().
  Etapas:
    1. suspend: aguarda aprovação da operadora (48h)
    2. delegate: agente entrega resultado e coleta confirmação do cliente
  Lê @ctx.session.numero_atual, @ctx.session.operadora_destino e
  @ctx.session.contact_identifier escritos pelo intake.
classification:
  type: vertical

entry: solicitar_operadora

steps:
  # ── Etapa 1: aguardar aprovação da operadora ─────────────────────────────────
  # Suspend puro — o workflow dorme até o sinal externo de aprovação/rejeição.
  # A notificação de início já foi enviada pelo intake antes de acionar o workflow.
  - id: solicitar_operadora
    type: suspend
    reason: approval
    timeout_hours: 48
    business_hours: true
    on_resume:
      next: notificar_e_confirmar    # decision=approved
    on_reject:
      next: encerrar_rejeitado       # decision=rejected
    on_timeout:
      next: encerrar_timeout

  # ── Etapa 2: notificar aprovação e coletar confirmação do cliente ─────────────
  # delegate(): workflow suspende e despacha agente para I/O com o cliente.
  # O agente recebe contact_identifier e numero_atual via context.
  # Ao concluir, o agente chama workflow_resume com decision=input|timeout.
  - id: notificar_e_confirmar
    type: delegate
    pool: portabilidade_confirmacao
    context:
      contact_identifier: "@ctx.session.contact_identifier"
      numero_atual:        "@ctx.session.numero_atual"
      operadora_destino:   "@ctx.session.operadora_destino"
    timeout_hours: 24
    on_resume:
      next: encerrar_sucesso          # decision=input (cliente confirmou)
    on_reject:
      next: encerrar_cancelado        # decision=rejected (cliente cancelou)
    on_timeout:
      next: encerrar_timeout_cliente  # decision=timeout

  # ── Desfechos ────────────────────────────────────────────────────────────────
  - id: encerrar_sucesso
    type: complete
    outcome: resolved

  - id: encerrar_rejeitado
    type: complete
    outcome: failed

  - id: encerrar_cancelado
    type: complete
    outcome: failed

  - id: encerrar_timeout
    type: complete
    outcome: failed

  - id: encerrar_timeout_cliente
    type: complete
    outcome: failed

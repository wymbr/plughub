id: skill_portabilidade_demo_v1
name: Portabilidade Demo
version: "2.0"
description: |
  Fluxo de portabilidade de número — demonstração Arc 19 (webhook workflow).
  v2.0: usa step delegate para I/O com o cliente em vez de notify/collect direto.
  Princípio: workflow nunca faz I/O — delega a agentes via delegate().
  Etapas:
    1. suspend: aguarda aprovação da operadora (48h)
    2. delegate: agente entrega resultado e coleta confirmação do cliente
  Nasce pela porta de plataforma (`skill_intake_runner_v1` no pool `portabilidade_ia`,
  PID-17): o número a portar é a ÂNCORA provada (`session.phone`, escrita por último pelo
  gatilho); operadora e contato de retorno vêm do formulário (`session.<campo>`).
  Número e operadora são gravados na JOURNEY antes da espera, porque quem os mostra ao
  cliente é o agente de confirmação chamado pela porta, que não os recebe.
classification:
  type: vertical

entry: registrar_numero_journey

steps:
  # ── Etapa 0: os fatos do PEDIDO moram na journey desde o nascimento ──────────
  # PID-17 (2026-09-14): a porta de plataforma delega a continuidade ao
  # `portabilidade_confirmacao` sem repassar os campos do domínio (ela não os conhece, e
  # o cadastro do ContextStore recusa nome de tag decidido em runtime). O número é a
  # ÂNCORA que a porta identificou — nunca um campo do formulário, que não consegue
  # trocá-la (o gatilho escreve a âncora por último).
  - id: registrar_numero_journey
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag:        "journey.numero_atual"
      value:      "@ctx.session.phone"
      confidence: 1.0
      visibility: "agents_only"
    on_success: registrar_operadora_journey
    on_failure: registrar_operadora_journey

  - id: registrar_operadora_journey
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag:        "journey.operadora_destino"
      value:      "@ctx.session.operadora_destino"
      confidence: 1.0
      visibility: "agents_only"
    on_success: solicitar_operadora
    on_failure: solicitar_operadora

  # ── Etapa 1: aguardar aprovação da operadora ─────────────────────────────────
  # Suspend puro — o workflow dorme até o sinal externo de aprovação/rejeição.
  # A notificação de início já foi enviada pelo intake antes de acionar o workflow.
  - id: solicitar_operadora
    type: suspend
    reason: approval
    timeout_hours: 48
    business_hours: true
    on_resume:
      next: determinar_canal_confirmacao    # decision=approved → determina canal antes de delegar
    on_reject:
      next: encerrar_rejeitado             # decision=rejected
    on_timeout:
      next: encerrar_timeout

  # ── Etapa 1b: determinar canal de confirmação ─────────────────────────────────
  # Session B define qual canal usar para contatar o cliente, ANTES de delegar.
  # O agente_confirmacao lê session.confirmation_channel para decidir:
  #   inbound_only → complete silencioso (Session B fica pendente; cliente reconnecta)
  #   email        → envia email proativamente (implementar adapter)
  #   whatsapp     → envia WhatsApp proativamente (implementar adapter)
  # Heurística atual: contact_identifier com "@" → email; caso contrário, inbound_only.
  # Adicionar caso "whatsapp" quando pool tiver adapter WhatsApp configurado.
  - id: determinar_canal_confirmacao
    type: choice
    conditions:
      - field:    "@ctx.session.contact_identifier"
        operator: contains
        value:    "@"
        next:     setar_canal_email
    default: setar_canal_inbound_only

  - id: setar_canal_email
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag:        "session.confirmation_channel"
      value:      "email"
      confidence: 1.0
      visibility: "agents_only"
    on_success: notificar_e_confirmar
    on_failure: notificar_e_confirmar

  - id: setar_canal_inbound_only
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag:        "session.confirmation_channel"
      value:      "inbound_only"
      confidence: 1.0
      visibility: "agents_only"
    on_success: notificar_e_confirmar
    on_failure: notificar_e_confirmar

  # ── Etapa 2: delegar I/O ao agente de confirmação ────────────────────────────
  # agente_confirmacao lê confirmation_channel e decide o comportamento:
  #   inbound_only → complete sem chamar workflow_resume (Session B fica suspenso;
  #                  pending_workflow key válida; cliente reconecta e confirma)
  #   outbound     → contata cliente proativamente e chama workflow_resume
  - id: notificar_e_confirmar
    type: delegate
    pool: portabilidade_confirmacao
    # Identity Resolver (nível b) — o workflow suspende aguardando o RETORNO do
    # cliente; indexa a pendência sob o customer_id nativo para retomada
    # channel-abstract (reconecta de qualquer canal). offer = default anti-enumeração.
    customer_resumable: true
    resume_policy: offer
    # PID-06 (ADR identity-door D7) — a retomada pelo CLIENTE exige prova de posse feita NA
    # sessão que pede o token. O valor é do deploy (`config_json.resume_requires`); o piso
    # é deste skill e o deploy recusa config que não o contenha.
    resume_requires: "$.config.resume_requires"
    resume_requires_floor: ["otp"]
    context:
      # Número e operadora NÃO viajam aqui desde a PID-17: o agente os lê da journey,
      # que é a mesma casa quando quem o chama é a porta (uma casa por fato).
      #
      # Âncora da pendência — chave `phone`, lida como IDENTIDADE por
      # `_anchors_from_context` (channel-gateway), como a `cpf` do limite_processo.
      # ⚠️ `contact_identifier` SAIU daqui na PID-17, e não por limpeza: aquela chave
      # também é lida como âncora (telefone), e desde a porta ela é um campo do
      # FORMULÁRIO. Medido ao vivo: com ela, a pendência foi indexada sob um cliente
      # PROVISIONADO a partir do texto digitado (`matched_by=provisioned`), e o titular
      # que provou a linha nunca a encontraria. O processo continua lendo o contato de
      # retorno de `session.contact_identifier` — o delegate roda na sessão dele.
      phone:                 "@ctx.session.phone"
      confirmation_channel:  "@ctx.session.confirmation_channel"
    timeout_hours: 24
    on_resume:
      next: encerrar_sucesso          # decision=input (cliente confirmou)
    on_reject:
      next: encerrar_cancelado        # decision=rejected (cliente cancelou — PID-15; até a
                                      # PID-17 o agente cancelava com `input` e caía em sucesso)
    on_timeout:
      next: encerrar_timeout_cliente  # decision=timeout

  # ── Desfechos ────────────────────────────────────────────────────────────────
  - id: encerrar_sucesso
    type: complete
    outcome: resolved

  - id: encerrar_rejeitado
    type: complete
    outcome: failed

  - id: encerrar_cancelado
    type: complete
    outcome: failed

  - id: encerrar_timeout
    type: complete
    outcome: failed

  - id: encerrar_timeout_cliente
    type: complete
    outcome: failed

id: skill_portabilidade_demo_v1
name: Portabilidade Demo
version: "1.1"
description: |
  Fluxo de portabilidade de número — demonstração Arc 19 (webhook workflow).
  Processo multi-sessão com 3 etapas: validação pela operadora (suspend/resume),
  confirmação com o cliente (collect com requires: [text] — canal neutro).
  Lê @ctx.session.numero_atual e @ctx.session.operadora_destino escritos pelo intake.
  Tempo estimado: 1–3 dias úteis.
classification:
  type: vertical

entry: coletar_dados

steps:
  - id: coletar_dados
    type: notify
    message: "🔄 Processo de portabilidade iniciado. Coletando seus dados de cadastro..."
    on_success: solicitar_operadora
    on_failure: solicitar_operadora

  - id: solicitar_operadora
    type: suspend
    reason: approval
    timeout_hours: 48
    business_hours: true
    on_resume:
      next: notificar_aprovado    # decision=approved → approved
    on_reject:
      next: notificar_rejeitado   # decision=rejected → rejected
    on_timeout:
      next: timeout_operadora

  - id: aguardar_confirmacao
    type: collect
    target:
      type: customer
      id: "@ctx.session.contact_identifier"
    requires: [text]
    prompt: "✅ Portabilidade do número {{@ctx.session.numero_atual}} para {{@ctx.session.operadora_destino}} foi pré-aprovada! Confirme para prosseguir com a transferência."
    timeout_hours: 24
    output_as: confirmacao_portabilidade
    on_response:
      next: confirmar_portabilidade
    on_timeout:
      next: timeout_cliente

  - id: confirmar_portabilidade
    type: notify
    message: "🎉 Portabilidade confirmada! Em até 1 dia útil o número estará ativo na nova operadora."
    on_success: encerrar_sucesso
    on_failure: encerrar_sucesso

  - id: notificar_aprovado
    type: notify
    message: "✅ Portabilidade aprovada pela operadora. Aguardando confirmação do cliente."
    on_success: aguardar_confirmacao
    on_failure: aguardar_confirmacao

  - id: notificar_rejeitado
    type: notify
    message: "❌ Portabilidade não aprovada pela operadora. Entre em contato para mais informações."
    on_success: encerrar_rejeitado
    on_failure: encerrar_rejeitado

  - id: timeout_operadora
    type: notify
    message: "⏳ Prazo da operadora excedido. Reabrindo processo automaticamente."
    on_success: encerrar_timeout
    on_failure: encerrar_timeout

  - id: timeout_cliente
    type: notify
    message: "⏳ Confirmação não recebida. Processo encerrado por inatividade."
    on_success: encerrar_timeout
    on_failure: encerrar_timeout

  - id: encerrar_sucesso
    type: complete
    outcome: resolved

  - id: encerrar_rejeitado
    type: complete
    outcome: failed

  - id: encerrar_timeout
    type: complete
    outcome: failed

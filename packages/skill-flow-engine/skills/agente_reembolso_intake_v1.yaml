# agente_reembolso_intake_v1.yaml
# Reembolso Intake — Agente de Coleta Determinístico (Tier 3)
#
# Roda em reembolso_ia como agente principal na Phase 1.
# Na Phase 2, será invocado via task step pelo Tier 2 (skill_atendimento_reembolso_v1).
#
# Pool: reembolso_ia
# Tier: 3 (Interaction Agent — I/O atômico com o cliente)
#
# Responsabilidade:
#   1. Coletar numero_pedido e motivo_reembolso do cliente
#   2. Persistir dados no ContextStore (namespace session.*)
#   3. Confirmar ao cliente o registro e o prazo estimado
#
# Fluxo:
#   1. saudacao              — notify: boas-vindas ao fluxo de reembolso
#   2. coletar_numero_pedido — menu text: número do pedido
#   3. coletar_motivo        — menu list: motivo do reembolso
#   4. confirmar_dados       — notify: exibe dados coletados
#   5. escrever_numero       — invoke context_set: session.numero_pedido
#   6. escrever_motivo       — invoke context_set: session.motivo_reembolso
#   7. avisar_inicio         — notify: confirmação + prazo estimado
#   8. finalizar             — complete outcome: resolved
#   9. finalizar_timeout     — complete outcome: failed

id: skill_reembolso_intake_v1
name: "Reembolso Intake v1 — Coleta e Início de Jornada"
version: "1.0"
description: |
  Agente de coleta determinístico (Tier 3) para o fluxo de reembolso.
  Coleta número do pedido e motivo via menus sem LLM.
  Persiste os dados no namespace session.* do ContextStore.
  O cliente encerra o segmento após confirmação do registro.
classification:
  type: orchestrator
  domain: reembolso

entry: saudacao

steps:

  # ── Etapa 1: saudação ─────────────────────────────────────────────────────────
  - id: saudacao
    type: notify
    message: "Olá! Vou registrar sua solicitação de reembolso. O processo leva entre 2 e 5 dias úteis e você receberá atualizações por aqui."
    on_success: coletar_numero_pedido
    on_failure: coletar_numero_pedido

  # ── Etapa 2: coletar número do pedido ────────────────────────────────────────
  - id: coletar_numero_pedido
    type: menu
    prompt: "Qual é o número do pedido para o qual deseja solicitar o reembolso?"
    interaction: text
    output_as: numero_pedido
    timeout_s: 180
    on_success: coletar_motivo
    on_failure: sair_timeout
    on_timeout: sair_timeout
    on_disconnect: sair_timeout

  # ── Etapa 3: coletar motivo do reembolso ─────────────────────────────────────
  - id: coletar_motivo
    type: menu
    prompt: "Qual é o motivo do reembolso?"
    interaction: list
    options:
      - id: produto_defeituoso
        label: "❌ Produto defeituoso ou danificado"
      - id: nao_recebido
        label: "📦 Produto não recebido"
      - id: arrependimento
        label: "↩️ Arrependimento / desistência"
      - id: cobranca_incorreta
        label: "💳 Cobrança incorreta ou duplicada"
      - id: outros
        label: "📋 Outro motivo"
    output_as: motivo_reembolso
    timeout_s: 120
    on_success: confirmar_dados
    on_failure: sair_timeout
    on_timeout: sair_timeout
    on_disconnect: sair_timeout

  # ── Etapa 4: confirmar dados coletados ───────────────────────────────────────
  - id: confirmar_dados
    type: notify
    message: "📋 Vou registrar sua solicitação com os seguintes dados:\n• Pedido: {{$.pipeline_state.numero_pedido}}\n• Motivo: {{$.pipeline_state.motivo_reembolso}}\n\nAguarde enquanto processo o registro..."
    on_success: escrever_numero
    on_failure: escrever_numero

  # ── Etapa 5: persistir numero_pedido no ContextStore (session.*) ───────────────
  - id: escrever_numero
    type: invoke
    tool: context_set
    input:
      tag: "session.numero_pedido"
      value: "$.pipeline_state.numero_pedido"
      confidence: 1.0
      visibility: "agents_only"
    on_success: escrever_motivo
    on_failure: escrever_motivo   # continua mesmo se context_set falhar

  # ── Etapa 6: persistir motivo_reembolso no ContextStore (session.*) ────────────
  - id: escrever_motivo
    type: invoke
    tool: context_set
    input:
      tag: "session.motivo_reembolso"
      value: "$.pipeline_state.motivo_reembolso"
      confidence: 1.0
      visibility: "agents_only"
    on_success: avisar_inicio
    on_failure: avisar_inicio   # continua mesmo se context_set falhar

  # ── Etapa 7: confirmar registro ao cliente ────────────────────────────────────
  - id: avisar_inicio
    type: notify
    message: "✅ Solicitação de reembolso registrada com sucesso!\n\n📋 Protocolo: {{$.pipeline_state.numero_pedido}}\n⏱️ Prazo de análise: até 3 dias úteis\n\nSe aprovado, o valor será creditado em até 5 dias úteis adicionais. Você receberá uma mensagem aqui com a atualização."
    on_success: sair_resolvido
    on_failure: sair_resolvido

  # ── Saída do EXECUTOR (CTR-04) ────────────────────────────────────────────────
  #
  # Este skill é um EXECUTOR: quem decide o desfecho do CONTATO é quem o chamou.
  # Todo desfecho passa por um `sair_*`, que devolve o controle ao chamador ANTES
  # de fechar o próprio segmento.
  #
  # ⚠️ **O retorno é CONDICIONAL, e a condição não é zelo.** Um especialista pode
  # ser alcançado de duas formas — delegado por um orquestrador (há token) ou por
  # porta própria de canal (não há). Medido em 2026-09-06: dos 5 especialistas,
  # `sac_ia` TEM endpoint de canal (`webchat/sac`). Devolver incondicionalmente
  # faria o `workflow_resume` falhar em todo contato direto, e erro rotineiro em
  # log é ruído que treina todo mundo a ignorar o log.
  #
  # ⚠️ **`on_failure` do retorno vai para o mesmo `complete`, de propósito.** Se o
  # token existir mas estiver vencido ou já consumido, o segmento fecha do mesmo
  # jeito — o cliente não paga pelo chamador ter desistido. A falha aparece no log
  # do `invoke`, que é onde ela é acionável.
  - id: sair_resolvido
    type: choice
    conditions:
      - field: "@ctx.core.workflow.delegate_resume_token"
        operator: exists
        next: devolver_resolvido
    default: finalizar

  - id: devolver_resolvido
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.delegate_resume_token"
      decision: "input"
      payload:
        outcome:       "resolved"
        numero_pedido: "$.pipeline_state.numero_pedido"
        motivo:        "$.pipeline_state.motivo_reembolso"
    on_success: finalizar
    on_failure: finalizar

  - id: sair_timeout
    type: choice
    conditions:
      - field: "@ctx.core.workflow.delegate_resume_token"
        operator: exists
        next: devolver_timeout
    default: finalizar_timeout

  - id: devolver_timeout
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.delegate_resume_token"
      decision: "timeout"
      payload:
        outcome: "failed"
    on_success: finalizar_timeout
    on_failure: finalizar_timeout

  # ── Terminais (fecham o SEGMENTO deste executor, nunca o contato) ─────────────
  - id: finalizar
    type: complete
    outcome: resolved

  - id: finalizar_timeout
    type: complete
    outcome: failed

# skill_atendimento_sac_v1.yaml
# SAC — Execução Determinística (Tier 2)
#
# Skill de execução SAC sem LLM — validação Phase 1 do plano de testes.
# Substituirá os steps notify por steps reason (LLM real) na Phase 2.
#
# Pool: sac_ia
# Agent: agente_sac_ia_v1 (atualizado para apontar para este skill no Sprint 1A)
#
# Fluxo:
#   1. saudacao               — notify: boas-vindas + aviso de jornada registrada
#   2. menu_motivo            — menu list: escolha o motivo do contato
#   3. roteador_motivo        — choice: distribui por motivo
#
#   Caminho A — info_plano:
#     4a. resposta_info_plano → menu_resolucao
#
#   Caminho B — status_servico:
#     4b. resposta_status     → menu_resolucao
#
#   Caminho C — problema_tecnico:
#     4c. coletar_descricao   → acusar_recebimento → menu_resolucao
#
#   Caminho D — falar_especialista:
#     4d. avisar_escalada     → escalar → retencao_humano
#
#   5. menu_resolucao         — menu button: Resolvido | Falar com especialista
#   6. roteador_resolucao     — choice: resolve ou escala
#   7. avisar_escalada        — notify → escalar → retencao_humano
#   8. finalizar_resolvido    — complete outcome: resolved
#   9. finalizar_timeout      — complete outcome: abandoned
#  10. encerrar_fallback      — complete outcome: failed
#
# Dados gerados (observáveis no Monitor e Analytics):
#   conversations.participants: segmentos sac_ia + retencao_humano (quando escala)
#   on_human_end hooks: wrapup_ia + nps_ia disparados automaticamente pelo pool retencao_humano
#   usage.events: sessions, messages
#
# Phase 2 — LLM:
#   - Substituir resposta_info_plano, resposta_status, acusar_recebimento por steps reason
#   - Adicionar acumular_contexto (task agente_contexto_ia_v1) antes de escalar
#   - Habilitar context_tags.outputs para escrever session.motivo_contato no ContextStore

id: skill_atendimento_sac_v1
name: "Atendimento SAC v1 — Execução Determinística"
version: "1.0"
description: |
  Skill de execução SAC (Tier 2) — determinístico, sem LLM.
  Apresenta menu de motivo de contato e responde com conteúdo fixo.
  Oferece escalação para retenção humana com hooks NPS + wrap-up.
  Phase 1: conteúdo fixo — valida fluxo, dados e integrações.
  Phase 2: steps reason substituem as respostas fixas (LLM real).
classification:
  type: orchestrator
  domain: customer_service

entry: saudacao

steps:

  # ── Etapa 1: saudação ─────────────────────────────────────────────────────────
  - id: saudacao
    type: notify
    message: "Olá! Você está no SAC PlugHub Demo. Sua jornada de atendimento foi registrada e estamos prontos para ajudar."
    on_success: veio_da_navegacao
    on_failure: veio_da_navegacao

  # ── O menu DUPLICADO morre aqui (F4/ORQ-04) ──────────────────────────
  # Medido em contato real (2026-09-06): o cliente escolhia *SAC → Informações sobre o
  # plano* na navegação, era escalado para cá em 3 s, e este skill perguntava **a mesma
  # coisa de novo**. As duas listas casavam por id — não eram menus parecidos, era o
  # MESMO menu em dois artefatos, com dois deploys. Quem viu a tela leu como defeito
  # da navegação.
  #
  # ⚠️ **O menu FICA, e isso é decisão.** Este pool tem endpoint de canal próprio: o
  # cliente pode cair aqui direto, sem passar por navegação nenhuma. Apagar o menu
  # consertaria o caminho novo e quebraria o antigo. O que muda é que ele deixa de ser
  # o ÚNICO caminho — quem chega com o caminho já escolhido pula direto para a resposta.
  #
  # ⚠️ Compara o CAMINHO INTEIRO (`sac.info_plano`), não a folha: folha sozinha se
  # repete entre pastas, e um dia `financeiro.status_servico` cairia no ramo errado.
  - id: veio_da_navegacao
    type: choice
    conditions:
      - field: "@ctx.session.navegacao.path"
        operator: eq
        value: "sac.info_plano"
        next: resposta_info_plano
      - field: "@ctx.session.navegacao.path"
        operator: eq
        value: "sac.status_servico"
        next: resposta_status
      - field: "@ctx.session.navegacao.path"
        operator: eq
        value: "sac.problema_tecnico"
        next: coletar_descricao
    # Sem tag (entrada direta) ou caminho que este skill não cobre ⇒ pergunta, como
    # sempre fez. Default que PERGUNTA é seguro; default que adivinha o motivo não.
    default: menu_motivo

  # ── Etapa 2: menu de motivo ───────────────────────────────────────────────────
  # list suporta mais de 3 opções. Channel Gateway adapta para canais sem suporte.
  - id: menu_motivo
    type: menu
    prompt: "Qual é o motivo do seu contato?"
    interaction: list
    options:
      - id: info_plano
        label: "📋 Informações sobre o plano"
      - id: status_servico
        label: "🔍 Status do serviço"
      - id: problema_tecnico
        label: "🔧 Problema técnico"
      - id: falar_especialista
        label: "👤 Falar com especialista humano"
    output_as: motivo_contato
    timeout_s: 120
    on_success: roteador_motivo
    on_failure: sair_timeout
    on_timeout: sair_timeout
    on_disconnect: sair_timeout

  # ── Etapa 3: roteador por motivo ─────────────────────────────────────────────
  - id: roteador_motivo
    type: choice
    conditions:
      - field: "$.pipeline_state.motivo_contato"
        operator: eq
        value: "info_plano"
        next: resposta_info_plano
      - field: "$.pipeline_state.motivo_contato"
        operator: eq
        value: "status_servico"
        next: resposta_status
      - field: "$.pipeline_state.motivo_contato"
        operator: eq
        value: "problema_tecnico"
        next: coletar_descricao
      - field: "$.pipeline_state.motivo_contato"
        operator: eq
        value: "falar_especialista"
        next: sair_humano
    default: menu_motivo

  # ── Caminho A: Informações sobre o plano ─────────────────────────────────────
  # Phase 2: substituir por step reason com prompt contextual.
  - id: resposta_info_plano
    type: notify
    message: |
      📋 *Informações sobre nosso serviço:*

      • Plano Básico: atendimento por chat e e-mail, 8h às 18h
      • Plano Pro: chat, WhatsApp e voz, 8h às 22h, SLA de 4h
      • Plano Enterprise: todos os canais, 24/7, SLA garantido de 1h

      Para contratar ou migrar de plano, posso conectá-lo a um especialista.
    on_success: continuar_ou_devolver
    on_failure: continuar_ou_devolver

  # ── Caminho B: Status do serviço ─────────────────────────────────────────────
  # Phase 2: substituir por invoke ao status-api ou step reason.
  - id: resposta_status
    type: notify
    message: |
      🔍 *Status dos serviços PlugHub Demo:*

      • Chat / WhatsApp: ✅ Operacional
      • Voz (PSTN):      ✅ Operacional
      • WebRTC:          ✅ Operacional
      • API Gateway:     ✅ Operacional

      Última verificação: há menos de 1 minuto. Sem incidentes ativos.
    on_success: continuar_ou_devolver
    on_failure: continuar_ou_devolver

  # ── Caminho C: Problema técnico ──────────────────────────────────────────────
  - id: coletar_descricao
    type: menu
    prompt: "Descreva brevemente o problema técnico que está enfrentando:"
    interaction: text
    output_as: descricao_problema
    timeout_s: 180
    on_success: acusar_recebimento
    on_failure: sair_timeout
    on_timeout: sair_timeout
    on_disconnect: sair_timeout

  # Phase 2: substituir por step reason que analisa a descrição e decide se resolve
  # diretamente ou escala para humano.
  - id: acusar_recebimento
    type: notify
    message: "✅ Problema registrado! Nossa equipe de suporte técnico irá analisar e retornar em até 2 horas úteis. Enquanto isso, posso te ajudar com mais alguma coisa?"
    on_success: continuar_ou_devolver
    on_failure: continuar_ou_devolver

  # ── Menu de resolução ─────────────────────────────────────────────────────────
  # Botões (≤ 3) — funciona nativamente em WhatsApp e WebChat.
  # ── Quem pergunta *"mais alguma coisa?"* — eu ou meu chamador? (RET-05) ──────
  #
  # ⚠️ **Sem isto o cliente e perguntado DUAS vezes.** Com chamador, este skill
  # devolve o controle e o orquestrador abre a question de continuacao da arvore;
  # se o menu abaixo rodasse antes, o cliente responderia aqui e seria perguntado
  # de novo la — foi exatamente a tela que o dono leu como defeito no `menu_motivo`,
  # um turno adiante.
  #
  # ⚠️ **E o menu FICA, como o `menu_motivo` ficou**: `sac_ia` tem endpoint de canal
  # proprio (`webchat/sac`, 198 segmentos medidos), entao ha cliente que chega aqui
  # sem orquestrador nenhum. Apagar consertaria o caminho novo e quebraria o antigo.
  - id: continuar_ou_devolver
    type: choice
    conditions:
      - field: "@ctx.core.workflow.delegate_resume_token"
        operator: exists
        next: sair_resolvido
    default: menu_resolucao

  - id: menu_resolucao
    type: menu
    prompt: "Posso te ajudar com mais alguma coisa?"
    interaction: button
    options:
      - id: resolvido
        label: "✅ Resolvido, obrigado!"
      - id: especialista
        label: "👤 Falar com especialista"
    output_as: decisao_resolucao
    timeout_s: 120
    on_success: roteador_resolucao
    on_failure: sair_resolvido
    on_timeout: sair_resolvido
    on_disconnect: sair_resolvido

  - id: roteador_resolucao
    type: choice
    conditions:
      - field: "$.pipeline_state.decisao_resolucao"
        operator: eq
        value: "resolvido"
        next: sair_resolvido
      - field: "$.pipeline_state.decisao_resolucao"
        operator: eq
        value: "especialista"
        next: sair_humano
    default: sair_humano

  # ── NPS: hook on_contact_end (mecanismo genérico de fim-de-contato) ───────────
  # O NPS NÃO é disparado pelo skill: é coletado na conferência pelo hook
  # on_contact_end (side=customer) declarado no pool sac_ia → pool nps_contato_ia
  # (agente_nps_contato_v1, grão session). O bridge segura a sessão do cliente até o
  # NPS concluir e não oferece se o cliente caiu (nps_on_disconnect=skip). Por isso
  # o caminho `resolvido` segue direto para `finalizar_resolvido`. A survey OUTBOUND
  # (skill_survey_v1) é padrão de SKILL para casos especiais (multi-humano) — não usada
  # aqui. Ver §14.2 de docs/arcos/analytics-agents-workbench.md.

  # ── Caminho D: Escalada para agente humano ────────────────────────────────────
  # Phase 2: inserir step task (agente_contexto_ia_v1, mode: assist) antes de
  # avisar_escalada para enriquecer pipeline_state com dados do cliente.
  - id: avisar_escalada
    type: notify
    message: "Entendido! Vou conectar você agora a um de nossos especialistas. Um momento, por favor."
    on_success: escalar
    on_failure: escalar

  - id: escalar
    type: escalate
    target:
      pool: retencao_humano
    context: pipeline_state
    error_reason: escalated_to_human
    # F7: motivo de escalação normalizado declarado pelo agente IA. Phase-1 escala
    # sempre p/ especialista humano → reason estático. executeEscalate persiste em
    # pipeline_state.results.escalation_reason; o bridge grava no segmento da IA na
    # conclusão (lente escalation_reason). Ids espelham agent_activity/escalation_reasons.
    reason: specialist_needed
    on_failure: encerrar_fallback

  # ── Fallback de escalação ─────────────────────────────────────────────────────
  - id: encerrar_fallback
    type: complete
    outcome: failed
    issue_status: "Escalação para humano falhou — pool retencao_humano indisponível"

  # ── Saída do EXECUTOR (CTR-04) ────────────────────────────────────────────────
  #
  # ⚠️ **Este skill tem PORTA PRÓPRIA** (`webchat/sac` → `sac_ia`, medido
  # 2026-09-06) — é o único dos cinco especialistas que atende contato direto. Por
  # isso o retorno é condicional ao token e o caminho antigo fica inteiro: sem
  # chamador ele resolve, escala e encerra exatamente como sempre fez.
  #
  # ⚠️ **O pedido de humano é PROPOSTA, não despacho.** Antes ele escalava sozinho
  # para `retencao_humano`; com chamador, devolve `precisa_humano` e quem decide
  # transferir é o orquestrador — que é a razão de ele existir. A interceptação vem
  # ANTES do `avisar_escalada`, senão o cliente lê *"vou conectar você agora a um
  # de nossos especialistas"* e o contato volta para o menu.
  - id: sair_resolvido
    type: choice
    conditions:
      - field: "@ctx.core.workflow.delegate_resume_token"
        operator: exists
        next: devolver_resolvido
    default: finalizar_resolvido

  - id: devolver_resolvido
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.delegate_resume_token"
      decision: "input"
      payload:
        outcome: "resolved"
        # O caminho da árvore que trouxe o cliente até aqui, devolvido ao chamador
        # para que o evento de desfecho case com o de demanda (D4).
        caminho: "@ctx.session.navegacao.path"
    on_success: finalizar_resolvido
    on_failure: finalizar_resolvido

  - id: sair_humano
    type: choice
    conditions:
      - field: "@ctx.core.workflow.delegate_resume_token"
        operator: exists
        next: devolver_humano
    default: avisar_escalada

  - id: devolver_humano
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.delegate_resume_token"
      decision: "rejected"
      payload:
        outcome: "escalated"
        motivo:  "precisa_humano"
    on_success: finalizar_resolvido
    on_failure: avisar_escalada   # sem retomada, escala como sempre fez

  - id: sair_timeout
    type: choice
    conditions:
      - field: "@ctx.core.workflow.delegate_resume_token"
        operator: exists
        next: devolver_timeout
    default: finalizar_timeout

  - id: devolver_timeout
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.delegate_resume_token"
      decision: "timeout"
      payload:
        outcome: "failed"
    on_success: finalizar_timeout
    on_failure: finalizar_timeout

  # ── Fechamentos (fecham o SEGMENTO deste executor, nunca o contato) ───────────
  - id: finalizar_resolvido
    type: complete
    outcome: resolved

  - id: finalizar_timeout
    type: complete
    outcome: failed

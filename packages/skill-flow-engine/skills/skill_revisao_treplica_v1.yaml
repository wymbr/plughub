id: skill_revisao_treplica_v1
name: "Motor de Revisão com Contestação — Arc 13 Fase D"
version: "2.0"
description: |
  Motor de estado para o ciclo completo de revisão/contestação de avaliação.
  Controla deadlines, roteia para revisor AI ou humano, e gerencia múltiplos rounds.

  Fluxo por round:
    1. Aguarda contestação do agente humano avaliado (contest_deadline_hours)
    2. Se contestou → roteia para revisor AI ou humano (reviewer_type)
       - AI:    dispatch agente_revisor_v1 via task step
       - human: suspend aguardando decisão humana (review_deadline_hours)
       - ai_then_human: AI primeiro; se falhar → human
    3. Verifica se max_rounds atingido → loop ou finaliza
    4. Timeout em qualquer ponto → congela resultado no estado atual

  Contexto esperado no ContextStore (escrito pela evaluation-api antes do trigger):
    session.instance_id           — ID da EvaluationInstance
    session.result_id             — ID do EvaluationResult
    session.reviewer_type         — "ai" | "human" | "ai_then_human"
    session.max_rounds            — máximo de rounds (padrão 3)
    session.contest_deadline_hours — prazo para o avaliado contestar (horas)
    session.review_deadline_hours  — prazo para o revisor humano decidir (horas)
    session.use_business_hours    — true = apenas em horário comercial
    core.workflow.current_round         — inicializado em 0; incrementado a cada contestação

  Interação com evaluation-api:
    - evaluation-api escreve core.workflow.review_decision antes de cada resume:
        "approved"  — agente humano não contestou (prazo expirou sem contestação)
        "contested" — agente humano contestou ≥1 dimensão
        "reviewed"  — revisor humano submeteu decisão
    - agente_revisor_v1 escreve via evaluation_review_submit (Kafka → evaluation-api)
    - evaluation_lock congela o resultado em timeout ou max_rounds
classification:
  type: vertical

entry: aguardar_contestacao

steps:

  # ── Aguarda contestação do agente humano avaliado ─────────────────────────────
  # Timeout: contest_deadline_hours (lido do ContextStore, padrão 72h).
  # Se o prazo expirar sem contestação → contestation_state=timeout_contestation → congelar.
  # Se o agente contestou → evaluation-api resume o workflow com review_decision="contested".
  - id: aguardar_contestacao
    type: suspend
    reason: input
    timeout_hours: 72
    business_hours: true
    on_resume:
      next: verificar_contestacao
    on_timeout:
      next: congelar_resultado

  # ── Verifica se houve contestação ou aprovação tácita ────────────────────────
  - id: verificar_contestacao
    type: choice
    conditions:
      - field:    "@ctx.core.workflow.review_decision"
        operator: eq
        value:    "contested"
        next:     incrementar_round
    default: encerrar_aprovado  # approved ou qualquer outro valor → sem contestação

  # ── Incrementa round e verifica limite (max_rounds) ──────────────────────────
  - id: incrementar_round
    type: invoke
    tool: context_write
    input:
      tag:   core.workflow.current_round
      value: "{{add(@ctx.core.workflow.current_round, 1)}}"
    on_success: verificar_limite_rounds
    on_failure: congelar_resultado

  - id: verificar_limite_rounds
    type: choice
    conditions:
      - field:    "@ctx.core.workflow.current_round"
        operator: gt
        value:    "@ctx.session.max_rounds"
        next:     congelar_resultado
    default: rotear_revisor

  # ── Roteia para AI ou humano baseado em reviewer_type ────────────────────────
  - id: rotear_revisor
    type: choice
    conditions:
      - field:    "@ctx.session.reviewer_type"
        operator: eq
        value:    "ai"
        next:     dispatch_revisor_ai
      - field:    "@ctx.session.reviewer_type"
        operator: eq
        value:    "ai_then_human"
        next:     dispatch_revisor_ai
    default: aguardar_revisao_humana   # reviewer_type="human" ou fallback

  # ── Dispatch do revisor AI (agente_revisor_v1) via A2A ───────────────────────
  # O agente lê threads round=1, 1.5 e 2 via evaluation_threads_get,
  # decide por dimensão e submete via evaluation_review_submit.
  # on_failure → tenta roteamento para humano (ai_then_human) ou congela.
  - id: dispatch_revisor_ai
    type: task
    target:
      skill_id: skill_revisao_v1
    mode: assist
    on_success: verificar_revisao_ai
    on_failure: fallback_para_humano

  # ── Verifica resultado da revisão AI ─────────────────────────────────────────
  # evaluation_review_submit sinaliza se o resultado foi finalizado (max_rounds)
  # ou se ainda há rounds disponíveis.
  - id: verificar_revisao_ai
    type: choice
    conditions:
      - field:    "@ctx.core.workflow.review_decision"
        operator: eq
        value:    "finalized"
        next:     encerrar_aprovado
    default: aguardar_proxima_contestacao  # resultado publicado, aguarda próximo round

  # ── Fallback para humano quando AI falha (ai_then_human) ─────────────────────
  # Se reviewer_type="ai" (sem fallback humano) → congela diretamente.
  - id: fallback_para_humano
    type: choice
    conditions:
      - field:    "@ctx.session.reviewer_type"
        operator: eq
        value:    "ai_then_human"
        next:     aguardar_revisao_humana
    default: congelar_resultado

  # ── Aguarda revisão humana (reviewer_type=human ou fallback) ─────────────────
  # Timeout: review_deadline_hours (lido do ContextStore, padrão 48h).
  # evaluation-api escreve core.workflow.review_decision="reviewed" antes do resume.
  - id: aguardar_revisao_humana
    type: suspend
    reason: input
    timeout_hours: 48
    business_hours: true
    on_resume:
      next: verificar_revisao_humana
    on_timeout:
      next: congelar_resultado

  - id: verificar_revisao_humana
    type: choice
    conditions:
      - field:    "@ctx.core.workflow.review_decision"
        operator: eq
        value:    "reviewed"
        next:     verificar_finalizacao_humana
    default: congelar_resultado

  # Verifica se o revisor humano finalizou (último round) ou se há mais rounds
  - id: verificar_finalizacao_humana
    type: choice
    conditions:
      - field:    "@ctx.core.workflow.current_round"
        operator: gte
        value:    "@ctx.session.max_rounds"
        next:     encerrar_aprovado
    default: aguardar_proxima_contestacao

  # ── Aguarda próxima contestação do avaliado (próximo round) ──────────────────
  # O resultado revisado foi publicado. O avaliado pode contestar novamente
  # dentro de contest_deadline_hours (reinicia o prazo).
  - id: aguardar_proxima_contestacao
    type: suspend
    reason: input
    timeout_hours: 72
    business_hours: true
    on_resume:
      next: verificar_contestacao   # mesmo handler — verifica se contestou ou aceitou
    on_timeout:
      next: congelar_resultado      # aceitação tácita por timeout

  # ── Congela o resultado no estado atual ───────────────────────────────────────
  # Acionado por: timeout em qualquer suspend, max_rounds atingido sem revisão,
  # ou falha do revisor AI sem fallback humano.
  - id: congelar_resultado
    type: invoke
    tool: evaluation_lock
    input:
      result_id:   "@ctx.session.result_id"
      lock_reason: "review_timeout"
    on_success: encerrar
    on_failure: encerrar

  # ── Terminadores ──────────────────────────────────────────────────────────────
  - id:      encerrar_aprovado
    type:    complete
    outcome: resolved

  - id:      encerrar
    type:    complete
    outcome: resolved

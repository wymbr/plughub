id: skill_wrapup_detached_v1
name: Wrap-up destacado (Camada E2 wrap-up-α)
version: "1.0"
description: |
  Workflow webhook (Arc 19) do WRAP-UP DESTACADO (Camada E2 do arco de detach de
  hooks). Disparado pelo bridge em todo hook on_human_end side=agent — `detached`
  (pull manual) ou `inline` (auto-atendimento no Console); é a MESMA máquina, muda só
  a entrega. O bridge injeta no context:
    core.survey.agent_key  — user_id do humano que atendeu (→ assigned_to)
    core.workflow.origin_session_id   — sessão de origem (→ briefing + atribuição)
    core.survey.segment_id — segmento humano a atribuir (usado na gravação)
    hook.origin_pool            — pool que disparou o hook
    hook.wrapup_pool            — fila interna DELE (`{origin}-int`) → alvo do delegate
    hook.*                      — o que a entrada de hook declarar em `context:`
                                  (ex.: dialog_form_id, acw_timeout_hours)

  ESTE SKILL É GENÉRICO: ele não sabe de que pool veio nem qual formulário usar. Os
  dois são fato da CONFIGURAÇÃO DO POOL DE ORIGEM e chegam por @ctx.hook.* — cravá-los
  aqui daria um alvo e um formulário globais para todos os pools de origem.

  O workflow DELEGA o DialogForm de disposição à FILA INTERNA do pool de origem
  (ADR adr-internal-work-queue-author-bound: wrap-up é trabalho AUTHOR-BOUND — só quem
  atendeu pode classificar o próprio atendimento), DIRECIONADO ao agente
  (assigned_to = @ctx.core.survey.agent_key, Camada B). O agente reivindica no
  inbox pull, o Console (DialogFormRenderer/R0) renderiza o form + o briefing
  (transcrição da origem via briefing_session_id) e submete via workflow_resume. As
  respostas caem em $.pipeline_state.coletar.answers.

  Perfil workflow (webhook): usa apenas delegate/invoke/complete.
classification:
  type: vertical

entry: coletar

steps:
  # ── Delega o form de wrap-up à FILA INTERNA do pool de origem, direcionado ────
  - id: coletar
    type: delegate
    # Alvo dinâmico: a fila interna do pool que disparou o hook (`{origem}-int`),
    # escrita pelo bridge. Skill genérico ⇒ o alvo é do chamador. Se a fila interna
    # do pool de origem não estiver ligada, a tag não existe e o delegate FALHA
    # nomeando a ref — em vez de cair num pool de contato por engano.
    pool: "@ctx.hook.wrapup_pool"
    # Camada B — o item cai no inbox DAQUELE agente (não fila compartilhada).
    assigned_to: "@ctx.core.survey.agent_key"
    # SEM transbordo: wrap-up é author-bound, só quem atendeu pode classificar o
    # próprio atendimento — transbordar seria erro de categoria (ADR D4). A saída de
    # pendência é supervisor + TTL (`acw_expired`), fase I5.
    # Wrap-up unificado (Camada E2): o bridge seta @ctx.session.wrap_up_auto_attend
    # ="true" quando o hook é `dispatch: inline` → o Console auto-reivindica o item
    # (auto-atendimento, entrega in-session). Ausente/false → pull manual (detached).
    auto_attend: "@ctx.session.wrap_up_auto_attend"
    context:
      title:               "Wrap-up do atendimento"
      summary:             "Registre a disposição do seu atendimento."
      # Fato do pool de ORIGEM (PoolHookEntry.context), não deste skill: Retenção e
      # Cobrança podem usar formulários de wrap-up diferentes.
      dialog_form_id:      "@ctx.hook.dialog_form_id"
      briefing_session_id: "@ctx.core.workflow.origin_session_id"
    # Prazo do ACW — fato do POOL DE ORIGEM, pela mesma razão que o formulário:
    # Retenção e Cobrança podem ter janelas diferentes para classificar o próprio
    # atendimento. Declarado em `PoolHookEntry.context.acw_timeout_hours`. Ausente,
    # o engine usa o default de 24 h e LOGA (prazo tem default seguro; alvo não tem —
    # por isso `pool` falha duro e este degrada).
    timeout_hours: "@ctx.hook.acw_timeout_hours"
    business_hours: false
    on_resume:
      next: gravar
    on_timeout:
      next: encerrar_timeout

  # ── Grava o outcome no segmento da ORIGEM por referência ─────────────────────
  # A tool replica _apply_wrapup_to_segment/_republish_segment_from_signal do bridge:
  # normaliza a classificação → outcome, acumula no seg_signal e re-publica o
  # participant_left (linha COMPLETA) para o analytics. A atribuição é por referência
  # (origin_session_id + surveyed_segment_id), não por o wrap-up ser um segmento.
  - id: gravar
    type: invoke
    tool: segment_outcome_record
    input:
      tenant_id:         "$.tenant_id"
      origin_session_id: "@ctx.core.workflow.origin_session_id"
      segment_id:        "@ctx.core.survey.segment_id"
      # Fatia 3 — passa as respostas INTEIRAS + o form que as descreve, em vez de
      # mapear campo a campo (`answers.classificacao`, `answers.resumo`, …). O mapa
      # campo-a-campo fazia cada pergunta nova no editor exigir editar este YAML +
      # `set-next` + `promote` — ou seja, o formulário não dirigia nada, que era o
      # ponto (§D3). A tool lê o form publicado e roteia por `capture.kind`.
      #
      # Consequência boa e deliberada: acrescentar uma pergunta de FCR ou de serviço
      # ao form de wrap-up de um pool passa a ser mudança de CONFIGURAÇÃO — sem
      # tocar em skill, sem deploy.
      answers:           "$.pipeline_state.coletar.answers"
      dialog_form_id:    "@ctx.hook.dialog_form_id"
      # Pin de versão (S1 do adr-deploy-time-content-snapshot · D14 da árvore). O
      # SERVIDOR gravou esta tag no delegate, resolvendo qual versão o atendente
      # veria; aqui ela volta para que o submit leia o MESMO documento, e não "a
      # última publicada" — que pode ter mudado durante as até 24 h de ACW.
      #
      # ⚠️ Vem do CONTEXTO, nunca do payload do renderizador: senão o browser
      # escolheria qual versão do formulário descreve a própria resposta.
      # Ausente (dialog-api fora do ar no delegate) ⇒ a tool cai na última
      # publicada, que é o comportamento anterior ao pin.
      dialog_form_version: "@ctx.core.workflow.dialog_form_version"
    output_as: wrapup_record
    on_success: encerrar
    on_failure: encerrar   # gravação falha não deve prender o wrap-up (já logado/isError)

  - id: encerrar
    type: complete
    outcome: resolved

  - id: encerrar_timeout
    type: complete
    outcome: failed

# skill_atendimento_reembolso_v1.yaml
# Atendimento Reembolso — Orquestrador Tier 2
#
# FASE 2 — Não ativo no registry Phase 1.
# Phase 1: reembolso_ia usa diretamente skill_reembolso_intake_v1
#          (agente_reembolso_intake_v1.yaml).
# Phase 2: trocar no registry agente_reembolso_ia_v1.skills para
#          skill_atendimento_reembolso_v1 — este orquestrador invoca
#          o agente_reembolso_intake_v1 via task step (Tier 3 specialist).
#
# Pool: reembolso_ia
# Tier: 2 (Execution Workflow — session-scoped, task steps)
#
# Arquitetura Phase 2:
#   1. saudacao          — notify: boas-vindas
#   2. coletar_contexto  — task: agente_reembolso_intake_v1 (mode: assist)
#                          O Tier 3 coleta pedido + motivo, escreve no ContextStore
#                          e inicia a Journey. O segmento Tier 3 encerra.
#   3. verificar_jornada — choice: @ctx.journey.numero_pedido exists → finalizar
#   4. finalizar         — complete resolved
#   5. encerrar_erro     — complete failed
#
# Diferenças vs portabilidade (para referência):
#   - Tier 1 (skill_reembolso_demo_v1) tem 3 possíveis sessões collect:
#     coletar_informacoes (se needs_info), confirmar_pagamento (se approved)
#   - O motivo_reembolso afeta a lógica de análise do Tier 1
#   - Prazo de análise: 72h úteis (vs 48h da portabilidade)
#
# Para ativar na Phase 2:
#   1. Adicionar pool reembolso_intake_ia ao tenant_demo.yaml
#   2. Registrar agente_reembolso_specialist_v1 → skill_reembolso_intake_v1
#   3. Atualizar agente_reembolso_ia_v1.skills → skill_atendimento_reembolso_v1

id: skill_atendimento_reembolso_v1
name: "Atendimento Reembolso v1 — Orquestrador Tier 2"
version: "1.0"
description: |
  Orquestrador Tier 2 para o fluxo de reembolso (Phase 2).
  Invoca o agente de intake (Tier 3) via task step para coletar dados,
  depois confirma o início da Journey de reembolso.
  Não usado no registry Phase 1 — ver agente_reembolso_intake_v1.
classification:
  type: orchestrator
  domain: reembolso

entry: saudacao

steps:

  # ── Etapa 1: saudação ─────────────────────────────────────────────────────────
  - id: saudacao
    type: notify
    message: "Olá! Vou coordenar sua solicitação de reembolso. Agora vou chamar nosso especialista para registrar os dados do pedido."
    on_success: coletar_contexto
    on_failure: coletar_contexto

  # ── Etapa 2: delegar coleta ao Tier 3 ────────────────────────────────────────
  # O agente_reembolso_intake_v1 (Tier 3) interage com o cliente,
  # coleta pedido + motivo, escreve no ContextStore e inicia a Journey.
  # O segmento Tier 3 encerra com outcome: resolved e o controle retorna aqui.
  - id: coletar_contexto
    type: task
    target:
      skill_id: skill_reembolso_intake_v1
    mode: assist
    execution_mode: sync
    on_success: verificar_jornada
    on_failure: encerrar_erro

  # ── Etapa 3: verificar se Journey foi iniciada ────────────────────────────────
  # Usa a presença de @ctx.journey.numero_pedido como indicador de sucesso.
  - id: verificar_jornada
    type: choice
    conditions:
      - field: "@ctx.journey.numero_pedido"
        operator: exists
        next: finalizar
    default: finalizar   # mesmo sem tag, assume sucesso (Tier 3 já notificou cliente)

  # ── Etapa 4: finalização normal ───────────────────────────────────────────────
  - id: finalizar
    type: complete
    outcome: resolved

  # ── Fallback ──────────────────────────────────────────────────────────────────
  - id: encerrar_erro
    type: complete
    outcome: failed
    issue_status: "Intake Tier 3 falhou — reembolso não registrado"

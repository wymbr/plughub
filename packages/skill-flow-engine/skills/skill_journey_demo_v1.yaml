id: skill_journey_demo_v1
name: Journey Demo Process (N3)
version: "1.0"
description: |
  Journey J4/J5 — processo N3 MÍNIMO para exercitar (a) o hook on_process_end e (b) o
  contexto compartilhado `@ctx.journey.*`, de ponta a ponta. Completa `resolved` já no
  trigger (sem suspend/delegate), então o bridge dispara o on_process_end imediatamente.
  Só para demo/E2E.
classification:
  type: vertical

entry: marcar_journey

steps:

  # ── J5a-1: ESCREVE no contexto compartilhado do processo ────────────────────
  #
  # A prova do `@ctx.journey.*` precisa de duas SESSÕES diferentes da mesma journey:
  # esta (o processo) escreve; o workflow de survey (sessão própria, mesma journey) lê.
  # O hook agent NÃO serviria de leitor — ele roda como especialista NESTA sessão, então
  # leria o mesmo hash mesmo que o roteamento de journey estivesse quebrado.
  #
  # Note que a escrita NÃO é o `context_set` em si (esse grava direto em
  # `{tenant}:ctx:{session_id}` e nem sabe o que é journey) — é o `context_tags.outputs`,
  # que passa pelo acumulador do engine, o único que conhece o `journeyId` e roteia
  # `journey.*` para `{tenant}:ctx:journey:{journeyId}`.
  #
  # Mapeamos o campo `session_id` da RESPOSTA da tool → tag `journey.*`. Assim o hash da
  # journey passa a carregar o id da sessão do processo, e o leitor prova a origem.
  - id: marcar_journey
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag:        "session.journey_demo_ping"
      value:      "processo-escreveu"
    output_as: ping
    context_tags:
      outputs:
        session_id:
          tag:        "journey.origin_process_session"
          confidence: 1.0
          merge:      "overwrite"
    on_success: concluir
    on_failure: concluir     # a demo do hook não pode depender da escrita de contexto

  - id: concluir
    type: complete
    outcome: resolved
    issue_status: done

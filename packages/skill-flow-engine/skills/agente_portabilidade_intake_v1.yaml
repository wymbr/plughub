# agente_portabilidade_intake_v1.yaml
# Portabilidade Intake — Agente de Coleta Determinístico (Tier 3)
#
# Roda em portabilidade_ia como agente principal na Phase 1.
# Na Phase 2, será invocado via task step pelo Tier 2 (skill_atendimento_portabilidade_v1).
#
# Pool: portabilidade_ia
# Tier: 3 (Interaction Agent — I/O atômico com o cliente)
#
# Responsabilidade:
#   1. Coletar numero_atual e operadora_destino do cliente
#   2. Persistir dados no ContextStore (namespace session.*)
#   3. Confirmar ao cliente e encerrar o segmento
#
# A Journey continua de forma assíncrona — o cliente receberá
# notificações via collect steps do skill_portabilidade_demo_v1
# quando a operadora responder (1–3 dias úteis).
#
# Permissões necessárias:
#   agent_heartbeat, notification_send, interaction_request
#   context_set (escreve session.* no ContextStore)
#
# Fluxo:
#   1. saudacao            — notify: boas-vindas ao fluxo de portabilidade
#   2. coletar_numero      — menu text: número atual a ser portado
#   3. coletar_operadora   — menu list: operadora de destino
#   3b. detectar_kind_contato / resolver_identidade_* / escrever_caller_id
#       — resolve customer_id nativo (customer_resolve) e grava caller.customer_id
#   4. confirmar_dados     — notify: exibe dados coletados
#   5. escrever_numero     — invoke context_set: session.numero_atual
#   6. escrever_operadora  — invoke context_set: session.operadora_destino
#   7. avisar_inicio       — notify: confirmação + orientação de continuidade
#   8. finalizar           — complete outcome: resolved
#   9. avisar_timeout      — notify: informa cliente de timeout/falha de menu
#  10. finalizar_timeout   — complete outcome: failed

id: skill_portabilidade_intake_v1
name: "Portabilidade Intake v1 — Coleta e Início de Jornada"
version: "1.0"
description: |
  Agente de coleta determinístico (Tier 3) para o fluxo de portabilidade.
  Coleta número atual e operadora de destino via menus sem LLM.
  Persiste os dados no namespace session.* do ContextStore.
  O cliente encerra o segmento após confirmação.
classification:
  type: orchestrator
  domain: portabilidade

entry: saudacao

steps:

  # ── Etapa 1: saudação ─────────────────────────────────────────────────────────
  - id: saudacao
    type: notify
    message: "Olá! Vou te ajudar com a portabilidade do seu número. O processo leva de 1 a 3 dias úteis e você receberá atualizações por aqui."
    on_success: coletar_numero
    on_failure: coletar_numero

  # ── Etapa 2: coletar número atual ────────────────────────────────────────────
  # O cliente digita o número que deseja portar (incluindo DDD).
  - id: coletar_numero
    type: menu
    prompt: "Qual é o número de celular que deseja portar? (com DDD, ex: 11912345678)"
    interaction: text
    output_as: numero_atual
    timeout_s: 180
    on_success: coletar_operadora
    on_failure: avisar_timeout
    on_timeout: avisar_timeout
    on_disconnect: finalizar_timeout

  # ── Etapa 3: coletar operadora de destino ────────────────────────────────────
  # Operadora para a qual o número será portado.
  - id: coletar_operadora
    type: menu
    prompt: "Para qual operadora deseja portar o número?"
    interaction: list
    options:
      - id: claro
        label: "📶 Claro"
      - id: vivo
        label: "📶 Vivo"
      - id: tim
        label: "📶 TIM"
      - id: oi
        label: "📶 Oi"
      - id: outros
        label: "📶 Outra operadora"
    output_as: operadora_destino
    timeout_s: 120
    on_success: coletar_contato
    on_failure: avisar_timeout
    on_timeout: avisar_timeout
    on_disconnect: finalizar_timeout

  # ── Etapa 3b: coletar contato para retorno (webchat) ─────────────────────────
  # Em canais com ANI (WhatsApp, voz), o customer_id já é o número do cliente
  # e este step pode ser pulado no futuro com um choice baseado em $.channel.
  # No webchat coletamos telefone ou e-mail para que o collect step do processo
  # consiga criar uma nova sessão outbound de confirmação após a aprovação.
  - id: coletar_contato
    type: menu
    prompt: "Para te notificar quando a portabilidade for aprovada, qual seu número de celular ou e-mail? (ex: 11987654321 ou nome@email.com)"
    interaction: text
    output_as: contact_identifier
    timeout_s: 180
    on_success: detectar_kind_contato  # ← resolve a identidade antes da verificação de pendência
    on_failure: avisar_timeout
    on_timeout: avisar_timeout
    on_disconnect: finalizar_timeout

  # ── Etapa 3b2: resolver identidade nativa (customer_id) ──────────────────────
  # Objetivo (Identity Resolver — nível b, wiring do intake): antes de qualquer
  # ramificação, resolver/provisionar o customer_id NATIVO a partir das âncoras
  # coletadas e gravá-lo em caller.customer_id no ContextStore. No fechamento, o
  # bridge (Slice 4) lê caller.customer_id e o carimba em sessions.customer_id —
  # unificando H1/H2/H3 num contato ao vivo.
  #
  # Âncoras: numero_atual (sempre phone, determinístico) + contact_identifier
  # (phone OU email; kind detectado abaixo). Ambas indexadas ao mesmo customer_id
  # → reconectar por qualquer uma resolve o mesmo cliente.
  #
  # Detecção de kind do contact_identifier: presença de "@" ⇒ email; senão phone.
  - id: detectar_kind_contato
    type: choice
    conditions:
      - field:    "$.pipeline_state.contact_identifier"
        operator: contains
        value:    "@"
        next:     resolver_identidade_email
    default: resolver_identidade_phone

  # ── Resolve com contact_identifier como EMAIL ────────────────────────────────
  - id: resolver_identidade_email
    type: invoke
    tool: customer_resolve
    input:
      tenant_id: "$.tenant_id"
      provision: true
      anchors:
        - kind: phone
          value: "$.pipeline_state.numero_atual"
        - kind: email
          value: "$.pipeline_state.contact_identifier"
    output_as: identidade
    on_success: escrever_caller_id
    on_failure: verificar_pendencia    # resolve falhou → segue sem carimbar (não bloqueia intake)

  # ── Resolve com contact_identifier como PHONE ────────────────────────────────
  - id: resolver_identidade_phone
    type: invoke
    tool: customer_resolve
    input:
      tenant_id: "$.tenant_id"
      provision: true
      anchors:
        - kind: phone
          value: "$.pipeline_state.numero_atual"
        - kind: phone
          value: "$.pipeline_state.contact_identifier"
    output_as: identidade
    on_success: escrever_caller_id
    on_failure: verificar_pendencia

  # ── Gravar caller.customer_id (nativo) no ContextStore ───────────────────────
  # Mesma mecânica dos escrever_* (context_set → {tenant}:ctx:{session}); é a
  # tag exata que o bridge lê no fechamento (_resolve_close_customer_id).
  - id: escrever_caller_id
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag: "caller.customer_id"
      value: "$.pipeline_state.identidade.customer_id"
      confidence: 1.0
      visibility: "agents_only"
    on_success: verificar_pendencia
    on_failure: verificar_pendencia    # já resolvido; não bloquear a coleta se a escrita falhar

  # ── Etapa 3c: verificar pendência para este cliente (cross-canal) ────────────
  # Identity Resolver (nível b, Fase B): usa anchors[] em vez de contact_identifier
  # → o tool resolve o customer_id nativo (Lookup 1) e busca pendências indexadas
  # sob ele (Lookup 2, pending_by_customer). Assim uma pendência criada num canal
  # é encontrada ao reconectar por outro, desde que uma âncora resolva ao mesmo
  # cliente. numero_atual é a âncora estável (telefone determinístico, sempre
  # coletado). Resposta achatada: pendencia.found / .resume_token / .policy /
  # .context.{numero_atual(mascarado),operadora_destino}.
  - id: verificar_pendencia
    type: invoke
    tool: pending_workflow_get
    input:
      tenant_id: "$.tenant_id"
      anchors:
        - kind: phone
          value: "$.pipeline_state.numero_atual"
    output_as: pendencia
    on_success: avaliar_resolucao
    on_failure: confirmar_dados    # fallback: prossegue normalmente se a tool falhar

  # ── Etapa 3c2: gate de posse (Fase 3) ────────────────────────────────────────
  # A retomada cross-canal só é acionável com âncora `possessed` (posse provada).
  # Com âncora só `claimed`, o tool devolve verification_required (sem revelar se
  # há pendência). Oferecemos verificar o número por OTP — proativo, com recusa.
  - id: avaliar_resolucao
    type: choice
    conditions:
      - field:    "$.pipeline_state.pendencia.verification_required"
        operator: eq
        value:    true
        next:     oferecer_verificacao
    default: avaliar_pendencia     # já possessed (ou sem gate) → segue normal

  # ── Etapa 3c3: oferecer verificação (neutro — não confirma pendência) ────────
  - id: oferecer_verificacao
    type: menu
    prompt: "Para acessar atendimentos anteriores com segurança, podemos verificar a posse do seu número por um código SMS. Deseja verificar agora?"
    interaction: button
    options:
      - id: sim
        label: "✅ Verificar meu número"
      - id: nao
        label: "Seguir sem verificar"
    output_as: quer_verificar
    timeout_s: 180
    on_success: avaliar_oferta
    on_failure: confirmar_dados
    on_timeout: confirmar_dados
    on_disconnect: finalizar_timeout

  - id: avaliar_oferta
    type: choice
    conditions:
      - field:    "$.pipeline_state.quer_verificar"
        operator: eq
        value:    "sim"
        next:     desafiar_posse
    default: confirmar_dados       # recusou → atendimento novo

  # ── Etapa 3c4: OTP — desafio de posse do canal ───────────────────────────────
  - id: desafiar_posse
    type: invoke
    tool: otp_challenge
    input:
      tenant_id: "$.tenant_id"
      kind:      phone
      value:     "$.pipeline_state.numero_atual"
    output_as: otp_chal
    on_success: coletar_codigo_dialog
    on_failure: confirmar_dados    # OTP indisponível → segue como novo

  # ── Etapa 3c4b: coleta do código via dialog-runner (dialog primitive) ─────────
  # Delega a coleta do código ao skill_dialog_runner_v1 (Tier-3), que renderiza o
  # DialogForm `dialog_otp_possession` (conteúdo versionado) e devolve o que o
  # cliente DIGITOU. O código GERADO nunca passa pelo runner (costura de segredo):
  # challenge/verify ficam aqui (OtpService). O runner resume o delegate com o
  # payload → $.pipeline_state.coletar_codigo_dialog.code.
  - id: coletar_codigo_dialog
    type: delegate
    pool: dialog_runner
    context:
      dialog_form_id: "dialog_otp_possession"
    timeout_hours: 1
    on_resume:
      next: verificar_codigo_otp
    on_timeout:
      next: confirmar_dados

  - id: verificar_codigo_otp
    type: invoke
    tool: otp_verify
    input:
      tenant_id:   "$.tenant_id"
      customer_id: "@ctx.caller.customer_id"
      kind:        phone
      value:       "$.pipeline_state.numero_atual"
      code:        "$.pipeline_state.coletar_codigo_dialog.value"
    output_as: otp_res
    on_success: avaliar_verificacao
    on_failure: confirmar_dados

  - id: avaliar_verificacao
    type: choice
    conditions:
      - field:    "$.pipeline_state.otp_res.verified"
        operator: eq
        value:    true
        next:     verificar_pendencia_pos_otp
    default: avisar_verificacao_falhou

  - id: avisar_verificacao_falhou
    type: notify
    message: "Não consegui confirmar o código. Vamos seguir com um novo atendimento."
    on_success: confirmar_dados
    on_failure: confirmar_dados

  # ── Etapa 3c5: re-consulta pendência (agora com âncora possessed) ────────────
  - id: verificar_pendencia_pos_otp
    type: invoke
    tool: pending_workflow_get
    input:
      tenant_id: "$.tenant_id"
      anchors:
        - kind: phone
          value: "$.pipeline_state.numero_atual"
    output_as: pendencia
    on_success: avaliar_pendencia
    on_failure: confirmar_dados

  # ── Etapa 3d: avaliar se há pendência ────────────────────────────────────────
  - id: avaliar_pendencia
    type: choice
    conditions:
      - field:    "$.pipeline_state.pendencia.found"
        operator: eq
        value:    true
        next:     avaliar_politica_retomada
    default: confirmar_dados     # sem pendência → fluxo normal

  # ── Etapa 3d2: política de retomada (offer | auto) ───────────────────────────
  # A política é declarada na delegação (customer_resumable/resume_policy do
  # step delegate) e viaja no PendingEntry.policy. "auto" retoma sem perguntar;
  # "offer" (default anti-enumeração) apresenta o menu de continuidade.
  - id: avaliar_politica_retomada
    type: choice
    conditions:
      - field:    "$.pipeline_state.pendencia.policy"
        operator: eq
        value:    "auto"
        next:     retomar_processo
    default: menu_continuidade   # offer → pergunta ao cliente

  # ── Etapa 3e: menu de continuidade (pendência encontrada) ────────────────────
  # Informa o cliente que há um processo de portabilidade pendente e pergunta
  # se deseja continuar, cancelar ou iniciar um novo atendimento.
  - id: menu_continuidade
    type: menu
    prompt: "✅ Identificamos que sua portabilidade do número **{{$.pipeline_state.pendencia.context.numero_atual}}** para **{{$.pipeline_state.pendencia.context.operadora_destino}}** foi **aprovada pela operadora** e está aguardando sua confirmação!\n\nO que deseja fazer?"
    interaction: button
    options:
      - id: continuar
        label: "✅ Confirmar portabilidade"
      - id: cancelar_pendente
        label: "❌ Cancelar portabilidade"
      - id: novo
        label: "🔄 Novo atendimento"
    output_as: decisao_continuidade
    timeout_s: 300
    on_success: processar_decisao
    on_failure: confirmar_dados    # fallback: prossegue normalmente
    on_timeout: confirmar_dados
    on_disconnect: finalizar_timeout

  # ── Etapa 3f: processar decisão de continuidade ───────────────────────────────
  - id: processar_decisao
    type: choice
    conditions:
      - field:    "$.pipeline_state.decisao_continuidade"
        operator: eq
        value:    "continuar"
        next:     retomar_processo
      - field:    "$.pipeline_state.decisao_continuidade"
        operator: eq
        value:    "cancelar_pendente"
        next:     cancelar_processo
    default: confirmar_dados    # "novo" → inicia novo atendimento

  # ── Etapa 3g: retomar processo via conference specialist ─────────────────────
  # Cria um agente de confirmação (agente_confirmacao_portabilidade_v1) como
  # conference specialist DENTRO desta sessão (Session A-new). O agente roda
  # no stream do cliente atual — sem troca de WebSocket.
  # O specialist recebe workflow_resume_token (= token de Session B) via context
  # e chama workflow_resume ao concluir. Session A-new suspende enquanto
  # o specialist atende o cliente; encerra quando o specialist terminar.
  - id: retomar_processo
    type: delegate
    pool: portabilidade_confirmacao
    context:
      workflow_resume_token: "$.pipeline_state.pendencia.resume_token"
      numero_atual:          "$.pipeline_state.pendencia.context.numero_atual"
      operadora_destino:     "$.pipeline_state.pendencia.context.operadora_destino"
      customer_present:      "true"   # cliente conectado neste reconnect → specialist faz I/O
      # Identity Resolver (nível b §11): a retomada foi descoberta por identidade
      # cross-canal. O specialist lê @ctx.session.resume_origin e o repassa ao
      # workflow_resume → session_resumed(Session B) carimba resume_origin=identity.
      resume_origin:         "identity"
    timeout_hours: 1
    on_resume:
      next: finalizar       # specialist concluiu (via resume)
    on_reject:
      next: finalizar       # specialist cancelou
    on_timeout:
      next: finalizar       # timeout sem resposta do cliente

  # ── Etapa 3h: cancelar processo pendente ─────────────────────────────────────
  # Cancelamento é direto — sem precisar de specialist.
  - id: cancelar_processo
    type: invoke
    tool: workflow_resume
    input:
      resume_token:  "$.pipeline_state.pendencia.resume_token"
      decision:      "rejected"
      resume_origin: "identity"   # cross-canal (nível b §11)
      payload:
        source:   "customer_reconnect"
        resposta: "cancelar"
    on_success: avisar_cancelamento
    on_failure: avisar_erro_retomada

  # ── Notificações de resultado ─────────────────────────────────────────────────
  - id: avisar_cancelamento
    type: notify
    message: "❌ Portabilidade cancelada conforme sua solicitação. Se quiser iniciar um novo processo, é só entrar em contato novamente."
    on_success: finalizar
    on_failure: finalizar

  - id: avisar_erro_retomada
    type: notify
    message: "Não foi possível processar sua solicitação no momento. Por favor, tente novamente mais tarde."
    on_success: finalizar
    on_failure: finalizar

  # ── Etapa 4: confirmar dados antes de iniciar ────────────────────────────────
  - id: confirmar_dados
    type: notify
    message: "📋 Perfeito! Vou iniciar o processo com os seguintes dados:\n• Número a portar: {{$.pipeline_state.numero_atual}}\n• Operadora destino: {{$.pipeline_state.operadora_destino}}\n• Contato para retorno: {{$.pipeline_state.contact_identifier}}\n\nAguarde enquanto registro sua solicitação..."
    on_success: escrever_numero
    on_failure: escrever_numero

  # ── Etapa 5: persistir numero_atual no ContextStore (session.*) ────────────────
  - id: escrever_numero
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag: "session.numero_atual"
      value: "$.pipeline_state.numero_atual"
      confidence: 1.0
      visibility: "agents_only"
    on_success: escrever_operadora
    on_failure: escrever_operadora

  # ── Etapa 6: persistir operadora_destino no ContextStore (session.*) ───────────
  - id: escrever_operadora
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag: "session.operadora_destino"
      value: "$.pipeline_state.operadora_destino"
      confidence: 1.0
      visibility: "agents_only"
    on_success: escrever_contato
    on_failure: escrever_contato

  # ── Etapa 6b: persistir contact_identifier no ContextStore ───────────────────
  # Usado pelo collect step do processo para criar a sessão outbound de confirmação.
  # Em canais com ANI, substituir por: value: "$.customer_id"
  - id: escrever_contato
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag: "session.contact_identifier"
      value: "$.pipeline_state.contact_identifier"
      confidence: 1.0
      visibility: "agents_only"
    on_success: disparar_workflow
    on_failure: disparar_workflow

  # ── Etapa 7: disparar workflow assíncrono de portabilidade ────────────────────
  # Cria uma sessão independente com channel_type=webhook que vai:
  #   - aguardar aprovação da operadora (suspend 48h)
  #   - coletar confirmação do cliente via nova sessão (collect)
  # contact_identifier é o número/e-mail coletado para o retorno.
  - id: disparar_workflow
    type: invoke
    tool: workflow_trigger
    input:
      skill_id:          "skill_portabilidade_demo_v1"
      tenant_id:         "$.tenant_id"
      origin_session_id: "$.session_id"
      context_json: '{"session.numero_atual": "{{$.pipeline_state.numero_atual}}", "session.operadora_destino": "{{$.pipeline_state.operadora_destino}}", "session.contact_identifier": "{{$.pipeline_state.contact_identifier}}"}'
    on_success: avisar_inicio
    on_failure: avisar_inicio

  # ── Etapa 8: confirmar registro ao cliente ───────────────────────────────────
  - id: avisar_inicio
    type: notify
    message: "✅ Solicitação de portabilidade registrada com sucesso!\n\nEm até 48 horas úteis, a operadora responderá. Você receberá uma mensagem aqui para confirmar a transferência.\n\nSe precisar de mais alguma coisa, pode entrar em contato novamente."
    on_success: finalizar
    on_failure: finalizar

  # ── Etapa 9: finalização normal ───────────────────────────────────────────────
  - id: finalizar
    type: complete
    outcome: resolved

  # ── Timeout / disconnect ───────────────────────────────────────────────────────
  - id: avisar_timeout
    type: notify
    message: "Sua sessão foi encerrada por inatividade ou desconexão. Se precisar de ajuda com a portabilidade, entre em contato novamente."
    on_success: finalizar_timeout
    on_failure: finalizar_timeout

  - id: finalizar_timeout
    type: complete
    outcome: failed
    issue_status: "menu timeout ou disconnect — cliente não respondeu"

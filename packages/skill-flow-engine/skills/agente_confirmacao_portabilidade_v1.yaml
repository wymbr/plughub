# agente_confirmacao_portabilidade_v1.yaml
# Agente de I/O para confirmação de portabilidade (Tier 3 — I/O atômico)
#
# Pool: portabilidade_confirmacao
# Acionado por DOIS chamadores, e o discriminador é `session.customer_present`:
#   - `skill_portabilidade_demo_v1` (delegate `notificar_e_confirmar`), sem cliente vivo:
#     adia em silêncio e a pendência `offer` fica indexada para a volta do cliente;
#   - a porta de plataforma `skill_intake_runner_v1` (pool `portabilidade_ia`, config
#     `on_pending_pool`), com o cliente conectado e PROVADO: é a continuidade do domínio.
#
# Recebe via ContextStore:
#   core.workflow.resume_token          — token da pendência (retoma o processo)
#   core.workflow.delegate_resume_token — token de quem chamou (devolve a conversa)
#   session.customer_present / session.resume_origin — escritos pelo delegate da porta
#   journey.numero_atual / journey.operadora_destino — gravados pelo processo ao nascer
#     (PID-17: a porta não conhece os campos do domínio e não os repassa)
#
# Três respostas do cliente, três destinos — PID-17 (2026-09-14):
#   confirmar → `input` no processo (on_resume → encerrar_sucesso)
#   cancelar  → `rejected` no processo (on_reject → encerrar_cancelado). Até a PID-17 o
#               cancelamento também ia como `input`, e o processo o registrava como SUCESSO.
#   outro assunto → devolve `acao: novo` à porta, sem tocar no processo
# E a ociosidade/desconexão com o cliente presente devolve à porta SEM tocar no processo:
# até a PID-17 ela retomava com `timeout` e matava uma portabilidade já aprovada.

id: skill_agente_confirmacao_portabilidade_v1
name: "Portabilidade — Agente de Confirmação v1"
version: "1.1"
description: |
  Agente de I/O de confirmação de portabilidade.
  Mostra a aprovação ao cliente e coleta confirmar / cancelar / outro assunto.
  Usa workflow_resume para retomar o processo webhook e devolver a conversa à porta.
classification:
  type: vertical
  domain: portabilidade

entry: verificar_canal

steps:

  # ── Etapa 0: verificar canal de operação ──────────────────────────────────────
  # Discriminador: customer_present (passado SÓ pela porta, onde o cliente está
  # conectado). NÃO usar delegate_resume_token — ele existe nos dois casos.
  # Default = adiar (aguardar_inbound). Só notifica proativamente quando há cliente
  # conectado OU um canal outbound EXPLÍCITO; sem sinal de "pode contatar agora", o
  # seguro é adiar e deixar o processo pendente.
  - id: verificar_canal
    type: choice
    conditions:
      - field:    "@ctx.session.customer_present"
        operator: eq
        value:    "true"
        next:     notificar_aprovacao    # cliente conectado (porta) → fazer I/O
      - field:    "@ctx.session.confirmation_channel"
        operator: eq
        value:    "email"
        next:     notificar_aprovacao    # canal outbound explícito (proativo) — quando houver adapter
    default: aguardar_inbound            # sem cliente vivo e sem outbound → adiar

  - id: aguardar_inbound
    type: complete
    outcome: resolved

  - id: notificar_aprovacao
    type: notify
    message: "✅ Sua solicitação de portabilidade do número {{@ctx.journey.numero_atual}} para {{@ctx.journey.operadora_destino}} foi aprovada pela operadora!"
    on_success: coletar_confirmacao
    on_failure: coletar_confirmacao

  - id: coletar_confirmacao
    type: menu
    prompt: "Deseja confirmar a portabilidade? A transferência será realizada em até 1 dia útil."
    interaction: button
    options:
      - id: confirmar
        label: "✅ Sim, confirmar portabilidade"
      - id: cancelar
        label: "❌ Cancelar solicitação"
      - id: novo
        label: "🔄 Outro assunto"
    output_as: resposta_cliente
    timeout_s: 600     # 10 min
    on_success: processar_resposta
    on_failure: avaliar_ociosidade
    on_timeout: avaliar_ociosidade
    on_disconnect: avaliar_ociosidade

  - id: processar_resposta
    type: choice
    conditions:
      - field:    "$.pipeline_state.resposta_cliente"
        operator: eq
        value:    "confirmar"
        next:     retornar_confirmacao
      - field:    "$.pipeline_state.resposta_cliente"
        operator: eq
        value:    "cancelar"
        next:     retornar_cancelamento
    default: avaliar_outro_assunto

  # ── Confirmar: o cliente DECIDE o que é dele decidir ──────────────────────────
  - id: retornar_confirmacao
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.resume_token"
      decision: "input"
      resume_origin: "@ctx.session.resume_origin"
      payload:
        resposta: "confirmar"
    on_success: avisar_confirmacao
    on_failure: avisar_erro_retomada

  - id: avisar_confirmacao
    type: notify
    message: "✅ Portabilidade confirmada! A transferência será concluída em até 1 dia útil."
    on_success: retornar_sessao_pai
    on_failure: retornar_sessao_pai

  # ── Cancelar: `rejected`, como na PID-15 ─────────────────────────────────────
  - id: retornar_cancelamento
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.resume_token"
      decision: "rejected"
      resume_origin: "@ctx.session.resume_origin"
      payload:
        source:   "customer_reconnect"
        resposta: "cancelar"
    on_success: avisar_cancelamento
    on_failure: avisar_erro_retomada

  - id: avisar_cancelamento
    type: notify
    message: "❌ Portabilidade cancelada conforme sua solicitação. Se quiser iniciar um novo processo, é só pedir por aqui."
    on_success: retornar_sessao_pai
    on_failure: retornar_sessao_pai

  - id: avisar_erro_retomada
    type: notify
    message: "Não consegui processar sua resposta agora. Sua solicitação continua aprovada — tente de novo em alguns minutos."
    on_success: retornar_sessao_pai
    on_failure: retornar_sessao_pai

  # ── Outro assunto e ociosidade: só com o cliente PRESENTE a conversa volta à porta ─
  # Sem cliente presente (caminho proativo), `delegate_resume_token` é o token do PRÓPRIO
  # processo — devolver `novo` ali o retomaria como confirmação. Por isso a presença é
  # conferida de novo, e o caminho proativo segue com o timeout de antes.
  - id: avaliar_outro_assunto
    type: choice
    conditions:
      - field:    "@ctx.session.customer_present"
        operator: eq
        value:    "true"
        next:     devolver_novo
    default: retornar_timeout

  - id: avaliar_ociosidade
    type: choice
    conditions:
      - field:    "@ctx.session.customer_present"
        operator: eq
        value:    "true"
        next:     devolver_encerrar     # a pendência fica até o prazo do próprio delegate
    default: retornar_timeout

  - id: devolver_novo
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.delegate_resume_token"
      decision:     "input"
      payload:
        acao: "novo"
    on_success: finalizar
    on_failure: finalizar

  - id: devolver_encerrar
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.delegate_resume_token"
      decision:     "input"
      payload:
        acao: "encerrar"
    on_success: finalizar
    on_failure: finalizar

  - id: retornar_timeout
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.resume_token"
      decision: "timeout"
    on_success: retornar_sessao_pai
    on_failure: finalizar

  - id: retornar_sessao_pai
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.delegate_resume_token"
      decision: "input"
      resume_origin: "@ctx.session.resume_origin"   # nível b §11 (ausente → "token")
      payload:
        acao: "encerrar"
    on_success: finalizar
    on_failure: finalizar

  - id: finalizar
    type: complete
    outcome: resolved

# agente_confirmacao_portabilidade_v1.yaml
# Agente de I/O para confirmação de portabilidade (Tier 3 — I/O atômico)
#
# Pool: portabilidade_confirmacao
# Acionado por: delegate() step em skill_portabilidade_demo_v1
#
# Recebe via ContextStore (escrito pelo delegate step):
#   core.workflow.resume_token  — token para retomar o workflow pai
#   session.contact_identifier     — número/email do cliente para contato
#   session.numero_atual           — número que está sendo portado
#   session.operadora_destino      — operadora de destino
#
# Fluxo:
#   1. notificar_aprovacao — notify: informa ao cliente que a portabilidade foi aprovada
#   2. coletar_confirmacao — menu: pede confirmação do cliente (sim/não)
#   3. retornar_confirmado / retornar_cancelado / retornar_timeout
#      — invoke: chama workflow_resume com o resultado
#   4. finalizar — complete

id: skill_agente_confirmacao_portabilidade_v1
name: "Portabilidade — Agente de Confirmação v1"
version: "1.0"
description: |
  Agente de I/O de confirmação de portabilidade.
  Notifica o cliente da aprovação e coleta sua confirmação para prosseguir.
  Usa workflow_resume para retomar o processo webhook após a interação.
classification:
  type: vertical
  domain: portabilidade

entry: verificar_canal

steps:

  # ── Etapa 0: verificar canal de operação ──────────────────────────────────────
  # Session B seta session.confirmation_channel antes de delegar.
  # Prioridade:
  #   1. delegate_resume_token presente → conference specialist (cliente conectado)
  #      → prosseguir com notify+menu normalmente
  #   2. confirmation_channel == "inbound_only" → canal sem outbound (webchat, webrtc)
  #      → complete silencioso: Session B fica suspenso no delegate step
  #         pending_workflow key permanece válida
  #         cliente reconecta → pending_workflow_get detecta → menu → workflow_resume
  #   3. default → canal outbound (whatsapp, email, sms) → prosseguir
  # Discriminador: customer_present (passado SÓ pelo reconnect de A-new, onde o
  # cliente está conectado). NÃO usar delegate_resume_token — ele agora existe nos
  # dois casos (B→C e A-new→C são ambos conference no modelo v2).
  # Default = adiar (aguardar_inbound). Só notifica proativamente quando há
  # cliente conectado (customer_present, passado pelo reconnect) OU um canal
  # outbound EXPLÍCITO. Isso é robusto a falha de propagação de confirmation_channel:
  # sem sinal de "pode contatar agora", o seguro é adiar e deixar Session B pendente.
  - id: verificar_canal
    type: choice
    conditions:
      - field:    "@ctx.session.customer_present"
        operator: eq
        value:    "true"
        next:     notificar_aprovacao    # cliente conectado (reconnect) → fazer I/O
      - field:    "@ctx.session.confirmation_channel"
        operator: eq
        value:    "email"
        next:     notificar_aprovacao    # canal outbound explícito (proativo) — quando houver adapter
    default: aguardar_inbound            # sem cliente vivo e sem outbound → adiar (Session B fica pendente)

  # ── Etapa 0b: aguardar inbound ────────────────────────────────────────────────
  # Canal inbound-only (webchat, webrtc). Não é possível contatar o cliente
  # proativamente. O agente encerra sem chamar workflow_resume, deixando
  # Session B suspenso. O cliente reconecta via intake e o mecanismo
  # pending_workflow_get oferece a continuação.
  - id: aguardar_inbound
    type: complete
    outcome: resolved

  # ── Etapa 1: notificar aprovação ──────────────────────────────────────────────
  - id: notificar_aprovacao
    type: notify
    message: "✅ Sua solicitação de portabilidade do número {{@ctx.session.numero_atual}} para {{@ctx.session.operadora_destino}} foi aprovada pela operadora!"
    on_success: coletar_confirmacao
    on_failure: coletar_confirmacao

  # ── Etapa 2: coletar confirmação ──────────────────────────────────────────────
  - id: coletar_confirmacao
    type: menu
    prompt: "Deseja confirmar a portabilidade? A transferência será realizada em até 1 dia útil."
    interaction: button
    options:
      - id: confirmar
        label: "✅ Sim, confirmar portabilidade"
      - id: cancelar
        label: "❌ Cancelar solicitação"
    output_as: resposta_cliente
    timeout_s: 600     # 10 min — inbound: fecha sozinho se cliente não conectar
    on_success: retornar_resultado
    on_failure: retornar_timeout
    on_timeout: retornar_timeout
    on_disconnect: retornar_timeout

  # ── Etapa 3a: retornar resultado ao workflow (Session B) ─────────────────────
  - id: retornar_resultado
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.resume_token"
      decision: "input"
      # Identity Resolver (nível b §11): repassa a procedência da retomada. Só
      # está presente quando este specialist foi acionado pelo reconnect por
      # identidade (intake grava session.resume_origin=identity). Ausente no
      # caminho normal → o tool ignora e cai em "token".
      resume_origin: "@ctx.session.resume_origin"
      payload:
        resposta: "$.pipeline_state.resposta_cliente"
        confirmado: "$.pipeline_state.resposta_cliente == 'confirmar'"
    on_success: retornar_sessao_pai
    on_failure: finalizar

  # ── Etapa 3b: timeout sem resposta ───────────────────────────────────────────
  - id: retornar_timeout
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.resume_token"
      decision: "timeout"
    on_success: retornar_sessao_pai
    on_failure: finalizar

  # ── Etapa 3c: retornar à sessão pai (Session A-new) ───────────────────────────
  # Quando o agente roda como conference specialist em Session A-new (não como
  # sessão independente em Session C), o delegate_resume_token está disponível
  # em @ctx.core.workflow.delegate_resume_token e resume o delegate step do pai.
  # Quando roda em Session C (independente), este token é null → invoke falha
  # silenciosamente → on_failure: finalizar. Comportamento correto para ambos.
  - id: retornar_sessao_pai
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.core.workflow.delegate_resume_token"
      decision: "input"
      resume_origin: "@ctx.session.resume_origin"   # nível b §11 (ausente → "token")
    on_success: finalizar
    on_failure: finalizar

  # ── Finalização ───────────────────────────────────────────────────────────────
  - id: finalizar
    type: complete
    outcome: resolved

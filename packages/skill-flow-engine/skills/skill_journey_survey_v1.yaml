id: skill_journey_survey_v1
name: Journey Survey (N3)
version: "1.0"
description: |
  Journey J4 — agente CONSUMIDOR do hook on_process_end (fim de PROCESSO/N3).
  Cria um survey OUTBOUND (link web) da journey inteira, chaveado na RAIZ CANÔNICA
  (grain=journey), reusando o DialogForm publicado `dialog_nps_buttons`.

  Princípios (spec §6.1):
    - NÃO renderiza inline: no fim do processo o cliente não está conectado
      (workflow headless) → agenda contato ativo via o veículo outbound
      (survey_link_create → survey_web). A resposta é do CLIENTE, nunca fabricada.
    - Outcome-aware: só pesquisa em ciclo fechado (process_outcome=resolved);
      failed/timeout → não pesquisa (o mecanismo é genérico; a decisão é do agente).
    - Pertença à journey: o agente roda como especialista NA sessão do workflow
      (mesma journey); o sinal fica atado à raiz canônica lida do ctx (J1).

classification:
  type: vertical

entry: avaliar_desfecho

steps:
  # Outcome-aware: só survey em processo resolvido (ciclo fechado).
  - id: avaliar_desfecho
    type: choice
    conditions:
      - field:    "@ctx.session.process_outcome"
        operator: eq
        value:    "resolved"
        next:     criar_survey_journey
    default: encerrar

  # J4c — dispara o WORKFLOW de survey (que é quem faz o `collect`).
  #
  # Por que não `collect` aqui: este skill roda como HOOK AGENT (especialista na
  # sessão do processo, perfil agent). Hook agent NÃO pode suspender — o `collect`
  # suspende, e o bridge trata `suspended` como hook concluído → fecharia o contato
  # N3 antes de o cliente responder, e o resume falharia depois (mesma limitação
  # já conhecida dos hooks de on_contact_end com delegate). Além disso, perfil agent
  # proíbe `collect`.
  #
  # Então o hook só DISPARA um workflow de survey (sessão webhook própria, perfil
  # workflow) que pode suspender de verdade. `origin_session_id` propaga a RAIZ →
  # o workflow de survey (e o contato de survey que ele cria) são membros da MESMA
  # journey. Fire-and-forget: o hook completa na hora e o contato N3 fecha normal.
  - id: criar_survey_journey
    type: invoke
    tool: workflow_trigger
    input:
      skill_id:          "skill_survey_journey_v1"
      tenant_id:         "$.tenant_id"
      origin_session_id: "$.session_id"     # herda a raiz canônica da journey
      trigger_type:      "task"
    on_success: encerrar
    on_failure: encerrar

  - id: encerrar
    type: complete
    outcome: resolved
    issue_status: journey_survey_scheduled

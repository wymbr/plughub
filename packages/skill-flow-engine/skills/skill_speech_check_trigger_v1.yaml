id: skill_speech_check_trigger_v1
name: Verificação de fala — disparo
version: "1.0"
description: |
  Corpo do pool webhook que PEDE uma verificação ativa do caminho de fala (VOZ-23).

  Disparo manual: POST /v1/channels/webhook/pool/speech_check_trigger com
  `{ "context": { "speech_profile_id": "<perfil>", "requested_by": "<quem pediu>" } }` — sem
  `speech_profile_id`, a verificação usa a config do tenant.

  ⚠️ As chaves vão dentro de `context`, e não no topo do corpo: é `body.context` que o webhook grava
  no ContextStore (`webhook.py`, `ctx_writes`), e é de lá que o `@ctx.` lê. Chave no topo é ignorada
  em silêncio — o pedido sai SEM perfil e mede a config do tenant achando que mediu o perfil. A mesma porta serve uma Agenda do scheduler-api quando a periodicidade
  entrar (ficha própria).

  A tool `speech_check_run` devolve `isError` quando o serviço recusa — perfil inexistente (422),
  verificação já em curso (409), credencial ausente (503) —, e o `invoke` roteia `on_failure`:
  pedido recusado NUNCA parece aceito. O resultado não vem por aqui: sai em `speech.metrics` e é lido
  em `/reports/speech/checks`.

  ⚠️ O MOTIVO da recusa não é dito aqui, e isso é decisão medida (VOZ-27): `issue_status` no step
  `complete` NÃO EXISTE no contrato — `CompleteStepSchema` tem só `id/type/outcome/outcome_from`, a
  chave é descartada no parse, e 0 de 3 143 segmentos de agente de IA a têm preenchida (ficha
  `SFE-02`). Quem nomeia a recusa é o SERVIÇO: um 409 vira `speech_check_result` com
  `failure_reason: check_running`, no mesmo histórico que a tela lê. Escrever o motivo num campo
  inerte daria a impressão de registro sem registro nenhum.

  Perfil workflow (webhook, Arc 19): só invoke/complete.
classification:
  type: vertical

entry: pedir_verificacao

steps:
  - id: pedir_verificacao
    type: invoke
    tool: speech_check_run
    input:
      speech_profile_id: "@ctx.speech_profile_id"
      requested_by:      "@ctx.requested_by"
      tenant_id:         "$.tenant_id"
    output_as: pedido
    on_success: encerrar_ok
    on_failure: encerrar_falha

  - id: encerrar_ok
    type: complete
    outcome: resolved

  - id: encerrar_falha
    type: complete
    outcome: failed

# skill_survey_collect_v1.yaml
# Journey J4c — runner do POOL DE SURVEY (perfil agent, canal webchat).
# Spec: docs/product/journey-j4c-survey-collect-spec.md
#
# Atende a sessão inbound criada quando o cliente ABRE o link do survey
# (engajamento). Até o clique, o `collect` do N3 estava suspenso com ZERO recurso;
# a sessão só nasce aqui — por isso cota, max_concurrent_sessions e metering
# `sessions` incidem apenas sobre engajamentos reais.
#
# Como o cliente ESTÁ PRESENTE, o survey é SÍNCRONO — e é justamente isso que
# permite o interpretador único (`menu`, perfil agent) renderizar o DialogForm ao
# vivo. A espera assíncrona ficou toda no `collect` (perfil workflow), respeitando
# a segregação de perfis (`menu` e `suspend` nunca no mesmo skill).
#
# Interpretador ÚNICO dirigido por config: o form vem de @ctx.session.dialog_form_id.
# NENHUMA métrica hardcoded — `survey_record` compõe os sinais a partir do próprio
# DialogForm (dimensions/captures), e o output_key vem do render.
#
# Contexto semeado pelo channel-gateway (handle_collect_engage), antes do inbound:
#   session.dialog_form_id        — qual DialogForm renderizar
#   session.root_session_id       — RAIZ canônica da journey (chave do sinal N3)
#   session.workflow_resume_token — token p/ retomar o collect do N3 (= collect_token)
#
# Fluxo:
#   carregar_form → coletar (menu ao vivo) → gravar_sinal (grain=journey)
#                 → retomar (workflow_resume) → finalizar

id: skill_survey_collect_v1
name: "Survey Collect Runner v1 (J4c — contato de survey)"
version: "1.0"
description: |
  Runner genérico do pool de survey. Renderiza o DialogForm ao vivo para o cliente
  que abriu o link, grava o sinal grain=journey contra a raiz canônica da journey e
  retoma o workflow N3 suspenso no collect. Dirigido por config (form_id no ctx);
  domain-blind quanto à métrica — quem compõe os sinais é o DialogForm.
classification:
  type: horizontal
  domain: dialog

entry: carregar_form

steps:

  # ── 1. Conteúdo: carrega o DialogForm publicado ─────────────────────────────
  - id: carregar_form
    type: invoke
    tool: form_get
    input:
      form_id:   "@ctx.session.dialog_form_id"
      tenant_id: "$.tenant_id"
    output_as: dialog
    on_success: coletar
    on_failure: retomar_falha

  # ── 2. Canal: renderiza AO VIVO (cliente presente pós-clique) ───────────────
  # Render nativo single-question (§17.4): interaction/options/validation/retry/
  # timeout vêm do próprio form. Sem `visibility`: nesta sessão o cliente É o
  # contato (participante único), então o default (all) entrega corretamente.
  - id: coletar
    type: menu
    prompt: "{{$.pipeline_state.dialog.render.prompt}}"
    interaction: "$.pipeline_state.dialog.render.interaction"
    options: "$.pipeline_state.dialog.render.options"
    validation: "$.pipeline_state.dialog.render.validation"
    retry: "$.pipeline_state.dialog.render.retry"
    timeout_s: "$.pipeline_state.dialog.render.timeout_s"
    output_as: answers
    on_success: gravar_sinal
    on_failure: retomar_falha
    on_timeout: retomar_falha
    on_disconnect: retomar_falha

  # ── 3. Sinal N3: grain=journey, chaveado na RAIZ canônica ───────────────────
  # form_id + answers → survey_record compõe os sinais pelo DialogForm (dimensions
  # e captures). output_key vem do render → genérico, sem métrica no skill.
  - id: gravar_sinal
    type: invoke
    tool: survey_record
    input:
      tenant_id:         "$.tenant_id"
      origin_session_id: "@ctx.session.root_session_id"
      grain:             "journey"
      survey_session_id: "$.session_id"
      form_id:           "@ctx.session.dialog_form_id"
      answers:
        - output_key: "$.pipeline_state.dialog.render.output_key"
          value:      "$.pipeline_state.answers"
    on_success: retomar
    on_failure: retomar     # sinal falhou, mas o N3 não pode ficar pendurado

  # ── 4. Retoma o N3 (o collect resolve NO FIM — decisão do modelo) ───────────
  # O collect_token dobra como resume_token (gravado por handle_collect), então
  # reusa o handle_resume que já existe — sem tópico nem consumer novo.
  - id: retomar
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.session.workflow_resume_token"
      decision: "input"
      payload:
        value: "$.pipeline_state.answers"
    on_success: finalizar
    on_failure: finalizar

  # ── 4b. Falha/timeout/desconexão — retoma o N3 como timeout (nunca pendura) ──
  - id: retomar_falha
    type: invoke
    tool: workflow_resume
    input:
      resume_token: "@ctx.session.workflow_resume_token"
      decision: "timeout"
    on_success: finalizar
    on_failure: finalizar

  # ── 5. Fecha a sessão de survey (membro N1 da journey) ──────────────────────
  - id: finalizar
    type: complete
    outcome: resolved
    issue_status: survey_completed

# agente_wrapup_v1.yaml
#
# Agente de wrap-up pós-atendimento — acionado via pool hook on_human_end.
# Executa em conferência como specialist, em paralelo com agente_nps_v1.
#
# Responsabilidades:
#   - Coletar notas internas do agente humano (resumo, classificação, próximos passos)
#   - Registrar dados de wrap-up no ContextStore (session.wrapup.*)
#   - Obrigatório quando configurado — contato não fecha antes do wrap-up
#
# Isolamento de visibilidade (G7 — por-segmento):
#   Todas as mensagens usam visibility: ["@segment.served_human_participant_id"].
#   O prefixo @segment auto-resolve para segment.{wrapupSegId}.served_human_participant_id
#   (resolveSegmentRef), campo gravado pelo bridge no
#   join a partir do humano que ESTE hook serve. Assim cada wrap-up endereça só o seu
#   humano — funciona com 2+ humanos na conferência (o campo de SESSÃO global
#   core.contact.human_agent_participant_id colapsava em multi-humano). O cliente,
#   supervisores e os demais humanos NÃO veem este wrap-up.
#
# Invariantes:
#   - Wrap-up é obrigatório — o contato não fecha até este agente completar
#   - on_failure avança (nunca bloqueia indefinidamente)
#   - Timeout de 120s para cada interação — se o agente não responder, pula
#   - Todos os dados ficam em session.wrapup.* no ContextStore

id: skill_wrapup_v1
name: "Wrap-up v1 — notas internas pós-atendimento"
version: "1.0"
description: |
  Coleta notas internas do agente humano após o atendimento.
  Usa visibility array com participant_id do agente humano — apenas
  ele vê. Obrigatório quando configurado no pool hook on_human_end.
classification:
  type: orchestrator
  domain: quality

entry: solicitar_resumo

steps:

  # ── Solicitar resumo do atendimento ao agente humano ──────────────────────
  - id: solicitar_resumo
    type: menu
    interaction: text
    prompt: "📝 Wrap-up — por favor, descreva brevemente o que foi tratado neste atendimento:"
    visibility:
      - "@segment.served_human_participant_id"
    timeout_s: 30
    output_as: wrapup_resumo
    on_success: registrar_resumo
    on_failure: solicitar_classificacao
    on_timeout: solicitar_classificacao

  # ── Registrar resumo no ContextStore ──────────────────────────────────────
  # dotPath key (wrapup_resumo) deve coincidir com output_as do menu anterior.
  - id: registrar_resumo
    type: notify
    message: "✅ Resumo registrado."
    visibility:
      - "@segment.served_human_participant_id"
    context_tags:
      outputs:
        wrapup_resumo:
          tag: session.wrapup.resumo
          confidence: 1.0
          merge: overwrite
          # F5: scope segment (isola entre múltiplos wrap-ups num contato). O bridge
          # NÃO lê mais esta tag — a fonte é o pipeline_state.results do hook na
          # conclusão. A tag persiste para o detalhe sob demanda (§9).
          scope: segment
    on_success: solicitar_classificacao
    on_failure: solicitar_classificacao

  # ── Classificação do atendimento ──────────────────────────────────────────
  - id: solicitar_classificacao
    type: menu
    interaction: button
    prompt: "Como você classifica este atendimento?"
    visibility:
      - "@segment.served_human_participant_id"
    timeout_s: 30
    options:
      - id: resolvido
        label: "✅ Resolvido"
      - id: pendente
        label: "⏳ Pendente"
      - id: escalado
        label: "⬆️ Escalado"
      - id: cancelado
        label: "❌ Cancelado pelo cliente"
    output_as: wrapup_classificacao
    on_success: registrar_classificacao
    on_failure: solicitar_proximos_passos
    on_timeout: solicitar_proximos_passos

  # ── Registrar classificação ───────────────────────────────────────────────
  # dotPath key (wrapup_classificacao) deve coincidir com output_as do menu anterior.
  - id: registrar_classificacao
    type: notify
    message: "✅ Classificação registrada."
    visibility:
      - "@segment.served_human_participant_id"
    context_tags:
      outputs:
        wrapup_classificacao:
          tag: session.wrapup.classificacao
          confidence: 1.0
          merge: overwrite
          # F5: scope segment. O bridge lê a disposição do pipeline_state.results
          # do hook na conclusão (não desta tag), normaliza p/ outcome e grava o
          # cru em issue_status — atribuído ao SEGMENTO humano que o hook serviu.
          scope: segment
    # F7: se escalado, pergunta o MOTIVO normalizado antes dos próximos passos.
    on_success: verificar_escalacao
    on_failure: verificar_escalacao

  # ── F7: motivo de escalação (só quando classificação = escalado) ────────────
  - id: verificar_escalacao
    type: choice
    conditions:
      - field: "$.pipeline_state.wrapup_classificacao"
        operator: eq
        value: "escalado"
        next: solicitar_motivo_escalacao
    default: solicitar_proximos_passos

  # Opções espelham o seed config agent_activity/escalation_reasons (F7). Manter
  # em sincronia; o label exibido na bancada vem do config, não daqui.
  - id: solicitar_motivo_escalacao
    type: menu
    interaction: list
    prompt: "Qual o motivo da escalação?"
    visibility:
      - "@segment.served_human_participant_id"
    timeout_s: 30
    options:
      - id: customer_request
        label: "Solicitação do cliente"
      - id: out_of_scope
        label: "Fora do escopo"
      - id: needs_authorization
        label: "Falta de alçada"
      - id: technical_issue
        label: "Problema técnico"
      - id: specialist_needed
        label: "Requer especialista"
      - id: retention
        label: "Retenção / insatisfação"
      - id: policy_exception
        label: "Exceção de política"
      - id: other
        label: "Outro"
    output_as: wrapup_escalation_reason
    on_success: registrar_motivo_escalacao
    on_failure: solicitar_proximos_passos
    on_timeout: solicitar_proximos_passos

  - id: registrar_motivo_escalacao
    type: notify
    message: "✅ Motivo registrado."
    visibility:
      - "@segment.served_human_participant_id"
    context_tags:
      outputs:
        wrapup_escalation_reason:
          tag: session.wrapup.escalation_reason
          confidence: 1.0
          merge: overwrite
          # scope segment — o bridge lê do pipeline_state.results na conclusão.
          scope: segment
    on_success: solicitar_proximos_passos
    on_failure: solicitar_proximos_passos

  # ── Próximos passos (opcional) ────────────────────────────────────────────
  - id: solicitar_proximos_passos
    type: menu
    interaction: text
    prompt: "Há próximos passos necessários? (digite 'não' para pular)"
    visibility:
      - "@segment.served_human_participant_id"
    timeout_s: 30
    output_as: wrapup_proximos_passos
    on_success: registrar_proximos_passos
    on_failure: encerrar
    on_timeout: encerrar

  # ── Registrar próximos passos ─────────────────────────────────────────────
  # dotPath key (wrapup_proximos_passos) deve coincidir com output_as do menu anterior.
  - id: registrar_proximos_passos
    type: notify
    message: "✅ Wrap-up completo. Obrigado!"
    visibility:
      - "@segment.served_human_participant_id"
    context_tags:
      outputs:
        wrapup_proximos_passos:
          tag: session.wrapup.proximos_passos
          confidence: 1.0
          merge: overwrite
          scope: segment
    on_success: encerrar
    on_failure: encerrar

  # ── Encerramento ──────────────────────────────────────────────────────────
  - id: encerrar
    type: complete
    outcome: resolved

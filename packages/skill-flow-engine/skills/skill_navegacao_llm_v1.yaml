# skill_navegacao_llm_v1.yaml
#
# F5 do `docs/adr/adr-orchestrator-tree-navigation.md` (ORQ-05) — a PARIDADE.
#
# Este é o gêmeo com LLM do `skill_navegacao_v1`. A diferença de mecânica é toda
# num ponto: lá o cliente NAVEGA a árvore (menu por nível); aqui ele FALA, e o LLM
# escolhe o destino. O que os dois têm em comum é o que a fase existe para provar.
#
# ── D6: a árvore é o contrato COMUM ─────────────────────────────────────────────
#
# Com LLM quem navega é o LLM — não a árvore. Mas a árvore continua sendo o
# **domínio de desfechos permitidos**: o LLM navega livre e tem de **aterrissar
# numa folha declarada**. Três consequências, e nenhuma é enfeite:
#
#   1. Os dois orquestradores emitem o MESMO `category` (`{pool}.navegacao.destino.
#      {caminho}`) ⇒ mesma série, mesma lente, COMPARÁVEIS. Sem isso não há como
#      provar que o LLM roteia melhor: mediriam em unidades diferentes.
#   2. A folha de ESCAPE vira o *"não sei"* do LLM — e um fato CONTÁVEL, em vez de
#      um nulo indistinguível de "não perguntamos".
#   3. Restringir a saída a um vocabulário declarado é o que torna um roteador LLM
#      AVALIÁVEL. Livre, ele é inauditável.
#
# ⚠️ **O vocabulário é mandado E CONFERIDO, e as duas metades não se substituem.**
# Pôr a lista no prompt é instrução; o LLM pode devolver qualquer string, inclusive
# uma folha plausível que não existe. Quem decide é o `conferir` — a MESMA projeção
# que o orquestrador determinístico usa (`dialog_tree_level` com o caminho pontuado,
# F2). Confiar só no prompt seria promessa sem mecanismo.
#
# ⚠️ **O que este skill NÃO faz:** roteamento próprio. O mapa `caminho → pool` é o
# mesmo `navigation_pools` do pool (F3/D2), e a resolução é o mesmo
# `pool_route_resolve`. Um mapa próprio aqui seria a segunda casa do roteamento.

id: skill_navegacao_llm_v1
name: "Navegação LLM v1 — orquestrador com aterrissagem declarada"
version: "1.0"
description: |
  Orquestrador com LLM que recebe a demanda em TEXTO LIVRE e escolhe um destino
  dentro do vocabulário declarado no mesmo DialogForm que o orquestrador
  determinístico usa. Emite a mesma série do Arc 12, então os dois são
  comparáveis; o que o LLM não souber classificar cai na folha de escape, que é
  contável em vez de nula.
classification:
  type: orchestrator
  domain: customer_service

# -- Parametro de DEPLOY (PoolSkillSlot.config_json -> `$.config.*`) ----------
#
# Mesmo descritor do irmao deterministico (`skill_navegacao_v1`), e de proposito:
# os dois caminham a MESMA arvore com a MESMA tool (`dialog_tree_level`) e so
# diferem na FRENTE -- o deterministico mostra o nivel como menu, este pede texto
# livre e classifica com `reason` dentro do vocabulario declarado na forma. Sendo
# o conteudo o mesmo fato, o ponteiro para ele tem de ser configurado do mesmo
# jeito nos dois; modelos diferentes para o mesmo parametro e como comeca a
# divergencia que ninguem lembra de conciliar.
#
# A UI de *Flow > Deploy* renderiza este descritor (combo, por `source:
# dialogforms`), grava em `PoolSkillSlot.config_json` e o bridge injeta como
# `$.config.*` no launch. Escopo: o DEPLOY DO POOL.
#
# /!\ Exige deploy por slot com `config_json.form_id` preenchido. Sem ele o
# `dialog_tree_level` falha e o `on_failure` manda para `sem_navegacao`. Desde a
# PRM-01 o promote RECUSA esse estado em vez de deixar passar.
config_params:
  - key: form_id
    type: string
    label: "Árvore de navegação"
    description: "DialogForm com a árvore de opções que este pool navega"
    required: true
    source: dialogforms

entry: vocabulario

steps:

  # ── 1. O vocabulário de desfechos ───────────────────────────────────────────
  # `path: []` ⇒ `leaves` é a árvore INTEIRA. É esta lista que vai ao prompt e é
  # contra ela que a resposta é conferida — a mesma fonte para as duas metades,
  # senão o LLM receberia opções que a plataforma depois recusaria e o escape
  # contaria alto por defeito NOSSO.
  - id: vocabulario
    type: invoke
    tool: dialog_tree_level
    input:
      form_id:    "$.config.form_id"   # parametrizado por deploy (PoolSkillSlot.config_json)
      output_key: "destino"
      path:       []
      tenant_id:  "$.tenant_id"
    output_as: nivel
    on_success: saudar
    on_failure: sem_navegacao

  - id: saudar
    type: notify
    message: "Olá! Sou o assistente da PlugHub. Me conte com suas palavras o que você precisa."
    on_success: ouvir
    on_failure: ouvir

  # ── 2. A demanda em TEXTO LIVRE ─────────────────────────────────────────────
  # `interaction: text` é a diferença visível para o cliente. Onde o determinístico
  # oferece uma lista, aqui ele fala.
  #
  # WCH-02 (2026-09-22): numa CHAMADA a fala transcrita é só registro — nunca responde menu
  # (VOZ-05 fatia 5b, a regra que impede "espera um pouco" de virar escolha). Para o LLM ouvir o
  # que o cliente DIZ, o menu declara a coleta por voz. `text` fica na lista: no chat sem chamada
  # nada muda, e na chamada o cliente pode continuar escrevendo (a tela responde sempre).
  # `first_input_timeout_s` abaixo do `timeout_s` (regra de `menuCollectViolations`) e alto de
  # propósito: com a chamada aberta o cliente pode estar DIGITANDO, e o desfecho `timeout` da
  # coleta encerraria a conversa. `end_silence_ms` maior que o default (700): descrever o que se
  # precisa tem pausas, e cortar no meio mandaria meia frase ao LLM.
  - id: ouvir
    type: menu
    prompt:      "Diga ou escreva o que você precisa."
    interaction: text
    output_as:   fala
    timeout_s: 120
    collect:
      input: [voice, text]
      first_input_timeout_s: 110
      voice:
        end_silence_ms: 1200
        max_speech_s: 20
    on_success: classificar
    on_failure: finalizar
    on_timeout: finalizar
    on_disconnect: finalizar

  # ── 3. O LLM escolhe DENTRO do vocabulário ──────────────────────────────────
  # ⚠️ `destinos_permitidos` vem do `vocabulario`, nunca de um literal aqui: um
  # literal envelheceria calado quando a forma mudasse, e o LLM passaria a ser
  # instruído com opções que não existem mais.
  #
  # ── ORQ-12: o SIGNIFICADO da folha, e por que ele é um campo À PARTE ─────────
  #
  # Até 2026-09-22 o prompt recebia SÓ os caminhos (`sac.especialista`,
  # `auth_sac`…), e o LLM classificava pelo texto do CÓDIGO. Medido na sessão
  # `492aa613`: um pedido de aumento de limite aterrissou em `sac.especialista`,
  # o pega-tudo de quem não casa. `significado_dos_destinos` traz rótulo,
  # descrição e exemplos declarados na MESMA árvore (nunca a descrição do POOL,
  # que é texto de operador — o menu fala a língua do cliente, D5).
  #
  # ⚠️ **Dois campos, e não um**, porque as duas metades da D6 são diferentes:
  # `destinos_permitidos` é o vocabulário CONFERIDO no `conferir`, e existe
  # sempre; `significado_dos_destinos` é ajuda de classificação, e a tool o OMITE
  # quando as duas leituras da árvore divergem (ela loga o motivo). Pendurar o
  # prompt inteiro no campo opcional faria a divergência degradar para "o LLM não
  # recebeu destino nenhum" — todo contato escapando, por defeito nosso.
  - id: classificar
    type: reason
    prompt_id: navigation_router_v1
    customer_utterance: "$.pipeline_state.fala"
    input:
      instrucoes: |
        Você é o roteador de um atendimento. Leia o que o cliente escreveu e
        escolha UM destino da lista `destinos_permitidos`, devolvendo o caminho
        EXATAMENTE como aparece na lista. Não invente caminhos e não componha
        caminhos novos.

        `significado_dos_destinos` descreve cada caminho: `label` é como o destino
        aparece ao cliente, `description` diz o que ele cobre (e, quando escrito,
        quando NÃO usá-lo) e `examples` traz falas típicas de quem quer aquele
        destino. Decida pelo significado, não pelo texto do caminho. Quando esse
        campo não vier, decida pelo caminho mesmo.

        Se nada na lista servir, ou se você não tiver confiança suficiente,
        devolva a string vazia em `destino` — dizer "não sei" é uma resposta
        válida e preferível a um palpite.

        Quando você não escolher um destino porque DOIS OU TRÊS da lista são
        plausíveis e o cliente não disse o bastante para separá-los, devolva
        `destino` vazio e liste esses caminhos em `candidatos`, do mais provável
        ao menos, copiados EXATAMENTE como aparecem na lista. O cliente será
        perguntado uma única vez sobre eles, então liste só os que você de fato
        não consegue separar — nunca a lista inteira, e nunca um candidato que
        você já descartou. Se nada servir, deixe `candidatos` vazio: aí o caso é
        de atendente, não de pergunta.
      destinos_permitidos:     "$.pipeline_state.nivel.leaves"
      significado_dos_destinos: "$.pipeline_state.nivel.vocabulary"
      fala_do_cliente:         "$.pipeline_state.fala"
    output_schema:
      destino:
        type: string
      confianca:
        type: number
      # ORQ-13 — os candidatos que o modelo não conseguiu separar. `required:
      # false` de propósito: o caso normal é escolher, e exigir o campo faria o
      # `validateAgainstSchema` reprovar toda classificação confiante (→ `escapar`,
      # o oposto do que esta ficha entrega).
      candidatos:
        type: array
        required: false
        description: >
          Caminhos plausíveis que você não conseguiu separar, do mais provável ao
          menos. Só quando `destino` for vazio. Máximo 3.
        items:
          type: string
    output_as: classificacao
    on_success: triagem
    on_failure: escapar

  # ── 3b. Escolheu, hesitou, ou não sabe? (ORQ-13) ────────────────────────────
  #
  # A porta que faltava entre *"não sei"* e o escape. Antes daqui, `destino`
  # vazio ia ao `conferir`, voltava `found: false` e caía em `nao_se_aplica` — o
  # cliente que disse algo classificável em duas folhas recebia um atendente sem
  # nunca ter sido perguntado qual das duas era.
  #
  # ⚠️ **A ordem das condições É a regra**: destino preenchido VENCE, mesmo que o
  # modelo também tenha listado candidatos. Sem isso, um modelo prestativo que
  # sempre preenchesse `candidatos` poria uma pergunta extra em todo contato.
  #
  # ⚠️ `neq ""` só é seguro porque `destino` é `required` no `output_schema`: uma
  # resposta sem o campo (ou com `null`) reprova na validação do `reason` e vai
  # pelo `on_failure`, então aqui ele é sempre string. Fosse opcional, `undefined
  # !== ""` mandaria o "não respondeu" para o caminho do confiante.
  - id: triagem
    type: choice
    conditions:
      - field: "$.pipeline_state.classificacao.destino"
        operator: neq
        value: ""
        next: conferir
      - field: "$.pipeline_state.classificacao.candidatos"
        operator: exists
        next: esclarecer_opcoes
    default: escapar

  # ── 4. A CONFERÊNCIA — é ela que faz a D6 valer ─────────────────────────────
  # O prompt pediu; isto verifica. Usa a MESMA projeção do orquestrador
  # determinístico, com o caminho pontuado (F2): `found && is_leaf` é a definição
  # de "aterrissou numa folha declarada". Caminho inventado, pasta em vez de folha,
  # string vazia — os três caem no mesmo lugar, e o lugar é contável.
  # ⚠️ **A question ATIVA, nunca a raiz fixa** (ORQ-17, medido em 2026-09-22). Este
  # step dizia `output_key: "destino"`, e depois de uma continuação o cursor vive
  # em OUTRA question: o cliente dizia *"obrigado"*, o LLM respondia `encerrar`
  # — certo —, e a conferência procurava `encerrar` na árvore de ENTRADA, não
  # achava (`found: false`) e mandava para o escape, que termina em atendente
  # humano. O modelo acertou e a conferência jogou fora, sem nada ficar vermelho.
  # O gêmeo determinístico já endereçava assim, com este mesmo aviso.
  - id: conferir
    type: invoke
    tool: dialog_tree_level
    input:
      form_id:     "$.config.form_id"   # parametrizado por deploy (PoolSkillSlot.config_json)
      question_id: "$.pipeline_state.nivel.question_id"
      path:        []
      chosen_id:   "$.pipeline_state.classificacao.destino"
      tenant_id:   "$.tenant_id"
    output_as: nivel
    on_success: avaliar
    on_failure: escapar

  - id: avaliar
    type: choice
    conditions:
      - field: "$.pipeline_state.nivel.found"
        operator: eq
        value: false
        next: escapar
      - field: "$.pipeline_state.nivel.is_leaf"
        operator: eq
        value: false
        next: escapar
      # ── COMANDO, e nao demanda (RET-05) ────────────────────────────────────
      # A árvore roteia demanda para POOL; "encerrar" não é pool nenhum. Comando
      # é do FLUXO, não do mapa: pôr `pos_atendimento.encerrar` no
      # `navigation_pools` exigiria inventar um pool que significasse "fim", e o
      # roteamento passaria a carregar semântica de controle.
      #
      # ⚠️ Dívida NOMEADA: hoje é UM caminho declarado aqui. Um terceiro comando
      # obriga o gênero a subir para a árvore (um `kind` de folha), senão o fluxo
      # vira catálogo de caminhos — a segunda casa do conteúdo que a D2 impede.
      - field: "$.pipeline_state.nivel.category_path"
        operator: eq
        value: "pos_atendimento.encerrar"
        next: finalizar
      # "Tenho outro assunto" REINICIA a navegacao na raiz — e comando, nao
      # destino. A alternativa avaliada era uma folha `pos_atendimento.sac`
      # apontando para o pool do SAC; foi RECUSADA porque quem diz *"outro
      # assunto"* nao disse QUAL, entao cairia no menu de motivo do especialista
      # e ficaria preso ao SAC, quando o que quer e a arvore inteira. Quem achou
      # isso foi o ramo H do gate da arvore, que mede folha roteada sem ramo no
      # destino — o gate estava certo e a forma e que estava errada.
      - field: "$.pipeline_state.nivel.category_path"
        operator: eq
        value: "pos_atendimento.outra_coisa"
        next: vocabulario
    default: avisar_destino

  # ── 4b. O cliente SABE para onde está indo (WCH-10) ─────────────────────────
  # Medido no teste do dono (sessão `492aa613`): a IA entendeu o pedido, transferiu, e o cliente
  # só viu *"Agente entrou no atendimento"* — numa CHAMADA, silêncio é indistinguível de queda.
  #
  # ⚠️ **Dois avisos, não um**, porque são dois desfechos diferentes: aqui o roteador SABE o
  # destino e o confirma (é a confirmação de entendimento que faltava); no escape ele não sabe, e
  # dizer o rótulo de *"Nenhuma dessas"* seria confirmar uma coisa que o cliente não pediu.
  #
  # ⚠️ O texto é do FLUXO e o rótulo vem da ÁRVORE (D7 do ADR): mensagem POR FOLHA voltaria a pôr
  # conteúdo no mapa, que é o que a D2 impede. `node_label` é o rótulo do nó do cursor, já
  # resolvido na língua da sessão pela mesma projeção que conferiu a folha.
  # ── 4c. A pergunta de esclarecimento (ORQ-13) ───────────────────────────────
  #
  # Os caminhos vêm do LLM; os RÓTULOS vêm da árvore, e a tool confere um contra
  # o outro — candidato inventado não vira botão (é a D6 aplicada à PERGUNTA, e
  # não só ao desfecho). Por isso o `only_paths` mora na mesma projeção que já
  # confere a aterrissagem: duas conferências em casas diferentes divergiriam.
  - id: esclarecer_opcoes
    type: invoke
    tool: dialog_tree_level
    input:
      form_id:     "$.config.form_id"
      # A question ATIVA, pelo mesmo motivo do `conferir` (ORQ-17): os candidatos
      # vêm do vocabulário do nível CORRENTE, e conferi-los contra a árvore de
      # entrada descartaria todos depois de uma continuação.
      question_id: "$.pipeline_state.nivel.question_id"
      path:        []
      only_paths:  "$.pipeline_state.classificacao.candidatos"
      tenant_id:   "$.tenant_id"
    output_as: esclarecimento
    on_success: avaliar_esclarecimento
    on_failure: escapar

  # ⚠️ **Campo PRÓPRIO, e não `found` reaproveitado.** `found` já significa "o
  # caminho resolve"; fazê-lo significar também "há candidatos bastantes" seria um
  # valor com dois fatos — exatamente o defeito que a TRF-02 mediu em
  # `outcome='suspended'` e custou uma leitura errada de relatório.
  #
  # **`gte 2` porque uma opção não é escolha.** Um candidato só significa que o
  # modelo tinha um palpite e não o assumiu; perguntar "é isto?" com um botão só
  # empurra o cliente para o palpite, que é pior que escapar — o escape é contável
  # e a confirmação forçada não.
  - id: avaliar_esclarecimento
    type: choice
    conditions:
      - field: "$.pipeline_state.esclarecimento.candidate_count"
        operator: gte
        value: 2
        next: perguntar_esclarecimento
    default: escapar

  # ⚠️ **O texto é do FLUXO, os rótulos são da ÁRVORE** (D7). Uma pergunta por
  # folha voltaria a pôr conteúdo no mapa.
  #
  # ⚠️ **Uma pergunta, e o teto é ESTRUTURAL, não um contador.** A resposta vai ao
  # `conferir_esclarecido` → `avaliar`, e `avaliar` escapa: não há aresta de volta
  # para cá. Contador precisaria de lugar para morar e de alguém que o zerasse;
  # a ausência de aresta não tem como envelhecer.
  #
  # `button` porque são no máximo 3 (o teto do WhatsApp, imposto na tool). A
  # coleta declara `dtmf` para a chamada telefônica — sem ela o cliente na voz
  # ouviria as opções e não teria como responder.
  - id: perguntar_esclarecimento
    type: menu
    prompt:      "Só para eu não te encaminhar errado: qual destes é o seu caso?"
    interaction: button
    options:     "$.pipeline_state.esclarecimento.options"
    output_as:   escolha_esclarecida
    timeout_s: 120
    collect:
      input: [dtmf, voice, text]
      first_input_timeout_s: 110
      voice:
        end_silence_ms: 900
        max_speech_s: 12
    on_success: conferir_esclarecido
    on_failure: escapar
    on_timeout: finalizar
    on_disconnect: finalizar

  # O `id` do botão é o CAMINHO PONTUADO, e esta é a mesma tool que o divide —
  # o fluxo não remonta caminho nenhum. Daqui em diante é o trilho normal:
  # `avaliar` decide folha, comando e reinício, sem uma segunda casa para isso.
  - id: conferir_esclarecido
    type: invoke
    tool: dialog_tree_level
    input:
      form_id:     "$.config.form_id"
      question_id: "$.pipeline_state.nivel.question_id"   # a ATIVA (ORQ-17)
      path:        []
      chosen_id:   "$.pipeline_state.escolha_esclarecida"
      tenant_id:   "$.tenant_id"
    output_as: nivel
    on_success: avaliar
    on_failure: escapar

  - id: avisar_destino
    type: notify
    message: "Entendi: {{$.pipeline_state.nivel.node_label}}. Vou te encaminhar agora — um momento."
    on_success: registrar_demanda
    on_failure: registrar_demanda

  - id: avisar_escape
    type: notify
    message: "Não consegui identificar o assunto com segurança. Vou te encaminhar para um atendente — um momento."
    on_success: registrar_demanda
    on_failure: registrar_demanda

  # ── 5. O ESCAPE é um FATO, não um buraco ────────────────────────────────────
  # D6.2 + D7 do ADR da árvore: sem esta folha, "o LLM não soube" seria um nulo
  # indistinguível de "não perguntamos". Com ela, é uma linha na MESMA série — dá
  # para contar quantos por cento o roteador não classificou, que é a métrica que
  # decide se ele presta.
  #
  # ⚠️ Vai pela projeção também, e não por um literal montado aqui: se a folha de
  # escape sumir da forma, isto tem de falhar, não fabricar um caminho que a lente
  # desenharia como se alguém o tivesse autorado.
  # ⚠️ **Este endereça a ENTRADA de propósito, e é a exceção da ORQ-17.** O
  # `nao_se_aplica` é folha da árvore de entrada e não existe na continuação;
  # apontá-lo para a question ativa faria o ESCAPE falhar justamente quando o
  # fluxo já falhou — e o `on_failure` daqui é `sem_navegacao`, humano. Como o
  # `chosen_id` é LITERAL, a folha é declarada por construção: é o único
  # `dialog_tree_level` deste skill que pode ter endereço fixo.
  - id: escapar
    type: invoke
    tool: dialog_tree_level
    input:
      form_id:    "$.config.form_id"   # parametrizado por deploy (PoolSkillSlot.config_json)
      output_key: "destino"
      path:       []
      chosen_id:  "nao_se_aplica"
      tenant_id:  "$.tenant_id"
    output_as: nivel
    on_success: avisar_escape
    on_failure: sem_navegacao

  # ── 6. A MESMA série do determinístico ──────────────────────────────────────
  # `emitter` e `metric_key` IDÊNTICOS aos do `skill_navegacao_v1` — é isto que
  # torna os dois comparáveis. O que os separa é o `l1`, que é o POOL, e o pool é
  # a dimensão certa: "o pool com LLM classificou 82% e escapou em 18%; o
  # determinístico não escapa mas exige dois turnos".
  - id: registrar_demanda
    type: invoke
    tool: agent_event_record
    input:
      session_id: "$.session_id"
      segment_id: "$.segment_id"
      emitter:    "navegacao"
      metric_key: "destino"
      path:       "$.pipeline_state.nivel.category_path"
      value: 1
      tags:
        dialog_form_id:      "$.pipeline_state.nivel.form_id"
        dialog_form_version: "{{$.pipeline_state.nivel.version}}"
    on_success: marcar_navegacao
    on_failure: marcar_navegacao

  - id: marcar_navegacao
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag:   "session.navegacao.path"
      value: "$.pipeline_state.nivel.category_path"
      confidence: 1.0
      visibility: "agents_only"
    on_success: resolver_rota
    on_failure: resolver_rota

  # ── 7. Roteamento — o MESMO mapa, a MESMA tool ──────────────────────────────
  - id: resolver_rota
    type: invoke
    tool: pool_route_resolve
    input:
      session_id: "$.session_id"
      path:       "$.pipeline_state.nivel.category_path"
      tenant_id:  "$.tenant_id"
    output_as: rota
    on_success: decidir_verbo
    on_failure: escalar_humano

  # ── RET-02: DELEGAR ou ESCALAR? ─────────────────────────────────────────────
  #
  # O verbo vem do `pool_route_resolve`, DERIVADO do que está promovido no
  # destino — nunca declarado no mapa nem aqui. Delegar é SUSPENDER este fluxo, e
  # ele só volta se o alvo chamar `workflow_resume`; um alvo que não devolve
  # deixaria o contato pendurado até o `timeout_hours`, com o cliente vendo o
  # especialista atender e nada ficando vermelho.
  #
  # ⚠️ **O default é ESCALAR**, e não é zelo: `escalate` é o comportamento de
  # sempre e não pendura ninguém. Qualquer dúvida — registry mudo, destino sem
  # deploy, cadeia de delegate — resolve para cá, com o motivo em
  # `rota.verb_reason`.
  - id: decidir_verbo
    type: choice
    conditions:
      - field: "$.pipeline_state.rota.verb"
        operator: eq
        value: "delegate"
        next: delegar
    default: escalar

  # O orquestrador MANTÉM `primary`; o especialista entra como `specialist` e sai.
  # Medido antes de existir: `limite_ia primary seq=0` → `dialog_runner specialist
  # seq=0` → `limite_ia primary seq=1`, em 24 delegações vivas.
  - id: delegar
    type: delegate
    pool: "$.pipeline_state.rota.pool"
    timeout_hours: 4
    # ── Teto do CICLO (RET-04) ────────────────────────────────────────────────
    # O ciclo `folha → agente → menu → folha` é sancionado pelo validador (passa
    # por steps que bloqueiam), e é justamente por ser sancionado que precisa de
    # fim: sem teto, navegar-ser atendido-voltar ao menu não para nunca.
    #
    # ⚠️ **Contador, nunca tempo:** `session_timeout` é por INATIVIDADE, e um
    # ciclo ativo — cliente escolhendo, agente atendendo — nunca bate nele.
    #
    # ⚠️ **Não é teto de licença.** Medido (D9 do ADR): a licença de IA é retida
    # pela SESSÃO estar aberta, não pelo laço; um cliente que faz muitas
    # perguntas a retém igual. O que isto impede é o laço SEM FIM.
    #
    # 5 é o orçamento de um atendimento razoável (resolver, voltar, resolver
    # outra coisa…). Estourou: o cliente claramente quer mais do que a árvore
    # sabe dar, e a saída é gente.
    max_iterations: 5
    on_max_iterations: escalar_humano
    # `input`/`approved` ⇒ o especialista concluiu e devolveu o controle.
    on_resume:  { next: continuar }
    # `rejected` ⇒ concluiu com veredicto NEGATIVO (o `precisa_humano` que os
    # executores devolvem). Quem decide transferir é este fluxo, não a folha.
    on_reject:  { next: escalar_humano }
    # Prazo estourado: o especialista não devolveu. Não se adivinha o desfecho.
    on_timeout: { next: escalar_humano }

  # ── O retorno: continua a árvore, ou encerra? ───────────────────────────────
  #
  # ⚠️ **Sem `on_return` declarado, ENCERRA** — que é o comportamento de hoje.
  # Por isso esta entrega não liga ciclo nenhum sozinha: nenhuma forma publicada
  # declara o ponteiro (medido: 0 de 14). Quem o ligar precisa do teto da RET-04
  # antes, senão o laço não tem fim.
  - id: continuar
    type: choice
    conditions:
      - field: "$.pipeline_state.nivel.on_return"
        operator: exists
        next: nivel_continuacao
    default: finalizar

  # Reentra no MESMO laço de navegação, uma question adiante. O cursor volta à
  # raiz daquela question (`path: []`), porque a continuação é raiz própria (D5).
  - id: nivel_continuacao
    type: invoke
    tool: dialog_tree_level
    input:
      form_id:     "$.config.form_id"   # parametrizado por deploy (PoolSkillSlot.config_json)
      question_id: "$.pipeline_state.nivel.on_return"
      path:        []
      tenant_id:   "$.tenant_id"
    output_as: nivel
    # ⚠️ O laço deste orquestrador não LISTA, ele ESCUTA — o ponto de reentrada é
    # `ouvir`, não um menu. E o vocabulário que o LLM pode escolher passa a ser o
    # da CONTINUAÇÃO (`nivel.leaves` foi reescrito acima): sem isso ele
    # classificaria a fala do cliente contra a árvore de ENTRADA, e aterrissaria
    # numa folha que este ponto do fluxo não oferece.
    on_success: ouvir
    on_failure: escalar_humano

  - id: escalar
    type: escalate
    target:
      pool: "$.pipeline_state.rota.pool"
    context: pipeline_state
    handoff_reason: "Navegação LLM: destino classificado a partir da fala do cliente"
    on_failure: encerrar_fallback

  - id: escalar_humano
    type: escalate
    target:
      pool: retencao_humano
    context: pipeline_state
    handoff_reason: "Navegação LLM terminou em atendimento humano"
    on_failure: encerrar_fallback

  - id: sem_navegacao
    type: escalate
    target:
      pool: retencao_humano
    context: pipeline_state
    handoff_reason: "DialogForm de navegação indisponível"
    on_failure: encerrar_fallback

  - id: encerrar_fallback
    type: complete
    outcome: failed
    issue_status: "Escalação falhou — pool de destino indisponível"

  - id: finalizar
    type: complete
    outcome: resolved
    issue_status: "Cliente encerrou durante a navegação"

# skill_navegacao_v1.yaml
#
# F1 do `docs/adr/adr-orchestrator-tree-navigation.md` (ORQ-01).
#
# Orquestrador determinístico cujo MENU é conteúdo autorado (`DialogForm`), não
# YAML. Substitui funcionalmente o `agente_triagem_v2` + o sub-menu do
# `skill_atendimento_sac_v1`, que hoje são dois artefatos com dois deploys.
#
# O QUE MUDA DE VERDADE (e é a razão da fase): **o eixo de DEMANDA passa a
# existir**. Medido em 2026-09-05: os cinco skills do caminho de atendimento
# emitem ZERO `agent_event` — toda resposta de menu que o cliente dá hoje é
# descartada, vive no `pipeline_state` e morre com a sessão. Medimos com precisão
# o que o AGENTE diz que o contato foi (wrap-up) e nada do que o CLIENTE disse
# que queria.
#
# ⚠️ ATUALIZADO NA F3/ORQ-03 (2026-09-06). O cabeçalho dizia que esta fase *"não
# toca no engine e não mexe no roteamento"*, e as duas metades caducaram: o engine
# mudou duas vezes (sentinela de ciclo, ORQ-07; alvo interpolável, esta), e o
# despacho deixou de ser `choice` + 5 `escalate` literais. O mapa caminho→pool
# nasceu, e mora na config do POOL (`navigation_pools`), nunca na folha da forma.
#
# ⚠️ A FOLHA CARREGA O CAMINHO, NUNCA O POOL (D2). O `DialogForm` é congelado no
# promote e o pool é DB-owned: um `pool_id` dentro da forma seria segunda fonte de
# verdade de roteamento, invisível de quem administra pools.
#
# O LAÇO: `mostrar` (menu) → `descer` → `avaliar` → `mostrar`. É ciclo, e é
# CONTROLADO por construção — o validador do engine aceita back-edge quando o
# ciclo passa por um step que bloqueia esperando o mundo externo, e `menu` é um
# deles por política declarada (2026-06-04). Sem step novo, sem iterador novo.
#
# ⚠️ DURABILIDADE (D11): o `pipeline_state` — e portanto o cursor `nivel.path` —
# É persistido no Redis a cada transição, e o engine retoma do `current_step_id`.
# O que NÃO sobrevive a uma queda é a ESPERA do `menu` (BLPOP em processo, sem
# reentrada). Isso é PARIDADE com o skill que este substitui, que tem exatamente
# a mesma propriedade — não é regressão. O modelo contextless é a `DUR-01`.

id: skill_navegacao_v1
name: "Navegação v1 — orquestrador dirigido por DialogForm"
version: "1.0"
description: |
  Orquestrador determinístico (sem LLM) que navega uma ÁRVORE de opções autorada
  num DialogForm: pastas navegam, folhas endereçam um serviço. Emite a demanda do
  cliente como `agent_event` (eixo que hoje não existe) e escala ao pool do
  serviço escolhido. Conteúdo no DialogForm; controle aqui; roteamento na
  config — três casas, nunca uma.
classification:
  type: orchestrator
  domain: customer_service

entry: nivel_raiz

steps:

  # ── 1. Nível raiz ───────────────────────────────────────────────────────────
  # `path: []` explícito. O primeiro nível não vem de lugar nenhum: dar-lhe um
  # default implícito faria "sem cursor" e "cursor vazio" virarem o mesmo fato.
  - id: nivel_raiz
    type: invoke
    tool: dialog_tree_level
    input:
      form_id:    "dialog_navegacao_atendimento_v1"
      output_key: "destino"
      path:       []
      tenant_id:  "$.tenant_id"
    output_as: nivel
    on_success: mostrar
    on_failure: sem_navegacao

  # ── 2. Mostrar o nível corrente ─────────────────────────────────────────────
  # `prompt` e `options` vêm por REF do nível projetado — é isto que faz o menu
  # ser conteúdo e não código. `interaction: list` por decisão (D4): navegação é
  # resposta ÚNICA; `checklist` descreveria o que aconteceu, não para quem ir.
  - id: mostrar
    type: menu
    # ⚠️ `{{...}}`, NUNCA ref pura. O `menu` passa o `prompt` por `interpolate`, que
    # só troca `{{...}}` — uma ref pura (`$.`) atravessa INTACTA e o cliente lê a
    # própria referência na tela. Medido em contato real. As `options` ao lado usam
    # ref pura de propósito: elas passam por `resolveInputValue`, que é outro
    # caminho, e ali `{{...}}` devolveria string em vez de array.
    prompt:      "{{$.pipeline_state.nivel.prompt}}"
    interaction: list
    options:     "$.pipeline_state.nivel.options"
    output_as:   escolha
    timeout_s: 120
    on_success: descer
    on_failure: finalizar
    on_timeout: finalizar
    on_disconnect: finalizar

  # ── 3. Descer um nível ──────────────────────────────────────────────────────
  # O APPEND é da tool, não daqui: o fluxo não tem primitiva que concatene array,
  # e guardar o caminho como string obrigaria cada skill a fabricar o separador —
  # justo o ponto onde a categoria do Arc 12 nasce.
  - id: descer
    type: invoke
    tool: dialog_tree_level
    input:
      form_id:    "dialog_navegacao_atendimento_v1"
      output_key: "destino"
      path:       "$.pipeline_state.nivel.path"
      chosen_id:  "$.pipeline_state.escolha"
      tenant_id:  "$.tenant_id"
    output_as: nivel
    on_success: avaliar
    on_failure: sem_navegacao

  # ── 4. Folha ou pasta? ──────────────────────────────────────────────────────
  # `found: false` é DADO, não erro: a forma pode ter mudado no meio do contato
  # (época), e aí o cursor deixa de resolver. Reiniciar a navegação é honesto;
  # seguir com um caminho que não existe mais seria inventar demanda.
  - id: avaliar
    type: choice
    conditions:
      - field: "$.pipeline_state.nivel.found"
        operator: eq
        value: false
        next: reiniciar
      - field: "$.pipeline_state.nivel.is_leaf"
        operator: eq
        value: true
        next: registrar_demanda
    default: mostrar

  - id: reiniciar
    type: notify
    message: "Desculpe, não reconheci essa opção. Vamos começar de novo."
    on_success: nivel_raiz
    on_failure: nivel_raiz

  # ── 5. A DEMANDA vira evento ────────────────────────────────────────────────
  # É a entrega desta fase. A categoria resultante é
  # `{pool}.navegacao.destino.{caminho}` — o primeiro segmento é o pool por
  # invariante do Arc 12, e a cauda é o caminho escolhido, então a lente de árvore
  # que já existe desenha isto sem uma linha de código nova.
  #
  # ⚠️ NÃO é o `agent_event`, e a diferença não é de conveniência. Aquele exige
  # `session_token` de `agent_login`, e o bridge não emite nenhum para agente
  # nativo de skill-flow (medido: ZERO ocorrências) — o eixo de demanda ficaria
  # inalcançável por este caminho. O `agent_event_record` identifica pela SESSÃO e
  # COMPÕE a categoria no servidor, lendo o pool do meta: o isolamento de namespace
  # que o Arc 12 exige passa a valer por CONSTRUÇÃO, em vez de por conferência de
  # uma string que o chamador montou. Por isso não há `{{@ctx.core.pool.id}}` aqui
  # — o pool deixou de ser assunto de quem emite.
  #
  # ⚠️ `emitter` é rótulo ESTÁVEL, nunca o `skill_id`: renomear o skill quebraria a
  # série no meio, e a série é o produto desta fase.
  #
  # ⚠️ Falhar aqui NÃO pode derrubar o atendimento: medir é secundário a atender.
  # `on_failure` segue para o roteamento — mas o `invoke` já loga o motivo, então a
  # degradação é barulhenta, não muda.
  - id: registrar_demanda
    type: invoke
    tool: agent_event_record
    input:
      session_id: "$.session_id"
      segment_id: "$.segment_id"
      emitter:    "navegacao"
      metric_key: "destino"
      path:       "$.pipeline_state.nivel.category_path"
      value: 1
      # ⚠️ O CARIMBO DE ÉPOCA são estas DUAS chaves, com estes nomes exatos: é por
      # `tags['dialog_form_id']` e `tags['dialog_form_version']` que a lente de
      # árvore separa vocabulários (D13/D14). Escrever `form_id` aqui não dá erro
      # em lugar nenhum — o evento simplesmente nasce SEM época, para sempre, e a
      # lente passa a devolver `single_vocabulary: false` sem saber dizer por quê.
      # Medido antes de corrigir: era exatamente isso que acontecia.
      #
      # E os dois valores vêm da SAÍDA da tool, não do YAML: o carimbo é fato do
      # RENDER, e `dialog_tree_level` é quem renderizou. Um literal aqui poderia
      # discordar da forma que o cliente realmente viu.
      tags:
        dialog_form_id:      "$.pipeline_state.nivel.form_id"
        dialog_form_version: "{{$.pipeline_state.nivel.version}}"
    on_success: resolver_rota
    on_failure: resolver_rota

  # ── 6. Roteamento — a TABELA saiu do fluxo (F3) ──────────────────────
  # Antes desta fase o despacho eram 6 steps: um `choice` de 5 condições sobre o
  # `root_id` mais um `escalate` LITERAL por destino. Isso é a tabela de roteamento
  # escrita no controle de fluxo — cada destino novo virava dois blocos de YAML, um
  # deploy de skill, e um lugar a mais para divergir da config do pool.
  #
  # ⚠️ O mapa mora no POOL (`navigation_pools`), NUNCA na folha da forma (D2): a forma
  # é congelada no promote e o pool é DB-owned e editável na UI. Trocar o pool que
  # atende `sac` é uma edição de config; não republica conteúdo nem redeploya skill.
  - id: resolver_rota
    type: invoke
    tool: pool_route_resolve
    input:
      session_id: "$.session_id"
      path:       "$.pipeline_state.nivel.category_path"
      tenant_id:  "$.tenant_id"
    output_as: rota
    on_success: escalar
    # Caminho sem rota declarada NÃO inventa destino — cai no humano, que é a mesma
    # coisa que a folha de escape pede. A DIFERENÇA entre "escolheu escape" e "escolheu
    # algo que ninguém mapeou" já está no `category_path` do evento, então o desfecho
    # pode coincidir sem que a medição os confunda.
    on_failure: escalar_humano

  # O alvo é uma REFERÊNCIA, e é isto que a F3 destrava. Se ela não resolver, o step
  # vai para `on_failure` NOMEANDO o que faltou — nunca despacha para um literal de
  # emergência, que seria o `queue_pool_id or pool_id` outra vez.
  - id: escalar
    type: escalate
    target:
      pool: "$.pipeline_state.rota.pool"
    context: pipeline_state
    handoff_reason: "Navegação: caminho escolhido pelo cliente"
    on_failure: encerrar_fallback

  # A folha de ESCAPE (D7 do ADR da árvore) e o default do roteamento caem no
  # mesmo lugar — e isso é decisão, não preguiça: "nenhuma dessas" e "escolheu
  # algo que não sei rotear" pedem a mesma coisa do cliente (um humano), e a
  # DIFERENÇA entre os dois já está registrada no `category_path` do evento.
  - id: escalar_humano
    type: escalate
    target:
      pool: retencao_humano
    context: pipeline_state
    handoff_reason: "Navegação terminou em atendimento humano"
    on_failure: encerrar_fallback

  # ── Terminais ───────────────────────────────────────────────────────────────
  # Forma indisponível NÃO cai num menu hardcoded de emergência: isso seria a
  # segunda casa do conteúdo, e ela envelheceria calada. Escala ao humano.
  - id: sem_navegacao
    type: escalate
    target:
      pool: retencao_humano
    context: pipeline_state
    handoff_reason: "DialogForm de navegação indisponível"
    on_failure: encerrar_fallback

  - id: encerrar_fallback
    type: complete
    outcome: failed
    issue_status: "Escalação falhou — pool de destino indisponível"

  - id: finalizar
    type: complete
    outcome: resolved
    issue_status: "Cliente encerrou durante a navegação"

# agente_nps_v1.yaml
#
# Agente de pesquisa NPS — acionado via pool hook on_human_end.
# Executa em conferência como specialist, em paralelo com agente_wrapup_v1.
#
# Responsabilidades:
#   - Verificar se o cliente ainda está conectado (@ctx.core.contact.close_origin)
#   - Se desconectado → encerra imediatamente sem pesquisa
#   - Se conectado → agradecer, aplicar pesquisa NPS (0–10 via botões)
#   - Registrar resposta no ContextStore (session.nps_score)
#
# Isolamento de visibilidade:
#   Todas as mensagens deste agente usam visibility com array contendo
#   o customer_participant_id. O agente humano NÃO vê o NPS — evita
#   animosidade caso o cliente dê nota baixa enquanto o agente ainda
#   está na conferência (fazendo wrap-up).
#
# Invariantes:
#   - Nunca bloqueia: on_failure sempre avança para encerrar
#   - NPS é opcional (timeout_s: 30 → encerra silenciosamente)
#   - Se cliente desconectou → complete imediato sem interação

id: skill_nps_v1
name: "NPS v1 — pesquisa de satisfação pós-atendimento"
version: "1.0"
description: |
  Pesquisa NPS isolada do agente humano. Conversa exclusivamente com
  o cliente via visibility array (customer_participant_id). O agente
  humano não vê as mensagens de avaliação.
classification:
  type: orchestrator
  domain: quality

entry: verificar_origem

steps:

  # ── Verificar se o cliente está conectado ─────────────────────────────────
  # Se close_origin é "customer_disconnect", o cliente já saiu — NPS não faz
  # sentido. Encerra sem interação.
  # Nota: com nps_on_disconnect=skip no pool YAML, o bridge já evita despachar
  # este agente quando o cliente desconecta; este choice é uma segunda linha de
  # defesa para o caso de nps_on_disconnect=timeout (ou campo ausente).
  - id: verificar_origem
    type: choice
    conditions:
      - field: "@ctx.core.contact.close_origin"
        operator: eq
        value: "customer_disconnect"
        next: encerrar_sem_pesquisa
    default: carregar_form

  # ── Coleta o NPS INLINE consumindo o primitivo de CONTEÚDO (form + form_get) ──
  # IMPORTANTE: hook de on_contact_end NÃO pode DELEGAR — delegar suspende o hook
  # agent, e o bridge trata "suspended" como hook concluído → fecha o contato antes
  # de renderizar (validado nos logs 2026-07-06). Então o NPS fica inline (bloqueia,
  # segura o posatt), mas usa o DialogForm `dialog_nps_buttons` via form_get + o menu
  # dinâmico (interaction/options/visibility do §17.4) — mesmo conteúdo versionado
  # que o runner usaria, só que sem o veículo runner-especialista.
  - id: carregar_form
    type: invoke
    tool: form_get
    input:
      form_id:   "dialog_nps_buttons"
      tenant_id: "$.tenant_id"
    output_as: dialog
    on_success: solicitar_nps
    on_failure: encerrar

  # ── Pergunta NPS — interaction/options/visibility vêm do form (dinâmicos) ─────
  # visibility do form = customer-only → o agente humano não vê o NPS.
  - id: solicitar_nps
    type: menu
    prompt: "{{$.pipeline_state.dialog.render.prompt}}"
    interaction: "$.pipeline_state.dialog.render.interaction"
    options: "$.pipeline_state.dialog.render.options"
    visibility: "$.pipeline_state.dialog.render.visibility"
    output_as: nps_resposta
    timeout_s: 30
    on_success: agradecer_nps
    on_failure: encerrar
    on_timeout: encerrar
    on_disconnect: encerrar

  # ── Agradece a avaliação (pós-NPS) — customer-only ────────────────────────────
  # session.nps_score (context_tag) foi DROPADO: não é consumido (o bridge removeu
  # _apply_nps_to_segment; a fonte única do NPS é session_signal via survey_record).
  - id: agradecer_nps
    type: notify
    message: "Agradecemos sua avaliação! ✅"
    visibility:
      - "@ctx.core.contact.customer_participant_id"
    on_success: escolher_grao
    on_failure: escolher_grao

  # ── Ramifica o GRÃO pelo contexto (mesmo pool nps_ia serve humano e IA) ───────
  # Humano: o bridge carimba core.survey.segment_id (segmento do humano servido
  # por este on_human_end/on_contact_end) → grão SEGMENT (atribuível ao agente). IA
  # (contato resolvido só por IA, ex.: sac_ia): não há segmento humano → o stash fica
  # ausente → grão SESSION (origin = a própria sessão). Um pool, dois grãos.
  - id: escolher_grao
    type: choice
    conditions:
      - field:    "@ctx.core.survey.segment_id"
        operator: exists
        next:     gravar_sinal
    default: gravar_sinal_sessao

  # ── F10.3b (cutover unificado): grava o NPS de SEGMENTO via survey_record ─────
  # Caminho único de escrita (mesmo dos grãos session/journey). A atribuição
  # (segment_id/agent_key do humano avaliado) vem do @ctx escrito pelo bridge no
  # disparo do on_human_end. origin = a própria sessão (o segmento mora nela).
  # Fonte ÚNICA: segments.nps_score foi dropada (item 5) — só session_signal grava NPS.
  - id: gravar_sinal
    type: invoke
    tool: survey_record
    input:
      tenant_id:         "$.tenant_id"
      origin_session_id: "$.session_id"
      grain:             "segment"
      segment_id:        "@ctx.core.survey.segment_id"
      agent_key:         "@ctx.core.survey.agent_key"
      # Segurança Fase B — pool da sessão pesquisada. O hook roda NA conferência dela,
      # então o core.pool.id (escrito pela Routing Engine) é o pool da origem.
      pool_id:           "@ctx.core.pool.id"
      signals:
        - metric: "nps"
          value: "$.pipeline_state.nps_resposta"
    on_success: encerrar
    on_failure: encerrar

  # ── Grão SESSION (contato só-IA, sem segmento humano para atribuir) ──────────
  # origin = a própria sessão atendida (o hook roda na conferência dela).
  - id: gravar_sinal_sessao
    type: invoke
    tool: survey_record
    input:
      tenant_id:         "$.tenant_id"
      origin_session_id: "$.session_id"
      grain:             "session"
      survey_session_id: "$.session_id"
      # Segurança Fase B — pool da sessão pesquisada (a própria; hook roda nela).
      pool_id:           "@ctx.core.pool.id"
      signals:
        - metric: "nps"
          value: "$.pipeline_state.nps_resposta"
    on_success: encerrar
    on_failure: encerrar

  # ── Encerramento normal ───────────────────────────────────────────────────
  - id: encerrar
    type: complete
    outcome: resolved

  # ── Encerramento sem pesquisa (cliente desconectado) ──────────────────────
  - id: encerrar_sem_pesquisa
    type: complete
    outcome: resolved

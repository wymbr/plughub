# ⚠️ NÃO DEPLOYADO — nenhum pool declara este skill (medido 2026-08-03).
# Ver a nota completa em `skill_survey_runner_v1.yaml`. Quarentena documentada.
# CUIDADO ao decidir: o outbound VIVO hoje é outro par —
# `skill_outbound_survey_dispatch_v1` / `skill_outbound_survey_worker_v1` (arco
# Outbound fase 5b), que TÊM pool. Este aqui é o desenho anterior, e a semelhança
# de nome já é armadilha por si.
#
# skill_survey_outbound_v1.yaml
# Survey — WORKFLOW OUTBOUND (perfil workflow, canal webhook).
# Era `skill_survey_journey_v1` (renomeado 2026-07-14 — ver skill_survey_trigger_v1.yaml
# para o porquê da nomeação por PAPEL e não por grão).
# Spec: docs/product/journey-j4c-survey-collect-spec.md
#
# Disparado (fire-and-forget) pelo gatilho (`skill_survey_trigger_v1`) via
# workflow_trigger, com origin_session_id = a sessão de origem → herda a RAIZ canônica,
# então este workflow e o contato de survey que ele gera são membros da MESMA journey.
#
# É AQUI que o `collect` vive (e não no gatilho): perfil workflow permite
# `collect`/`suspend`; perfil agent (hook) não — e um hook que suspende seria tratado
# como concluído pelo bridge, fechando o contato antes da resposta.
#
# Modelo (decisão 2026-07-10):
#   • LAZY — o collect entrega o link do survey e SUSPENDE. Zero sessão, zero recurso,
#     zero metering enquanto espera. Sem clique até o timeout → nada foi alocado (só a
#     chave pending expira).
#   • CLIQUE — abrir o link cria um CONTATO inbound padrão (membro N1 da journey) no
#     pool de survey; o cliente está PRESENTE, então o survey é SÍNCRONO e o runner
#     genérico (skill_survey_runner_v1) renderiza o DialogForm ao vivo. Cota +
#     max_concurrent_sessions + metering incidem só no engajamento real.
#   • FIM — o runner grava o sinal e retoma este collect.
#
# N3 é CHANNEL-AGNOSTIC: declara `channel_policy` (intenção) e NUNCA nomeia o canal.
# Quem decide é o resolvedor N2 (handler do persistCollect), a partir de alcançabilidade
# + consentimento + política do tenant + esta policy. Nomear `channel` aqui seria vazar
# a decisão de N2 para N3.

id: skill_survey_outbound_v1
name: "Survey Outbound (collect + espera)"
version: "1.0"
description: |
  Workflow de pesquisa outbound. Faz um `collect` channel-agnostic: entrega o convite e
  suspende sem alocar recurso. O contato de survey só nasce se o cliente engajar. O
  collect resolve NO FIM (respostas), então o workflow sabe se a pesquisa foi respondida
  ou abandonada.
classification:
  type: vertical

# ── Config de DEPLOY (config_json do slot → $.config.*) ──────────────────────
# Canal e pool que atendem a pesquisa são **regra de negócio do tenant**, não do skill
# nem do core. Por isso entram como config injetada no deploy: o mesmo skill genérico
# serve um tenant que pesquisa por webchat e outro por SMS, sem nenhuma linha diferente.
#
# As CHAVES do mapa `channels` são os canais permitidos; os VALORES, o pool que atende
# cada um. O resolvedor N2 negocia entre as chaves (alcançabilidade, consentimento,
# preferência) e lê o pool no valor.
config_params:
  - key: channel_policy
    type: object
    required: true
    label: "Política de canal do survey (canal → pool)"
    description: >
      Ex.: { "channels": { "webchat": "survey_web_ia" }, "preferred_order": ["webchat"] }.
      As chaves de `channels` são os canais por onde a pesquisa pode sair; o valor é o
      pool que atende aquele canal.

  # S2 — o GRÃO é parâmetro, não uma família de skills. Papel e grão são eixos
  # ortogonais: nomear skills pelo grão duplicaria a cadeia inteira (gatilho × workflow ×
  # runner, vezes N grãos) para uma diferença que é de config.
  - key: grain
    type: string
    required: false
    label: "Grão do sinal (journey | session | workflow)"
    description: >
      O que a pesquisa COBRE. `journey` (default) chaveia o sinal na raiz canônica do
      processo; `session` chaveia na sessão que disparou o survey; `workflow`, no próprio
      workflow. A tradução grão→chave é feita pelo resolvedor N2, que é quem tem o
      contexto do chamador. `segment` NÃO é suportado por aqui (survey_record exige
      segment_id, que o workflow outbound não conhece).

entry: pesquisar

steps:

  # ── `ler_journey_ctx` REMOVIDO (ALW-01, 2026-09-02) ────────────────────────
  #
  # Era a metade LEITORA de um par de demo: `marcar_journey` (em
  # `skill_journey_demo_v1`) escrevia `journey.origin_process_session` na sessão do
  # PROCESSO, e este passo o lia daqui — outra sessão da mesma journey — ecoando em
  # `session.journey_echo` para provar que `@ctx.journey.*` cruza sessões.
  #
  # ⚠️ **O escritor já não existe**: `skill_journey_demo_v1` foi removido, e o censo
  # lista `journey.origin_process_session` em "lidos sem escritor". Pelo contrato do
  # próprio passo — *"se o roteamento estiver quebrado, o `@ctx.journey.*` resolve
  # para null, o `value` rejeita e o invoke falha"* — ele passou a falhar SEMPRE,
  # caindo no `on_failure`. Deixou de ser instrumento e virou ruído: uma falha que
  # não distingue mais roteamento quebrado de par desfeito.
  #
  # O gatilho declarado no `CHANGELOG.md` de 2026-08-13 era *"remover quando houver
  # um consumidor real de `@ctx.journey.*`"*. O desfecho foi o outro: o produtor sumiu
  # antes. Decisão do dono em 2026-09-02, no contexto da V4 — `session.journey_echo`
  # era a única tag de skill que o portão de publish recusaria, e registrá-la seria
  # cadastrar detrito.
  #
  # A prova de que `@ctx.journey.*` cruza sessões continua registrada: `CHANGELOG.md`
  # de 2026-08-13, com TTL medido (2591667s) e controle negativo (a tag NÃO aparece no
  # hash da sessão do processo). Quem precisar reexercer isso escreve um gate, não um
  # passo em skill de produto.

  # ── collect outbound — convite + espera assíncrona SEM recurso ──────────────
  - id: pesquisar
    type: collect
    target:
      type: customer
      id: "@ctx.caller.customer_id"
    # O skill NÃO nomeia canal nem pool — ele nem tem onde escrever "webchat".
    # A política vem do deploy, por referência.
    channel_policy: "$.config.channel_policy"
    dialog_form_id: "dialog_nps_buttons"
    # S2 — grão por config. Ausente no config_json → o N2 assume `journey` (retrocompat
    # com os collects anteriores, que gravavam grain=journey hardcoded no runner).
    signal_grain: "$.config.grain"
    interaction: "form"
    prompt: "Pesquisa de satisfação"
    timeout_hours: 48
    business_hours: false
    output_as: survey_result
    on_response:
      next: respondida
    on_timeout:
      next: sem_resposta

  # ── cliente respondeu (o sinal já foi gravado pelo runner) ──────────────────
  - id: respondida
    type: complete
    outcome: resolved
    issue_status: survey_answered

  # ── não engajou até o deadline — nada foi alocado ───────────────────────────
  - id: sem_resposta
    type: complete
    outcome: resolved
    issue_status: survey_not_answered

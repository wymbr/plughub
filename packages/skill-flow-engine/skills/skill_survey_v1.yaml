id: skill_survey_v1
name: "Survey de Sessão v1 — pesquisa grão session (F10.2b)"
version: "1.0"
description: |
  Workflow de pesquisa (perfil webhook — registrado no pool survey_processo_ia).
  Disparado pelo PASSO FINAL do fluxo primário via workflow_trigger, que passa o
  session_id do contato como origin_session_id (gravado em session.origin_session_id
  no ContextStore desta sessão de survey). Grava o sinal CONTRA a sessão original
  via survey_record (grain=session).

  F10.2b.2: coleta o NPS real do cliente via step delegate (agente_survey_nps_v1
  no pool survey_collector_ia) e grava o valor coletado via survey_record.
  O delegate guarda o payload do resume em pipeline_state.results[step.id], então
  a nota fica em $.pipeline_state.coletar_nps.nps.
classification:
  type: vertical

entry: coletar_nps

steps:
  # ── Coleta o NPS do cliente via delegate (sessão-filho channel-aware) ─────────
  # O agente coletor faz notify+menu e chama workflow_resume(payload={nps}).
  # origin_session_id é propagado para o coletor (rastreabilidade/contexto).
  - id: coletar_nps
    type: delegate
    pool: survey_collector_ia
    context:
      origin_session_id: "@ctx.session.origin_session_id"
      # contact_identifier: handle_delegate grava pending_workflow:{contact}=resume_token,
      # permitindo a reconexão (inbound_only) religar a survey. Sem customer_present:
      # o coletor vai a aguardar_inbound (fica pendente até o cliente reconectar).
      contact_identifier: "@ctx.session.contact_identifier"
    timeout_hours: 1
    on_resume:
      next: gravar_pesquisa     # decision=input — cliente respondeu (no reconnect)
    on_timeout:
      next: encerrar            # decision=timeout — sem resposta, não grava sinal

  # ── Grava o sinal contra a sessão original com o NPS coletado ─────────────────
  # tenant_id/origin_session_id explícitos (workflow não tem session_token).
  # value vem do payload do resume: pipeline_state.results.coletar_nps.nps.
  - id: gravar_pesquisa
    type: invoke
    tool: survey_record
    input:
      tenant_id:         "$.tenant_id"
      origin_session_id: "@ctx.session.origin_session_id"
      grain:             "session"
      survey_session_id: "$.session_id"
      signals:
        - metric: "nps"
          value: "$.pipeline_state.coletar_nps.nps"
    on_success: encerrar
    on_failure: encerrar

  - id: encerrar
    type: complete
    outcome: resolved

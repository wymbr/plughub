# ─────────────────────────────────────────────────────────────────────────────
# Porta de entrada — runner de PLATAFORMA (PID-04, 2026-09-14)
#
# ADR: docs/adr/adr-identity-door-evidence.md § D2 (a porta é pool + runner de plataforma)
#
# O que a porta faz, e só isto: IDENTIFICA (âncora → cliente), PROVA quando a consulta
# exige (OTP ao canal cadastrado), ACHA a pendência, UNE a journey do acesso à do
# processo, e ENCAMINHA:
#
#   sem pendência        → coleta o formulário do processo novo e dispara `on_new_pool`
#   pendência `auto`     → delega ao pool que PARQUEOU a pendência (`pendencia.pool`):
#                          o resultado já saiu, quem o entrega é quem o parqueou
#   pendência `offer`    → delega ao pool de CONTINUIDADE do domínio (`on_pending_pool`),
#                          dono do menu "consultar / cancelar / outro assunto"
#   identidade insuficiente → `degrade_target` (D12: degradar é caminho, não exceção)
#
# ⚠️ Por que a continuidade NÃO é da porta (decisão do dono, 2026-09-14): o `offer` quer
# dizer coisas diferentes em cada processo (no limite, "em análise, só consulte"; na
# portabilidade, "aprovado, confirme"), e o menu mostra dados da pendência (cartão,
# valor). Esses dados não podem morar no roteiro: o `interpolate` é de passe único, e um
# texto de forma com `{{…}}` chegaria ao cliente com as chaves literais. O domínio lê os
# fatos do processo da JOURNEY (a porta a une antes de delegar) e escreve a frase.
#
# ⚠️ Repassar a pendência inteira no `delegate.context` foi tentado e recusado pelo
# cadastro do ContextStore: viraria um conjunto de tags com nome decidido em runtime, e
# o cadastro é conferido por análise estática. O fato já tinha casa — a journey.
#
# ⚠️ O processo novo é disparado por OBJETO (`context_fields` + `anchors`), nunca por
# template de `context_json`. Medido no intake que este runner substitui: um número de
# cartão com `", "session.cpf": "<outro>"` fez o processo nascer com o CPF de outra
# pessoa, depois de o cliente provar o próprio por OTP.
#
# Conteúdo: TODA frase vem do roteiro (`dialog_form_id`, por `render.by_node.<step>`),
# salvo a de `falha_roteiro` — o caminho de quem não conseguiu carregar o roteiro não pode
# depender dele. Os rótulos dos botões são genéricos e ficam aqui.
#
# Não entraram, por falta de consumidor (medido: todas as portas vivas são `both` e
# nenhum canal carrega chave de retomada): `door_mode` e `accept_resume_key` do D2.
# O mecanismo de prova nasce DENTRO da porta (`require`); o orquestrador separado é a
# PID-05, com gatilho no segundo mecanismo.
# ─────────────────────────────────────────────────────────────────────────────

id: skill_intake_runner_v1
name: "Porta de entrada — runner de plataforma"
version: "1.0"
description: |
  Runner de plataforma da porta de entrada: identifica, prova quando a consulta exige,
  acha a pendência, une a journey e encaminha — processo novo, entrega do resultado ou
  continuidade do domínio. Tudo o que é do processo vem da config do pool.
classification:
  type: orchestrator
  domain: plataforma

config_params:
  - key: dialog_form_id
    type: string
    label: "Roteiro da porta"
    description: "DialogForm com as frases da porta, um nó por step"
    required: true
    source: dialogforms
  - key: anchor_kind
    type: string
    label: "Âncora de identificação"
    description: "O que o cliente informa para ser identificado"
    required: true
    options:
      - { value: cpf,   label: "CPF" }
      - { value: phone, label: "Telefone" }
      - { value: email, label: "E-mail" }
  - key: require
    type: string
    label: "Prova exigida para ver pendências"
    description: "otp = oferece código ao canal cadastrado; none = sem prova possível, degrada"
    required: true
    options:
      - { value: otp,  label: "Código (OTP) ao canal cadastrado" }
      - { value: none, label: "Nenhuma — degradar" }
  - key: proof_anchor_kind
    type: string
    label: "Canal da prova"
    description: "Para onde o código vai (a âncora tem de ser autoritativa para o cliente)"
    required: true
    options:
      - { value: phone, label: "Telefone" }
      - { value: email, label: "E-mail" }
  - key: new_form_id
    type: string
    label: "Formulário do processo novo"
    required: true
    source: dialogforms
  - key: on_new_pool
    type: string
    label: "Pool do processo (sem pendência)"
    required: true
    source: pools
  - key: on_pending_pool
    type: string
    label: "Pool de continuidade (pendência em andamento)"
    required: true
    source: pools
  - key: degrade_target
    type: string
    label: "Pool de degradação"
    description: "Para onde vai quem não consegue se identificar"
    required: true
    source: pools

entry: carregar_roteiro

steps:
  # ══ Roteiro ════════════════════════════════════════════════════════════════
  - id: carregar_roteiro
    type: invoke
    tool: form_get
    input:
      form_id:   "$.config.dialog_form_id"
      tenant_id: "$.tenant_id"
    output_as: roteiro
    on_success: saudacao
    on_failure: falha_roteiro

  # A ÚNICA frase cravada: é o caminho de quem não carregou o roteiro.
  - id: falha_roteiro
    type: notify
    message: "Estamos com uma instabilidade e não consigo te atender agora. Tente de novo em alguns minutos."
    on_success: finalizar_erro
    on_failure: finalizar_erro

  # ══ Identificação ══════════════════════════════════════════════════════════
  - id: saudacao
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.saudacao}}"
    on_success: coletar_contato
    on_failure: coletar_contato

  - id: coletar_contato
    type: menu
    prompt: "{{$.pipeline_state.roteiro.render.by_node.coletar_contato}}"
    interaction: text
    output_as: contato
    timeout_s: 180
    on_success: resolver_identidade
    on_failure: avisar_timeout
    on_timeout: avisar_timeout
    on_disconnect: finalizar_timeout

  - id: resolver_identidade
    type: invoke
    tool: customer_resolve
    input:
      tenant_id: "$.tenant_id"
      provision: true
      anchors:
        - kind:  "$.config.anchor_kind"
          value: "$.pipeline_state.contato"
    output_as: identidade
    on_success: escrever_caller_id
    on_failure: verificar_pendencia   # resolve falhou → segue sem carimbar; não bloqueia

  # Tag que o bridge lê no fechamento para carimbar sessions.customer_id.
  - id: escrever_caller_id
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag:   "caller.customer_id"
      value: "$.pipeline_state.identidade.customer_id"
      confidence: 1.0
      visibility: "agents_only"
    on_success: verificar_pendencia
    on_failure: verificar_pendencia

  # ══ Pendência ══════════════════════════════════════════════════════════════
  - id: verificar_pendencia
    type: invoke
    tool: pending_workflow_get
    input:
      tenant_id: "$.tenant_id"
      anchors:
        - kind:  "$.config.anchor_kind"
          value: "$.pipeline_state.contato"
    output_as: pendencia
    on_success: avaliar_resolucao
    on_failure: iniciar_solicitacao   # tool fora do ar → trata como cliente novo

  # Com âncora só `claimed`, a tool devolve verification_required SEM revelar se há
  # pendência (anti-enumeração).
  - id: avaliar_resolucao
    type: choice
    conditions:
      - field:    "$.pipeline_state.pendencia.verification_required"
        operator: eq
        value:    true
        next:     avaliar_exigencia
    default: avaliar_pendencia

  - id: avaliar_exigencia
    type: choice
    conditions:
      - field:    "$.config.require"
        operator: eq
        value:    "otp"
        next:     oferecer_verificacao
    default: avisar_transferencia       # sem mecanismo de prova: degrada

  - id: oferecer_verificacao
    type: menu
    prompt: "{{$.pipeline_state.roteiro.render.by_node.oferecer_verificacao}}"
    interaction: button
    options:
      - id: sim
        label: "✅ Enviar código"
      - id: atendente
        label: "🗣️ Falar com atendente"
      - id: encerrar
        label: "❌ Encerrar"
    output_as: quer_verificar
    timeout_s: 180
    on_success: avaliar_oferta
    on_failure: avisar_encerramento_verificacao
    on_timeout: avisar_encerramento_verificacao
    on_disconnect: finalizar_timeout

  # Recusar a verificação NÃO cai em processo novo: pode haver pendência (é por isso que
  # a oferta apareceu), e coletar outro formulário sem avisar criaria uma duplicata que
  # o cliente nem sabe que existe.
  - id: avaliar_oferta
    type: choice
    conditions:
      - field:    "$.pipeline_state.quer_verificar"
        operator: eq
        value:    "sim"
        next:     coletar_ancora_prova
      - field:    "$.pipeline_state.quer_verificar"
        operator: eq
        value:    "atendente"
        next:     avisar_transferencia
    default: avisar_encerramento_verificacao

  # ══ Degradação (D12) ═══════════════════════════════════════════════════════
  - id: avisar_transferencia
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_transferencia}}"
    on_success: degradar
    on_failure: degradar

  - id: degradar
    type: escalate
    target:
      pool: "$.config.degrade_target"
    context: pipeline_state
    error_reason: escalated_identity_verification_declined
    on_failure: avisar_encerramento_verificacao

  - id: avisar_encerramento_verificacao
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_encerramento_verificacao}}"
    on_success: finalizar
    on_failure: finalizar

  # ══ Prova — código ao canal CADASTRADO ═════════════════════════════════════
  # O cliente informa o canal, e o gateway só emite se ele for AUTORITATIVO para este
  # cliente. Uma frase só para toda recusa: dizer "não é o cadastrado" viraria oráculo.
  - id: coletar_ancora_prova
    type: menu
    prompt: "{{$.pipeline_state.roteiro.render.by_node.coletar_ancora_prova}}"
    interaction: text
    output_as: ancora_prova
    timeout_s: 180
    on_success: desafiar_posse
    on_failure: avisar_encerramento_verificacao
    on_timeout: avisar_encerramento_verificacao
    on_disconnect: finalizar_timeout

  - id: desafiar_posse
    type: invoke
    tool: otp_challenge
    input:
      tenant_id:   "$.tenant_id"
      customer_id: "@ctx.caller.customer_id"
      kind:        "$.config.proof_anchor_kind"
      value:       "$.pipeline_state.ancora_prova"
    output_as: otp_chal
    on_success: coletar_codigo_dialog
    on_failure: avisar_codigo_nao_enviado

  - id: avisar_codigo_nao_enviado
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_codigo_nao_enviado}}"
    on_success: degradar
    on_failure: degradar

  # O código GERADO nunca passa pelo runner de diálogo: challenge e verify ficam aqui.
  - id: coletar_codigo_dialog
    type: delegate
    pool: dialog_runner
    context:
      dialog_form_id: "dialog_otp_possession"
    timeout_hours: 1
    on_resume:
      next: verificar_codigo_otp
    on_timeout:
      next: iniciar_solicitacao

  - id: verificar_codigo_otp
    type: invoke
    tool: otp_verify
    input:
      tenant_id:   "$.tenant_id"
      customer_id: "@ctx.caller.customer_id"
      kind:        "$.config.proof_anchor_kind"
      value:       "$.pipeline_state.ancora_prova"
      code:        "$.pipeline_state.coletar_codigo_dialog.value"
    output_as: otp_res
    on_success: avaliar_verificacao
    on_failure: iniciar_solicitacao

  - id: avaliar_verificacao
    type: choice
    conditions:
      - field:    "$.pipeline_state.otp_res.verified"
        operator: eq
        value:    true
        next:     verificar_pendencia_pos_otp
    default: avisar_verificacao_falhou

  - id: avisar_verificacao_falhou
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_verificacao_falhou}}"
    on_success: iniciar_solicitacao
    on_failure: iniciar_solicitacao

  # Com a âncora da prova junto: é ela que está `possessed` agora.
  - id: verificar_pendencia_pos_otp
    type: invoke
    tool: pending_workflow_get
    input:
      tenant_id: "$.tenant_id"
      anchors:
        - kind:  "$.config.anchor_kind"
          value: "$.pipeline_state.contato"
        - kind:  "$.config.proof_anchor_kind"
          value: "$.pipeline_state.ancora_prova"
    output_as: pendencia
    on_success: avaliar_pendencia
    on_failure: iniciar_solicitacao

  - id: avaliar_pendencia
    type: choice
    conditions:
      - field:    "$.pipeline_state.pendencia.found"
        operator: eq
        value:    true
        next:     unificar_journey
    default: iniciar_solicitacao

  # ══ Pertença ao processo — de TODO acesso que encontrou pendência ══════════
  # PRIMEIRO unir, DEPOIS ler: sem o merge, `@ctx.journey.*` resolve para a raiz deste
  # acesso (vazia). `root_session_id` vem achatado no topo do `pending_workflow_get`.
  # Merge novo→antigo é acíclico e idempotente. Falha segue em frente, com log na tool.
  - id: unificar_journey
    type: invoke
    tool: journey_merge
    input:
      tenant_id:      "$.tenant_id"
      actor:          "skill_intake_runner_v1"
      source_root:    "$.session_id"
      canonical_root: "$.pipeline_state.pendencia.root_session_id"
    output_as: merge
    on_success: avaliar_politica_retomada
    on_failure: avaliar_politica_retomada

  # A política vem do step que criou a pendência — não é decisão da porta.
  - id: avaliar_politica_retomada
    type: choice
    conditions:
      - field:    "$.pipeline_state.pendencia.policy"
        operator: eq
        value:    "auto"
        next:     retomar_resultado
    default: oferecer_continuidade

  # `auto`: quem entrega é o pool que PARQUEOU a pendência (medido no limite:
  # `pendencia.pool` = `limite_retorno`). O especialista lê o que precisa da journey.
  - id: retomar_resultado
    type: delegate
    pool: "$.pipeline_state.pendencia.pool"
    context:
      workflow_resume_token: "$.pipeline_state.pendencia.resume_token"
      customer_present:      "true"
      resume_origin:         "identity"
    timeout_hours: 1
    on_resume:
      next: finalizar
    on_reject:
      next: finalizar
    on_timeout:
      next: finalizar

  # `offer`: o domínio decide o que oferecer. O especialista lê o que mostra da JOURNEY
  # (unida acima), onde o processo grava os próprios fatos — a porta não repassa campo
  # de domínio nenhum, e por isso não precisa conhecê-los. Ele devolve `acao: novo`
  # quando o cliente quer outro assunto.
  - id: oferecer_continuidade
    type: delegate
    pool: "$.config.on_pending_pool"
    context:
      workflow_resume_token: "$.pipeline_state.pendencia.resume_token"
      customer_present:      "true"
      resume_origin:         "identity"
    timeout_hours: 1
    on_resume:
      next: avaliar_continuidade
    on_reject:
      next: finalizar
    on_timeout:
      next: finalizar

  - id: avaliar_continuidade
    type: choice
    conditions:
      - field:    "$.pipeline_state.oferecer_continuidade.acao"
        operator: eq
        value:    "novo"
        next:     iniciar_solicitacao
    default: finalizar

  # ══ Processo novo ══════════════════════════════════════════════════════════
  # O formulário é coletado AQUI, na sessão do cliente, ANTES de o processo existir:
  # o `workflow_trigger` cria uma sessão `webhook` nova, e o processo não coleta.
  - id: iniciar_solicitacao
    type: invoke
    tool: form_get
    input:
      form_id:   "$.config.new_form_id"
      tenant_id: "$.tenant_id"
    output_as: dialog
    on_success: coletar_dados
    on_failure: avisar_indisponivel

  # Campo `masked` fica no escopo em memória do engine e NÃO aparece em `dados`.
  - id: coletar_dados
    type: menu
    interaction: form
    prompt: "{{$.pipeline_state.dialog.render.menu_prompt}}"
    fields: "$.pipeline_state.dialog.render.fields"
    output_as: dados
    timeout_s: 300
    on_success: confirmar_recebimento
    on_failure: avisar_timeout
    on_timeout: avisar_timeout
    on_disconnect: finalizar_timeout

  - id: confirmar_recebimento
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.confirmar_recebimento}}"
    on_success: disparar_processo
    on_failure: disparar_processo

  # Endereça o POOL. `anchors` é escrito por último: nenhum campo do formulário troca a
  # âncora sob a qual a pendência será indexada.
  - id: disparar_processo
    type: invoke
    tool: workflow_trigger
    input:
      pool_id:           "$.config.on_new_pool"
      tenant_id:         "$.tenant_id"
      origin_session_id: "$.session_id"
      context_fields:    "$.pipeline_state.dados"
      anchors:
        - kind:  "$.config.anchor_kind"
          value: "$.pipeline_state.contato"
    on_success: avisar_registro
    on_failure: avisar_indisponivel

  - id: avisar_registro
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_registro}}"
    on_success: finalizar
    on_failure: finalizar

  - id: avisar_indisponivel
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_indisponivel}}"
    on_success: finalizar_erro
    on_failure: finalizar_erro

  # ══ Desfechos ══════════════════════════════════════════════════════════════
  - id: finalizar
    type: complete
    outcome: resolved

  - id: finalizar_erro
    type: complete
    outcome: failed
    issue_status: "a porta não conseguiu registrar ou encaminhar a solicitação"

  - id: avisar_timeout
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_timeout}}"
    on_success: finalizar_timeout
    on_failure: finalizar_timeout

  - id: finalizar_timeout
    type: complete
    outcome: failed
    issue_status: "timeout ou desconexão — cliente não respondeu"

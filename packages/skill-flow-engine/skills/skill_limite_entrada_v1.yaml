# ─────────────────────────────────────────────────────────────────────────────
# Aumento de limite — agente de ENTRADA (níveis b + c fundidos)
#
# Design: docs/product/limite-credito-3-niveis-design.md
#
# Este agente faz três coisas que a arquitetura-alvo separa em (b) acesso a canal
# e (c) I/O no canal. A fusão é ASSUMIDA na Fase 1 e registrada: extrair o (b)
# genérico (`skill_acesso_canal_v1`) é a Fase 2, e é o que transforma o nível (b)
# em artefato reusável em vez de padrão implícito.
#
#   1. resolve identidade do interlocutor (customer_resolve)
#   2. localiza processo pendente e decide o que oferecer (pending_workflow_get)
#   3. faz o I/O — coleta o formulário, mostra status, entrega resultado
#
# Os TRÊS ACESSOS do cliente saem daqui, e o discriminador entre eles é a
# `policy` da pendência — não um flag nosso:
#   acesso 1 · sem pendência        → coleta o form e dispara o processo (N3)
#   acesso 2 · pendência `offer`    → menu: consultar status | cancelar | novo
#   acesso 3 · pendência `auto`     → retoma direto e entrega o resultado
#
# INVARIANTE DE COLETA (não inverter): o formulário é coletado AQUI, na sessão do
# cliente, ANTES de o processo existir. `workflow_trigger` é fire-and-forget e cria
# uma sessão `webhook` nova; um `delegate` feito pelo N3 rodaria como conference
# specialist NA SESSÃO DO N3 — o formulário não apareceria para ninguém.
# N3 recebe dados; N3 não coleta.
# ─────────────────────────────────────────────────────────────────────────────

id: skill_limite_entrada_v1
name: "Aumento de limite — entrada"
version: "1.0"
description: |
  Ponto de entrada do cenário de aumento de limite de crédito. Resolve identidade,
  localiza pendência, e ramifica pelos três acessos (solicitar / consultar status /
  receber resultado). Perfil `agent`: usa menu/notify; nunca suspende.
classification:
  type: orchestrator
  domain: credito

entry: carregar_roteiro

steps:
  # ══ Roteiro — CONTEÚDO, fora do fluxo (NIV-04) ═════════════════════════════
  # As frases que o cliente lê vivem em `dialog_limite_roteiro`, editável em
  # /config/dialog-forms sem deploy. UMA carga aqui; cada notify/menu referencia
  # o seu nó por `render.by_node.<id do step>`.
  #
  # ⚠️ Por que o consumo é por NÓ e não pelo `render` normal: o `render` é
  # single-turn (statements viram satélites de UMA pergunta), e este roteiro não é
  # um diálogo linear — os avisos vivem em ramos diferentes do processo.
  #
  # ⚠️ Três frases FICAM no YAML de propósito: `menu_continuidade`,
  # `confirmar_recebimento` e o prompt de `coletar_dados` interpolam
  # `$.pipeline_state.*`, e o `interpolate` do engine é de PASSE ÚNICO — texto
  # vindo da forma com `{{…}}` chegaria ao cliente com as chaves literais.
  - id: carregar_roteiro
    type: invoke
    tool: form_get
    input:
      form_id:   "dialog_limite_roteiro"
      tenant_id: "$.tenant_id"
    output_as: roteiro
    on_success: saudacao
    on_failure: falha_roteiro

  # ⚠️ A ÚNICA frase que continua cravada, e ela tem de continuar: é o caminho de
  # degradação de quem carrega o roteiro. Buscá-la na mesma forma que acabou de
  # falhar deixaria o fluxo MUDO — e mensagem vazia é um valor plausível, que
  # ninguém nota.
  - id: falha_roteiro
    type: notify
    message: "Estamos com uma instabilidade e não consigo te atender agora. Tente de novo em alguns minutos."
    on_success: finalizar_erro
    on_failure: finalizar_erro

  # ══ Abertura e identificação ═══════════════════════════════════════════════
  - id: saudacao
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.saudacao}}"
    on_success: coletar_contato
    on_failure: coletar_contato

  # O CPF é a âncora estável do cenário: identifica, indexa a pendência e é a
  # mesma âncora reaproveitada pelo step-up de posse (OTP) mais abaixo — sem
  # canal de SMS separado. `contato` guarda o CPF (nome da variável ficou
  # genérico de propósito: é "o valor que identifica", não mais "o telefone").
  - id: coletar_contato
    type: menu
    prompt: "{{$.pipeline_state.roteiro.render.by_node.coletar_contato}}"
    interaction: text
    output_as: contato
    timeout_s: 180
    on_success: resolver_identidade
    on_failure: avisar_timeout
    on_timeout: avisar_timeout
    on_disconnect: finalizar_timeout

  - id: resolver_identidade
    type: invoke
    tool: customer_resolve
    input:
      tenant_id: "$.tenant_id"
      provision: true
      anchors:
        - kind: cpf
          value: "$.pipeline_state.contato"
    output_as: identidade
    on_success: escrever_caller_id
    on_failure: verificar_pendencia   # resolve falhou → segue sem carimbar; não bloqueia

  # Tag que o bridge lê no fechamento (_resolve_close_customer_id) para carimbar
  # sessions.customer_id — é o que liga este contato ao histórico do cliente.
  - id: escrever_caller_id
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag:   "caller.customer_id"
      value: "$.pipeline_state.identidade.customer_id"
      confidence: 1.0
      visibility: "agents_only"
    on_success: verificar_pendencia
    on_failure: verificar_pendencia

  # ══ Localizar processo pendente (o coração do nível b) ═════════════════════
  - id: verificar_pendencia
    type: invoke
    tool: pending_workflow_get
    input:
      tenant_id: "$.tenant_id"
      anchors:
        - kind: cpf
          value: "$.pipeline_state.contato"
    output_as: pendencia
    on_success: avaliar_resolucao
    on_failure: iniciar_solicitacao   # tool fora do ar → trata como cliente novo

  # ══ Gate de posse — OTP ════════════════════════════════════════════════════
  # A consulta INTEIRA é gateada, não só a retomada: com âncora apenas `claimed`,
  # o tool devolve verification_required SEM revelar se existe pendência
  # (anti-enumeração). Para aumento de limite o step-up é a regra de negócio certa.
  - id: avaliar_resolucao
    type: choice
    conditions:
      - field:    "$.pipeline_state.pendencia.verification_required"
        operator: eq
        value:    true
        next:     oferecer_verificacao
    default: avaliar_pendencia

  - id: oferecer_verificacao
    type: menu
    prompt: "{{$.pipeline_state.roteiro.render.by_node.oferecer_verificacao}}"
    interaction: button
    options:
      - id: sim
        label: "✅ Enviar código"
      - id: atendente
        label: "🗣️ Falar com atendente"
      - id: encerrar
        label: "❌ Encerrar"
    output_as: quer_verificar
    timeout_s: 180
    on_success: avaliar_oferta
    on_failure: avisar_encerramento_verificacao
    on_timeout: avisar_encerramento_verificacao
    on_disconnect: finalizar_timeout

  # Recusar a verificação NÃO pode cair silenciosamente em iniciar_solicitacao: já
  # existe uma pendência para este CPF (é por isso que a oferta apareceu), e coletar
  # outro formulário sem avisar cria uma segunda solicitação duplicada que o cliente
  # nem sabe que existe. As três saídas daqui são deliberadas — nenhuma delas coleta
  # um formulário novo. Timeout/falha do menu acima seguem a mesma regra (mesmo risco
  # de duplicidade se o cliente simplesmente não responder).
  - id: avaliar_oferta
    type: choice
    conditions:
      - field:    "$.pipeline_state.quer_verificar"
        operator: eq
        value:    "sim"
        next:     desafiar_posse
      - field:    "$.pipeline_state.quer_verificar"
        operator: eq
        value:    "atendente"
        next:     avisar_transferencia_sac
    default: avisar_encerramento_verificacao   # "encerrar" ou qualquer outro valor

  - id: avisar_transferencia_sac
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_transferencia_sac}}"
    on_success: escalar_sac
    on_failure: escalar_sac

  # Mesmo padrão de agente_triagem_v2/skill_atendimento_auth_v1: escala para o pool
  # genérico de atendimento humano.
  - id: escalar_sac
    type: escalate
    target:
      pool: sac_ia
    context: pipeline_state
    error_reason: escalated_limite_verification_declined
    on_failure: avisar_encerramento_verificacao

  - id: avisar_encerramento_verificacao
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_encerramento_verificacao}}"
    on_success: finalizar
    on_failure: finalizar

  - id: desafiar_posse
    type: invoke
    tool: otp_challenge
    input:
      tenant_id: "$.tenant_id"
      kind:      cpf
      value:     "$.pipeline_state.contato"
    output_as: otp_chal
    on_success: coletar_codigo_dialog
    on_failure: iniciar_solicitacao

  # O código GERADO nunca passa pela mão do runner (costura de segredo): challenge
  # e verify ficam aqui, no OtpService. O runner só carrega o que o CLIENTE digitou.
  - id: coletar_codigo_dialog
    type: delegate
    pool: dialog_runner
    context:
      dialog_form_id: "dialog_otp_possession"
    timeout_hours: 1
    on_resume:
      next: verificar_codigo_otp
    on_timeout:
      next: iniciar_solicitacao

  - id: verificar_codigo_otp
    type: invoke
    tool: otp_verify
    input:
      tenant_id:   "$.tenant_id"
      customer_id: "@ctx.caller.customer_id"
      kind:        cpf
      value:       "$.pipeline_state.contato"
      code:        "$.pipeline_state.coletar_codigo_dialog.value"
    output_as: otp_res
    on_success: avaliar_verificacao
    on_failure: iniciar_solicitacao

  - id: avaliar_verificacao
    type: choice
    conditions:
      - field:    "$.pipeline_state.otp_res.verified"
        operator: eq
        value:    true
        next:     verificar_pendencia_pos_otp
    default: avisar_verificacao_falhou

  - id: avisar_verificacao_falhou
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_verificacao_falhou}}"
    on_success: iniciar_solicitacao
    on_failure: iniciar_solicitacao

  - id: verificar_pendencia_pos_otp
    type: invoke
    tool: pending_workflow_get
    input:
      tenant_id: "$.tenant_id"
      anchors:
        - kind: cpf
          value: "$.pipeline_state.contato"
    output_as: pendencia
    on_success: avaliar_pendencia
    on_failure: iniciar_solicitacao

  # ══ Ramificação dos três acessos ═══════════════════════════════════════════
  - id: avaliar_pendencia
    type: choice
    conditions:
      - field:    "$.pipeline_state.pendencia.found"
        operator: eq
        value:    true
        next:     unificar_journey     # pertença ANTES da política (2b)
    default: iniciar_solicitacao       # acesso 1

  # ══ Pertença ao processo — de TODO acesso que encontrou pendência ══════════
  #
  # ⚠️ Este step ficava pendurado no ramo `auto` de `avaliar_politica_retomada`, e a
  # consequência era invisível: o acesso 3 (resultado) entrava na journey e o acesso 2
  # (consulta de status) NÃO — nascia raiz de si mesmo e ficava fora do processo,
  # quantas consultas fossem. Medido em 2026-08-25 com contato real: zero arestas em
  # `journey_aliases` para a sessão da consulta, e `/reports/journeys` contando 1.
  #
  # A correção é de ESCOPO, não de lógica: pertença é fato de *"este acesso encontrou
  # um processo pendente"*, e a `policy` é fato do que fazer em seguida. Amarrar o
  # primeiro ao segundo fez um subconjunto arbitrário dos acessos virar membro. Com o
  # merge aqui, o ponto é ÚNICO — duplicá-lo nos dois ramos daria duas verdades a
  # divergir no próximo ramo que alguém acrescentar.
  #
  # A ordem que o comentário antigo defendia continua valendo, e agora vale para os
  # dois: PRIMEIRO unir, DEPOIS ler. Este contato nasceu espontâneo, então a raiz dele
  # é ele mesmo e `@ctx.journey.*` resolveria para um hash vazio; o merge liga a
  # componente deste contato à do processo pendente, e só a partir daí
  # `resolveJourneyRoot` devolve a raiz canônica e as tags aparecem.
  #
  # `root_session_id` vem achatado no topo do `pending_workflow_get` (J3). O merge é
  # sempre novo→antigo, logo acíclico por construção, e idempotente: reencontrar o
  # mesmo processo numa quarta consulta é no-op — é por isso que N acessos custam zero.
  #
  # on_failure segue em frente: sem o merge o acesso 3 narra vazio e o acesso 2 perde o
  # carimbo analítico — ruim, mas travar o cliente na porta por causa de um carimbo
  # seria pior. A falha fica no log do tool, não em silêncio.
  #
  # `tenant_id`, não `session_token`: este skill roda no caminho comum (channel-gateway →
  # routing-engine → orchestrator-bridge → skill-flow-service), que NUNCA injeta um JWT
  # no contexto — só workflows que o fazem explicitamente (ex. skill_revisao_treplica_v1)
  # têm `$.session.session_token`. Usar esse campo aqui sempre resolvia vazio, o
  # journey_merge SEMPRE rejeitava (Zod: session_token min(1)), e o on_failure engolia o
  # erro em silêncio — o acesso 3 nunca uniu journey nenhuma, nunca, em nenhum teste.
  - id: unificar_journey
    type: invoke
    tool: journey_merge
    input:
      tenant_id:      "$.tenant_id"
      actor:          "skill_limite_entrada_v1"
      source_root:    "$.session_id"
      canonical_root: "$.pipeline_state.pendencia.root_session_id"
    output_as: merge
    on_success: avaliar_politica_retomada
    on_failure: avaliar_politica_retomada

  # A política vem do step delegate do N3 e viaja no PendingEntry — não é decisão
  # deste agente. `auto` = o resultado já saiu (acesso 3); `offer` = ainda em
  # análise, o cliente escolhe (acesso 2). Decide só o QUE FAZER — a pertença já
  # aconteceu acima, para os dois.
  - id: avaliar_politica_retomada
    type: choice
    conditions:
      - field:    "$.pipeline_state.pendencia.policy"
        operator: eq
        value:    "auto"
        next:     retomar_resultado    # acesso 3 (entrega)
    default: menu_continuidade         # acesso 2 (consulta / cancelar / novo)

  # ══ Acesso 2 — em análise ══════════════════════════════════════════════════
  # `pendencia.context` é o context_preview mascarado na ESCRITA (o PendingEntry
  # já nasce mascarado). O cartão vem ***1234; o status e o valor vêm em claro
  # porque a spec de preview do N3 os declara `plain`.
  - id: menu_continuidade
    type: menu
    # ⚠️ SEM markdown nas mensagens ao cliente. Duas razões independentes:
    # (1) o webchat usa `textContent` — `**negrito**` sai com os asteriscos
    #     literais na tela;
    # (2) máscara e ênfase disputam o mesmo caractere — `numero_cartao` já vem
    #     ***4444 do context_preview, e envolvê-lo produziria `*****4444**`.
    # A estrutura vem de `\n` + `•`, que o `.msg` do webchat honra desde que
    # tenha `white-space: pre-wrap` (corrigido 2026-08-12).
    prompt: "📋 Você já tem um pedido de aumento de limite em andamento.\n\n• Cartão: {{$.pipeline_state.pendencia.context.numero_cartao}}\n• Limite solicitado: R$ {{$.pipeline_state.pendencia.context.limite_solicitado}}\n• Situação: {{$.pipeline_state.pendencia.context.status}}\n\nO que deseja fazer?"
    interaction: button
    options:
      - id: consultar
        label: "📋 Só consultar, obrigado"
      - id: cancelar_pendente
        label: "❌ Cancelar solicitação"
      - id: novo
        label: "🔄 Outro assunto"
    output_as: decisao_continuidade
    timeout_s: 300
    on_success: processar_decisao
    on_failure: finalizar
    on_timeout: finalizar
    on_disconnect: finalizar_timeout

  - id: processar_decisao
    type: choice
    conditions:
      - field:    "$.pipeline_state.decisao_continuidade"
        operator: eq
        value:    "consultar"
        next:     confirmar_consulta
      - field:    "$.pipeline_state.decisao_continuidade"
        operator: eq
        value:    "cancelar_pendente"
        next:     cancelar_solicitacao
    default: iniciar_solicitacao

  # Consultar NÃO retoma o processo. O resume_token está à mão e é deliberadamente
  # não usado — é o que torna o acesso 2 uma leitura, não uma ação.
  - id: confirmar_consulta
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.confirmar_consulta}}"
    on_success: finalizar
    on_failure: finalizar

  # Cancelar retoma com `rejected` — regra de negócio real: o cliente pode desistir
  # enquanto está em análise. É o SEGUNDO retomador do mesmo workflow (o primeiro é
  # o aprovador); o lock terminal-uma-vez da Camada F é o que torna isso seguro.
  - id: cancelar_solicitacao
    type: invoke
    tool: workflow_resume
    input:
      resume_token:  "$.pipeline_state.pendencia.resume_token"
      decision:      "rejected"
      resume_origin: "identity"
      payload:
        source:   "customer_reconnect"
        resposta: "cancelar"
    on_success: avisar_cancelamento
    on_failure: avisar_erro_retomada

  - id: avisar_cancelamento
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_cancelamento}}"
    on_success: finalizar
    on_failure: finalizar

  - id: avisar_erro_retomada
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_erro_retomada}}"
    on_success: finalizar
    on_failure: finalizar

  # ══ Acesso 3 — entregar o resultado ════════════════════════════════════════
  # A união da journey NÃO acontece mais aqui: subiu para `unificar_journey`, logo
  # depois de `avaliar_pendencia` (2b, 2026-08-25). Pertença é fato de "este acesso
  # encontrou o processo", e vale igual para quem vem consultar e para quem vem
  # receber — pendurada neste ramo, ela só alcançava o segundo. O raciocínio inteiro
  # (ordem merge-antes-de-ler, idempotência, `tenant_id` × `session_token`) mora agora
  # no comentário daquele step, num lugar só.

  # Specialist de conferência DENTRO desta sessão: o cliente não troca de canal.
  # customer_present=true é o discriminador que autoriza o specialist a fazer I/O.
  - id: retomar_resultado
    type: delegate
    pool: limite_retorno
    context:
      workflow_resume_token: "$.pipeline_state.pendencia.resume_token"
      customer_present:      "true"
      resume_origin:         "identity"
      # Contexto do PROCESSO, lido da raiz canônica depois do merge acima. Antes
      # vinham do context_preview da pendência — um payload que o `delegate` carregava
      # porque não havia onde guardar fato de processo. O `collect` não tem `context`,
      # e não precisa: o dado não viaja mais, ele MORA na journey.
      numero_cartao:         "@ctx.journey.numero_cartao"
      resultado:             "@ctx.journey.resultado"
      limite_aprovado:       "@ctx.journey.limite_aprovado"
      parecer:               "@ctx.journey.parecer"
    timeout_hours: 1
    on_resume:
      next: finalizar
    on_reject:
      next: finalizar
    on_timeout:
      next: finalizar

  # ══ Acesso 1 — coletar e disparar o processo ═══════════════════════════════
  # form_get + menu interaction:form = formulário multi-campo em UM turno, com
  # `masked` por campo vindo do DialogForm. O conteúdo é config do tenant
  # (/config/dialog-forms); acrescentar um campo não toca este skill.
  - id: iniciar_solicitacao
    type: invoke
    tool: form_get
    input:
      form_id:   "dialog_limite_solicitacao"
      tenant_id: "$.tenant_id"
    output_as: dialog
    on_success: coletar_dados
    on_failure: avisar_indisponivel

  # `interaction: form` é LITERAL de propósito: render.interaction carrega apenas a
  # interação da PRIMEIRA question do form, não "form".
  # cvv é masked:true → fica no escopo em memória do engine e NÃO aparece em
  # $.pipeline_state.dados. Não há como um aprovador vê-lo — e é esse o ponto.
  - id: coletar_dados
    type: menu
    interaction: form
    prompt: "{{$.pipeline_state.dialog.render.menu_prompt}}"
    fields: "$.pipeline_state.dialog.render.fields"
    output_as: dados
    timeout_s: 300
    on_success: confirmar_recebimento
    on_failure: avisar_timeout
    on_timeout: avisar_timeout
    on_disconnect: finalizar_timeout

  - id: confirmar_recebimento
    type: notify
    message: "📋 Recebido! Vou registrar seu pedido de aumento para R$ {{$.pipeline_state.dados.limite_solicitado}}. Um instante..."
    on_success: disparar_processo
    on_failure: disparar_processo

  # N2 → N3. Endereça o POOL (nunca o skill — invariante). origin_session_id é o
  # que propaga a raiz da journey: o processo herda a raiz deste contato.
  # `session.cpf` NÃO é opcional: é dela que _anchors_from_context (channel-gateway)
  # deriva a âncora sob a qual a pendência é indexada — a MESMA âncora (kind: cpf)
  # que resolver_identidade/verificar_pendencia usaram acima. Sem ela a pendência
  # existe e o cliente nunca a encontra (ou pior: é indexada sob outro customer_id).
  - id: disparar_processo
    type: invoke
    tool: workflow_trigger
    input:
      pool_id:           "limite_processo"
      tenant_id:         "$.tenant_id"
      origin_session_id: "$.session_id"
      # `session.vencimento_cartao`, não `session.cpf` — o campo do formulário
      # chama-se `vencimento_cartao` e a tag preserva o nome (dado de tela, não
      # âncora). A âncora de identidade é a chave `session.cpf` acima, que carrega
      # o CPF coletado em coletar_contato — dois fatos homônimos por coincidência
      # de domínio (ambos "CPF"), mas com papéis diferentes no contexto.
      context_json: '{"session.cpf": "{{$.pipeline_state.contato}}", "session.customer_id": "{{$.pipeline_state.identidade.customer_id}}", "session.numero_cartao": "{{$.pipeline_state.dados.numero_cartao}}", "session.vencimento_cartao": "{{$.pipeline_state.dados.vencimento_cartao}}", "session.limite_solicitado": "{{$.pipeline_state.dados.limite_solicitado}}"}'
    on_success: avisar_registro
    on_failure: avisar_indisponivel

  - id: avisar_registro
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_registro}}"
    on_success: finalizar
    on_failure: finalizar

  - id: avisar_indisponivel
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_indisponivel}}"
    on_success: finalizar_erro
    on_failure: finalizar_erro

  # ══ Desfechos ══════════════════════════════════════════════════════════════
  - id: finalizar
    type: complete
    outcome: resolved

  - id: finalizar_erro
    type: complete
    outcome: failed
    issue_status: "falha ao registrar solicitação de aumento de limite"

  - id: avisar_timeout
    type: notify
    message: "{{$.pipeline_state.roteiro.render.by_node.avisar_timeout}}"
    on_success: finalizar_timeout
    on_failure: finalizar_timeout

  - id: finalizar_timeout
    type: complete
    outcome: failed
    issue_status: "timeout ou desconexão — cliente não respondeu"

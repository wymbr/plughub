# ─────────────────────────────────────────────────────────────────────────────
# Aumento de limite — agente de ENTRADA (níveis b + c fundidos)
#
# Design: docs/product/limite-credito-3-niveis-design.md
#
# Este agente faz três coisas que a arquitetura-alvo separa em (b) acesso a canal
# e (c) I/O no canal. A fusão é ASSUMIDA na Fase 1 e registrada: extrair o (b)
# genérico (`skill_acesso_canal_v1`) é a Fase 2, e é o que transforma o nível (b)
# em artefato reusável em vez de padrão implícito.
#
#   1. resolve identidade do interlocutor (customer_resolve)
#   2. localiza processo pendente e decide o que oferecer (pending_workflow_get)
#   3. faz o I/O — coleta o formulário, mostra status, entrega resultado
#
# Os TRÊS ACESSOS do cliente saem daqui, e o discriminador entre eles é a
# `policy` da pendência — não um flag nosso:
#   acesso 1 · sem pendência        → coleta o form e dispara o processo (N3)
#   acesso 2 · pendência `offer`    → menu: consultar status | cancelar | novo
#   acesso 3 · pendência `auto`     → retoma direto e entrega o resultado
#
# INVARIANTE DE COLETA (não inverter): o formulário é coletado AQUI, na sessão do
# cliente, ANTES de o processo existir. `workflow_trigger` é fire-and-forget e cria
# uma sessão `webhook` nova; um `delegate` feito pelo N3 rodaria como conference
# specialist NA SESSÃO DO N3 — o formulário não apareceria para ninguém.
# N3 recebe dados; N3 não coleta.
# ─────────────────────────────────────────────────────────────────────────────

id: skill_limite_entrada_v1
name: "Aumento de limite — entrada"
version: "1.0"
description: |
  Ponto de entrada do cenário de aumento de limite de crédito. Resolve identidade,
  localiza pendência, e ramifica pelos três acessos (solicitar / consultar status /
  receber resultado). Perfil `agent`: usa menu/notify; nunca suspende.
classification:
  type: orchestrator
  domain: credito

entry: saudacao

steps:
  # ══ Abertura e identificação ═══════════════════════════════════════════════
  - id: saudacao
    type: notify
    message: "Olá! Posso te ajudar com o aumento de limite do seu cartão. Vou precisar te identificar primeiro."
    on_success: coletar_contato
    on_failure: coletar_contato

  # O telefone é a âncora estável do cenário: identifica, indexa a pendência e é
  # o canal de posse verificável por OTP.
  - id: coletar_contato
    type: menu
    prompt: "Qual é o seu celular com DDD? (ex: 11987654321)"
    interaction: text
    output_as: contato
    timeout_s: 180
    on_success: resolver_identidade
    on_failure: avisar_timeout
    on_timeout: avisar_timeout
    on_disconnect: finalizar_timeout

  - id: resolver_identidade
    type: invoke
    tool: customer_resolve
    input:
      tenant_id: "$.tenant_id"
      provision: true
      anchors:
        - kind: phone
          value: "$.pipeline_state.contato"
    output_as: identidade
    on_success: escrever_caller_id
    on_failure: verificar_pendencia   # resolve falhou → segue sem carimbar; não bloqueia

  # Tag que o bridge lê no fechamento (_resolve_close_customer_id) para carimbar
  # sessions.customer_id — é o que liga este contato ao histórico do cliente.
  - id: escrever_caller_id
    type: invoke
    tool: context_set
    input:
      session_id: "$.session_id"
      tenant_id:  "$.tenant_id"
      tag:   "caller.customer_id"
      value: "$.pipeline_state.identidade.customer_id"
      confidence: 1.0
      visibility: "agents_only"
    on_success: verificar_pendencia
    on_failure: verificar_pendencia

  # ══ Localizar processo pendente (o coração do nível b) ═════════════════════
  - id: verificar_pendencia
    type: invoke
    tool: pending_workflow_get
    input:
      tenant_id: "$.tenant_id"
      anchors:
        - kind: phone
          value: "$.pipeline_state.contato"
    output_as: pendencia
    on_success: avaliar_resolucao
    on_failure: iniciar_solicitacao   # tool fora do ar → trata como cliente novo

  # ══ Gate de posse — OTP ════════════════════════════════════════════════════
  # A consulta INTEIRA é gateada, não só a retomada: com âncora apenas `claimed`,
  # o tool devolve verification_required SEM revelar se existe pendência
  # (anti-enumeração). Para aumento de limite o step-up é a regra de negócio certa.
  - id: avaliar_resolucao
    type: choice
    conditions:
      - field:    "$.pipeline_state.pendencia.verification_required"
        operator: eq
        value:    true
        next:     oferecer_verificacao
    default: avaliar_pendencia

  - id: oferecer_verificacao
    type: menu
    prompt: "Alterações de limite exigem confirmar a posse do seu número. Posso enviar um código por SMS?"
    interaction: button
    options:
      - id: sim
        label: "✅ Enviar código"
      - id: nao
        label: "Agora não"
    output_as: quer_verificar
    timeout_s: 180
    on_success: avaliar_oferta
    on_failure: iniciar_solicitacao
    on_timeout: iniciar_solicitacao
    on_disconnect: finalizar_timeout

  - id: avaliar_oferta
    type: choice
    conditions:
      - field:    "$.pipeline_state.quer_verificar"
        operator: eq
        value:    "sim"
        next:     desafiar_posse
    default: iniciar_solicitacao

  - id: desafiar_posse
    type: invoke
    tool: otp_challenge
    input:
      tenant_id: "$.tenant_id"
      kind:      phone
      value:     "$.pipeline_state.contato"
    output_as: otp_chal
    on_success: coletar_codigo_dialog
    on_failure: iniciar_solicitacao

  # O código GERADO nunca passa pela mão do runner (costura de segredo): challenge
  # e verify ficam aqui, no OtpService. O runner só carrega o que o CLIENTE digitou.
  - id: coletar_codigo_dialog
    type: delegate
    pool: dialog_runner
    context:
      dialog_form_id: "dialog_otp_possession"
    timeout_hours: 1
    on_resume:
      next: verificar_codigo_otp
    on_timeout:
      next: iniciar_solicitacao

  - id: verificar_codigo_otp
    type: invoke
    tool: otp_verify
    input:
      tenant_id:   "$.tenant_id"
      customer_id: "@ctx.caller.customer_id"
      kind:        phone
      value:       "$.pipeline_state.contato"
      code:        "$.pipeline_state.coletar_codigo_dialog.value"
    output_as: otp_res
    on_success: avaliar_verificacao
    on_failure: iniciar_solicitacao

  - id: avaliar_verificacao
    type: choice
    conditions:
      - field:    "$.pipeline_state.otp_res.verified"
        operator: eq
        value:    true
        next:     verificar_pendencia_pos_otp
    default: avisar_verificacao_falhou

  - id: avisar_verificacao_falhou
    type: notify
    message: "Não consegui confirmar o código. Vamos seguir com uma solicitação nova."
    on_success: iniciar_solicitacao
    on_failure: iniciar_solicitacao

  - id: verificar_pendencia_pos_otp
    type: invoke
    tool: pending_workflow_get
    input:
      tenant_id: "$.tenant_id"
      anchors:
        - kind: phone
          value: "$.pipeline_state.contato"
    output_as: pendencia
    on_success: avaliar_pendencia
    on_failure: iniciar_solicitacao

  # ══ Ramificação dos três acessos ═══════════════════════════════════════════
  - id: avaliar_pendencia
    type: choice
    conditions:
      - field:    "$.pipeline_state.pendencia.found"
        operator: eq
        value:    true
        next:     avaliar_politica_retomada
    default: iniciar_solicitacao       # acesso 1

  # A política vem do step delegate do N3 e viaja no PendingEntry — não é decisão
  # deste agente. `auto` = o resultado já saiu (acesso 3); `offer` = ainda em
  # análise, o cliente escolhe (acesso 2).
  - id: avaliar_politica_retomada
    type: choice
    conditions:
      - field:    "$.pipeline_state.pendencia.policy"
        operator: eq
        value:    "auto"
        next:     unificar_journey     # acesso 3 (merge → entrega)
    default: menu_continuidade         # acesso 2

  # ══ Acesso 2 — em análise ══════════════════════════════════════════════════
  # `pendencia.context` é o context_preview mascarado na ESCRITA (o PendingEntry
  # já nasce mascarado). O cartão vem ***1234; o status e o valor vêm em claro
  # porque a spec de preview do N3 os declara `plain`.
  - id: menu_continuidade
    type: menu
    # ⚠️ SEM markdown nas mensagens ao cliente. Duas razões independentes:
    # (1) o webchat usa `textContent` — `**negrito**` sai com os asteriscos
    #     literais na tela;
    # (2) máscara e ênfase disputam o mesmo caractere — `numero_cartao` já vem
    #     ***4444 do context_preview, e envolvê-lo produziria `*****4444**`.
    # A estrutura vem de `\n` + `•`, que o `.msg` do webchat honra desde que
    # tenha `white-space: pre-wrap` (corrigido 2026-08-12).
    prompt: "📋 Você já tem um pedido de aumento de limite em andamento.\n\n• Cartão: {{$.pipeline_state.pendencia.context.numero_cartao}}\n• Limite solicitado: R$ {{$.pipeline_state.pendencia.context.limite_solicitado}}\n• Situação: {{$.pipeline_state.pendencia.context.status}}\n\nO que deseja fazer?"
    interaction: button
    options:
      - id: consultar
        label: "📋 Só consultar, obrigado"
      - id: cancelar_pendente
        label: "❌ Cancelar solicitação"
      - id: novo
        label: "🔄 Outro assunto"
    output_as: decisao_continuidade
    timeout_s: 300
    on_success: processar_decisao
    on_failure: finalizar
    on_timeout: finalizar
    on_disconnect: finalizar_timeout

  - id: processar_decisao
    type: choice
    conditions:
      - field:    "$.pipeline_state.decisao_continuidade"
        operator: eq
        value:    "consultar"
        next:     confirmar_consulta
      - field:    "$.pipeline_state.decisao_continuidade"
        operator: eq
        value:    "cancelar_pendente"
        next:     cancelar_solicitacao
    default: iniciar_solicitacao

  # Consultar NÃO retoma o processo. O resume_token está à mão e é deliberadamente
  # não usado — é o que torna o acesso 2 uma leitura, não uma ação.
  - id: confirmar_consulta
    type: notify
    message: "Perfeito. Sua solicitação segue em análise e você será avisado por aqui assim que houver resposta. 👍"
    on_success: finalizar
    on_failure: finalizar

  # Cancelar retoma com `rejected` — regra de negócio real: o cliente pode desistir
  # enquanto está em análise. É o SEGUNDO retomador do mesmo workflow (o primeiro é
  # o aprovador); o lock terminal-uma-vez da Camada F é o que torna isso seguro.
  - id: cancelar_solicitacao
    type: invoke
    tool: workflow_resume
    input:
      resume_token:  "$.pipeline_state.pendencia.resume_token"
      decision:      "rejected"
      resume_origin: "identity"
      payload:
        source:   "customer_reconnect"
        resposta: "cancelar"
    on_success: avisar_cancelamento
    on_failure: avisar_erro_retomada

  - id: avisar_cancelamento
    type: notify
    message: "❌ Solicitação cancelada. Se mudar de ideia, é só pedir de novo por aqui."
    on_success: finalizar
    on_failure: finalizar

  - id: avisar_erro_retomada
    type: notify
    message: "Não consegui processar sua solicitação agora. Pode tentar novamente em alguns minutos?"
    on_success: finalizar
    on_failure: finalizar

  # ══ Acesso 3 — entregar o resultado ════════════════════════════════════════
  # PRIMEIRO unir as journeys, DEPOIS ler. A ordem não é estilo: este contato nasceu
  # espontâneo, então a raiz dele é ele mesmo, e `@ctx.journey.*` resolveria para um
  # hash vazio. O merge liga a componente deste contato à do processo pendente; só a
  # partir daí `resolveJourneyRoot` devolve a raiz canônica e as tags aparecem.
  #
  # `root_session_id` vem achatado no topo do pending_workflow_get (J3). O merge é
  # sempre novo→antigo, logo acíclico por construção, e idempotente: reencontrar o
  # mesmo processo num quarto acesso é no-op.
  #
  # on_failure segue para a entrega assim mesmo: sem o merge o agente narra vazio,
  # que é ruim — mas travar o cliente na porta por causa de um carimbo analítico
  # seria pior. A falha fica no log do tool, não em silêncio.
  - id: unificar_journey
    type: invoke
    tool: journey_merge
    input:
      session_token:  "$.session.session_token"
      source_root:    "$.session_id"
      canonical_root: "$.pipeline_state.pendencia.root_session_id"
    output_as: merge
    on_success: retomar_resultado
    on_failure: retomar_resultado

  # Specialist de conferência DENTRO desta sessão: o cliente não troca de canal.
  # customer_present=true é o discriminador que autoriza o specialist a fazer I/O.
  - id: retomar_resultado
    type: delegate
    pool: limite_retorno
    context:
      workflow_resume_token: "$.pipeline_state.pendencia.resume_token"
      customer_present:      "true"
      resume_origin:         "identity"
      # Contexto do PROCESSO, lido da raiz canônica depois do merge acima. Antes
      # vinham do context_preview da pendência — um payload que o `delegate` carregava
      # porque não havia onde guardar fato de processo. O `collect` não tem `context`,
      # e não precisa: o dado não viaja mais, ele MORA na journey.
      numero_cartao:         "@ctx.journey.numero_cartao"
      resultado:             "@ctx.journey.resultado"
      limite_aprovado:       "@ctx.journey.limite_aprovado"
      parecer:               "@ctx.journey.parecer"
    timeout_hours: 1
    on_resume:
      next: finalizar
    on_reject:
      next: finalizar
    on_timeout:
      next: finalizar

  # ══ Acesso 1 — coletar e disparar o processo ═══════════════════════════════
  # form_get + menu interaction:form = formulário multi-campo em UM turno, com
  # `masked` por campo vindo do DialogForm. O conteúdo é config do tenant
  # (/config/dialog-forms); acrescentar um campo não toca este skill.
  - id: iniciar_solicitacao
    type: invoke
    tool: form_get
    input:
      form_id:   "dialog_limite_solicitacao"
      tenant_id: "$.tenant_id"
    output_as: dialog
    on_success: coletar_dados
    on_failure: avisar_indisponivel

  # `interaction: form` é LITERAL de propósito: render.interaction carrega apenas a
  # interação da PRIMEIRA question do form, não "form".
  # cvv é masked:true → fica no escopo em memória do engine e NÃO aparece em
  # $.pipeline_state.dados. Não há como um aprovador vê-lo — e é esse o ponto.
  - id: coletar_dados
    type: menu
    interaction: form
    prompt: "{{$.pipeline_state.dialog.render.menu_prompt}}"
    fields: "$.pipeline_state.dialog.render.fields"
    output_as: dados
    timeout_s: 300
    on_success: confirmar_recebimento
    on_failure: avisar_timeout
    on_timeout: avisar_timeout
    on_disconnect: finalizar_timeout

  - id: confirmar_recebimento
    type: notify
    message: "📋 Recebido! Vou registrar seu pedido de aumento para R$ {{$.pipeline_state.dados.limite_solicitado}}. Um instante..."
    on_success: disparar_processo
    on_failure: disparar_processo

  # N2 → N3. Endereça o POOL (nunca o skill — invariante). origin_session_id é o
  # que propaga a raiz da journey: o processo herda a raiz deste contato.
  # contact_identifier NÃO é opcional: é dele que _anchors_from_context deriva as
  # âncoras sob as quais a pendência é indexada. Sem ele a pendência existe e o
  # cliente nunca a encontra.
  - id: disparar_processo
    type: invoke
    tool: workflow_trigger
    input:
      pool_id:           "limite_processo"
      tenant_id:         "$.tenant_id"
      origin_session_id: "$.session_id"
      # `session.cpf_titular`, não `session.cpf` — ver a nota de namespace no
      # delegate de skill_limite_processo_v1. O campo do formulário chama-se `cpf`;
      # a tag NÃO pode, porque o nome vaza para a resolução de identidade.
      context_json: '{"session.contact_identifier": "{{$.pipeline_state.contato}}", "session.customer_id": "{{$.pipeline_state.identidade.customer_id}}", "session.numero_cartao": "{{$.pipeline_state.dados.numero_cartao}}", "session.cpf_titular": "{{$.pipeline_state.dados.cpf}}", "session.limite_solicitado": "{{$.pipeline_state.dados.limite_solicitado}}"}'
    on_success: avisar_registro
    on_failure: avisar_indisponivel

  - id: avisar_registro
    type: notify
    message: "✅ Pedido registrado! A análise leva até 1 dia útil.\n\nQuando quiser, volte aqui para consultar a situação — eu te reconheço pelo número e já trago o andamento."
    on_success: finalizar
    on_failure: finalizar

  - id: avisar_indisponivel
    type: notify
    message: "Não consegui registrar seu pedido agora. Pode tentar novamente em alguns minutos?"
    on_success: finalizar_erro
    on_failure: finalizar_erro

  # ══ Desfechos ══════════════════════════════════════════════════════════════
  - id: finalizar
    type: complete
    outcome: resolved

  - id: finalizar_erro
    type: complete
    outcome: failed
    issue_status: "falha ao registrar solicitação de aumento de limite"

  - id: avisar_timeout
    type: notify
    message: "Sua sessão expirou por inatividade. É só entrar em contato de novo quando quiser."
    on_success: finalizar_timeout
    on_failure: finalizar_timeout

  - id: finalizar_timeout
    type: complete
    outcome: failed
    issue_status: "timeout ou desconexão — cliente não respondeu"

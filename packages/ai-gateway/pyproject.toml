[project]
name            = "plughub-ai-gateway"
version         = "1.0.0"
description     = "PlugHub Platform — AI Gateway (ponto único de acesso a LLMs)"
requires-python = ">=3.11"
dependencies    = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis[hiredis]>=5.2.0",
    "aiokafka>=0.11.0",
    # RUNTIME, não dev (corrigido 2026-08-23). `llm_accounts_catalog.py:45` faz
    # `import httpx` em nível de módulo e `main.py:40` importa esse módulo
    # incondicionalmente — sem httpx o serviço não sobe, ponto.
    #
    # Estava listado APENAS em optional-dependencies.dev, e o container subia porque
    # `anthropic` trazia httpx transitivamente e a camada `RUN pip install` do
    # Dockerfile estava em cache desde uma resolução antiga. Ao editar qualquer
    # arquivo do pacote, a camada COPY invalida, o pip resolve de novo, e o serviço
    # morre com ModuleNotFoundError num import que nunca mudou. Depender de
    # dependência transitiva não declarada é o mesmo que depender de estado herdado:
    # funciona até a primeira vez que alguém verifica.
    "httpx>=0.27.0",
]

[project.scripts]
plughub-ai-gateway = "plughub_ai_gateway.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    # httpx saiu daqui: virou dependência de RUNTIME (ver acima). Mantê-lo nos dois
    # lugares faria a próxima leitura concluir que é só de teste.
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# ⚠️ CORRIGIDO 2026-08-02 — era `src/plughub-ai-gateway/tests`, com HÍFEN, enquanto o
# pacote é `src/plughub_ai_gateway` (underscore, como declara `packages` abaixo).
# O caminho não existia, então `pytest` abortava com "file or directory not found" e a
# suíte INTEIRA deste pacote — 7 arquivos — nunca rodou.
#
# Por que passou despercebido: o resumo saía como `0 passed / 1 error`, e "1" parece um
# teste quebrado, não uma suíte ausente. É o mesmo modo de falha dos 35 `skipped` de
# 2026-08-02 — o número que denuncia é pequeno e a leitura natural é benigna.
# Achado por `infra/test/report_suite_skips.sh`, que existe para tornar essa leitura
# impossível.
testpaths    = ["src/plughub_ai_gateway/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/plughub_ai_gateway"]

[project]
name            = "plughub-quality-ingest"
version         = "1.0.0"
description     = "PlugHub Platform — Quality Ingest (R13a): pluggable contact-history reader (external ↔ internal) for evaluation"
requires-python = ">=3.10"
dependencies    = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "aiokafka>=0.11.0",
    "httpx>=0.27.0",
]

[project.scripts]
plughub-quality-ingest = "plughub_quality_ingest.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["src/plughub_quality_ingest/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/plughub_quality_ingest"]

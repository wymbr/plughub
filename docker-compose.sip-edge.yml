# docker-compose.sip-edge.yml — VOZ-32: publica a borda SIP do demo para um provedor de verdade.
#
# CAMADA OPT-IN sobre o docker-compose.demo.yml. O `infra/scripts/up.sh` só a inclui quando o
# `.env.demo` diz `PLUGHUB_SIP_EDGE=true`, e passa o `.env.demo` como fonte de interpolação — é
# de lá que vêm as senhas abaixo. Sem ela, nenhuma porta SIP sai do compose.
#
# O que esta camada muda, e por quê:
#   · publica 5060/UDP (sinalização) e 10000–10100/UDP (RTP). Nada de TCP, nada de TLS/5061:
#     o que não está aqui não está classificado (`probe_sip_edge_surface.sh`).
#   · liga o endereço externo do serviço SIP (`use_external_ip`), senão o SDP anuncia o IP
#     interno do container e o áudio do provedor não volta.
#   · troca as senhas dos troncos pelas do `.env.demo`. A senha de demo do compose principal está
#     no repositório: com a porta aberta, quem tem o repositório liga para dentro. O `:?` faz o
#     compose RECUSAR subir sem ela, em vez de publicar a senha conhecida.
#   · recria os troncos (`SIP_SEED_RECONCILE`), porque o seed é if-absent e manteria a senha antiga.
#
# ⚠️ Autenticação é DIGEST, nunca lista de IPs: o Docker Desktop reescreve a origem de todo pacote
# que entra por porta publicada para o gateway da rede do Docker (medido em 2026-09-23: 172.17.0.1
# vindo da LAN e do localhost). O serviço SIP não vê o IP do provedor.
services:
  livekit-sip:
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"

  sip-seed:
    environment:
      SIP_TRUNK_PASSWORD_DEMO:   ${SIP_TRUNK_PASSWORD_DEMO:?defina SIP_TRUNK_PASSWORD_DEMO no .env.demo antes de abrir a borda SIP}
      SIP_TRUNK_PASSWORD_TWILIO: ${SIP_TRUNK_PASSWORD_TWILIO:-}
      SIP_SEED_RECONCILE:        "true"

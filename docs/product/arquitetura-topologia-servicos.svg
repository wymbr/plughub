<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="840" fill="#FFFFFF"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#2E3138">PlugHub — topologia de serviços</text>
  <text x="40" y="62" font-size="12" fill="#6B7280">29 pacotes no monorepo · verificado contra `packages/` em 2026-07-28</text>

  <!-- ================= BARRAMENTO KAFKA ================= -->
  <rect x="1020" y="156" width="120" height="510" rx="8" fill="#990011"/>
  <text transform="rotate(-90 1080 411)" x="1080" y="411" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">BARRAMENTO KAFKA</text>
  <text transform="rotate(-90 1080 411)" x="1080" y="431" text-anchor="middle" font-size="11" fill="#F0C4CA">~25 tópicos vivos</text>

  <!-- conectores banda -> barramento -->
  <g stroke="#990011" stroke-width="2">
    <line x1="1000" y1="183" x2="1020" y2="183"/>
    <line x1="1000" y1="259" x2="1020" y2="259"/>
    <line x1="1000" y1="335" x2="1020" y2="335"/>
    <line x1="1000" y1="411" x2="1020" y2="411"/>
    <line x1="1000" y1="487" x2="1020" y2="487"/>
    <line x1="1000" y1="563" x2="1020" y2="563"/>
    <line x1="1000" y1="639" x2="1020" y2="639"/>
  </g>

  <!-- ================= 1. INTERFACE ================= -->
  <text x="178" y="113" text-anchor="end" font-size="11.5" font-weight="700" fill="#6B7280">INTERFACE</text>
  <rect x="200" y="80" width="800" height="54" rx="6" fill="#E3EFEF"/>
  <text x="600" y="112" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2E3138">platform-ui — console, monitor, analytics, configuração (React/Vite)</text>

  <!-- ================= 2. CANAIS ================= -->
  <text x="178" y="182" text-anchor="end" font-size="11.5" font-weight="700" fill="#6B7280">CANAIS</text>
  <rect x="200" y="156" width="800" height="54" rx="6" fill="#F2F2F2"/>
  <text x="600" y="180" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2E3138">channel-gateway</text>
  <text x="600" y="198" text-anchor="middle" font-size="10.5" fill="#6B7280">webchat · whatsapp · sms · email · voz/PSTN · webrtc · webhook</text>

  <!-- ================= 3. NÚCLEO DE SESSÃO ================= -->
  <text x="178" y="258" text-anchor="end" font-size="11.5" font-weight="700" fill="#6B7280">NÚCLEO DE SESSÃO</text>
  <rect x="200" y="232" width="260" height="54" rx="6" fill="#F2F2F2"/>
  <text x="330" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#2E3138">mcp-server-plughub</text>
  <text x="330" y="274" text-anchor="middle" font-size="10" fill="#6B7280">Core · produtor puro</text>
  <rect x="470" y="232" width="260" height="54" rx="6" fill="#F2F2F2"/>
  <text x="600" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#2E3138">orchestrator-bridge</text>
  <rect x="740" y="232" width="260" height="54" rx="6" fill="#F2F2F2"/>
  <text x="870" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#2E3138">conversation-writer</text>

  <!-- ================= 4. ROTEAMENTO ================= -->
  <text x="178" y="334" text-anchor="end" font-size="11.5" font-weight="700" fill="#6B7280">ROTEAMENTO</text>
  <rect x="200" y="308" width="395" height="54" rx="6" fill="#F2F2F2"/>
  <text x="397" y="334" text-anchor="middle" font-size="12" font-weight="600" fill="#2E3138">routing-engine</text>
  <text x="397" y="350" text-anchor="middle" font-size="10" fill="#6B7280">único árbitro de alocação · filas · dispatch push/pull</text>
  <rect x="605" y="308" width="395" height="54" rx="6" fill="#F2F2F2"/>
  <text x="802" y="334" text-anchor="middle" font-size="12" font-weight="600" fill="#2E3138">rules-engine</text>
  <text x="802" y="350" text-anchor="middle" font-size="10" fill="#6B7280">avaliação de eventos pós-roteamento</text>

  <!-- ================= 5. EXECUÇÃO DE AGENTES ================= -->
  <text x="178" y="410" text-anchor="end" font-size="11.5" font-weight="700" fill="#6B7280">EXECUÇÃO</text>
  <rect x="200" y="384" width="152" height="54" rx="6" fill="#F2F2F2"/>
  <text x="276" y="416" text-anchor="middle" font-size="11" font-weight="600" fill="#2E3138">skill-flow-engine</text>
  <rect x="362" y="384" width="152" height="54" rx="6" fill="#F2F2F2"/>
  <text x="438" y="416" text-anchor="middle" font-size="11" font-weight="600" fill="#2E3138">ai-gateway</text>
  <rect x="524" y="384" width="152" height="54" rx="6" fill="#F2F2F2"/>
  <text x="600" y="416" text-anchor="middle" font-size="11" font-weight="600" fill="#2E3138">agent-registry</text>
  <rect x="686" y="384" width="152" height="54" rx="6" fill="#F2F2F2"/>
  <text x="762" y="416" text-anchor="middle" font-size="11" font-weight="600" fill="#2E3138">knowledge (RAG)</text>
  <rect x="848" y="384" width="152" height="54" rx="6" fill="#F2F2F2"/>
  <text x="924" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#2E3138">sdk / proxy MCP</text>
  <text x="924" y="426" text-anchor="middle" font-size="9.5" fill="#6B7280">interception guard</text>

  <!-- ================= 6. SERVIÇOS DE DOMÍNIO ================= -->
  <text x="178" y="486" text-anchor="end" font-size="11.5" font-weight="700" fill="#6B7280">DOMÍNIO</text>
  <rect x="200" y="460" width="91" height="54" rx="6" fill="#E3EFEF"/>
  <text x="245" y="492" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2E3138">dialog-api</text>
  <rect x="301" y="460" width="91" height="54" rx="6" fill="#E3EFEF"/>
  <text x="346" y="492" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2E3138">scheduler-api</text>
  <rect x="402" y="460" width="91" height="54" rx="6" fill="#E3EFEF"/>
  <text x="447" y="492" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2E3138">mailing-api</text>
  <rect x="503" y="460" width="91" height="54" rx="6" fill="#E3EFEF"/>
  <text x="548" y="492" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2E3138">calendar-api</text>
  <rect x="604" y="460" width="91" height="54" rx="6" fill="#E3EFEF"/>
  <text x="649" y="492" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2E3138">auth-api</text>
  <rect x="705" y="460" width="91" height="54" rx="6" fill="#E3EFEF"/>
  <text x="750" y="492" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2E3138">pricing-api</text>
  <rect x="806" y="460" width="91" height="54" rx="6" fill="#F2F2F2"/>
  <text x="851" y="492" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2E3138">config-api</text>
  <rect x="907" y="460" width="93" height="54" rx="6" fill="#F2F2F2"/>
  <text x="953" y="486" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2E3138">workflow-api</text>
  <text x="953" y="500" text-anchor="middle" font-size="8.5" fill="#6B7280">legado</text>

  <!-- ================= 7. QUALIDADE ================= -->
  <text x="178" y="562" text-anchor="end" font-size="11.5" font-weight="700" fill="#6B7280">QUALIDADE</text>
  <rect x="200" y="536" width="192" height="54" rx="6" fill="#F2F2F2"/>
  <text x="296" y="568" text-anchor="middle" font-size="11" font-weight="600" fill="#2E3138">evaluation-api</text>
  <rect x="402" y="536" width="192" height="54" rx="6" fill="#F2F2F2"/>
  <text x="498" y="568" text-anchor="middle" font-size="11" font-weight="600" fill="#2E3138">session-replayer</text>
  <rect x="604" y="536" width="192" height="54" rx="6" fill="#F2F2F2"/>
  <text x="700" y="568" text-anchor="middle" font-size="11" font-weight="600" fill="#2E3138">quality-ingest</text>
  <rect x="806" y="536" width="194" height="54" rx="6" fill="#E3EFEF"/>
  <text x="903" y="568" text-anchor="middle" font-size="11" font-weight="600" fill="#2E3138">quality-export</text>

  <!-- ================= 8. ANALÍTICA ================= -->
  <text x="178" y="638" text-anchor="end" font-size="11.5" font-weight="700" fill="#6B7280">ANALÍTICA</text>
  <rect x="200" y="612" width="260" height="54" rx="6" fill="#F2F2F2"/>
  <text x="330" y="638" text-anchor="middle" font-size="12" font-weight="600" fill="#2E3138">analytics-api</text>
  <text x="330" y="654" text-anchor="middle" font-size="10" fill="#6B7280">consome 18 tópicos</text>
  <rect x="470" y="612" width="260" height="54" rx="6" fill="#F2F2F2"/>
  <text x="600" y="644" text-anchor="middle" font-size="12" font-weight="600" fill="#2E3138">clickhouse-consumer</text>
  <rect x="740" y="612" width="260" height="54" rx="6" fill="#F2F2F2"/>
  <text x="870" y="644" text-anchor="middle" font-size="12" font-weight="600" fill="#2E3138">usage-aggregator</text>

  <!-- ================= 9. PERSISTÊNCIA ================= -->
  <text x="178" y="714" text-anchor="end" font-size="11.5" font-weight="700" fill="#6B7280">PERSISTÊNCIA</text>
  <rect x="200" y="688" width="192" height="54" rx="6" fill="#2E3138"/>
  <text x="296" y="714" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">Redis</text>
  <text x="296" y="729" text-anchor="middle" font-size="9.5" fill="#C9CDD4">estado vivo · stream · filas</text>
  <rect x="402" y="688" width="192" height="54" rx="6" fill="#2E3138"/>
  <text x="498" y="714" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">PostgreSQL + pgvector</text>
  <text x="498" y="729" text-anchor="middle" font-size="9.5" fill="#C9CDD4">registro · histórico · RAG</text>
  <rect x="604" y="688" width="192" height="54" rx="6" fill="#2E3138"/>
  <text x="700" y="714" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">ClickHouse</text>
  <text x="700" y="729" text-anchor="middle" font-size="9.5" fill="#C9CDD4">analytics · audit log</text>
  <rect x="806" y="688" width="194" height="54" rx="6" fill="#2E3138"/>
  <text x="903" y="714" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">Object Storage</text>
  <text x="903" y="729" text-anchor="middle" font-size="9.5" fill="#C9CDD4">áudio · anexos · gravação</text>

  <!-- ================= LEGENDA ================= -->
  <rect x="200" y="778" width="18" height="18" rx="3" fill="#F2F2F2"/>
  <text x="226" y="792" font-size="11" fill="#2E3138">publica ou consome no barramento</text>
  <rect x="470" y="778" width="18" height="18" rx="3" fill="#E3EFEF"/>
  <text x="496" y="792" font-size="11" fill="#2E3138">REST puro — não toca Kafka</text>
  <rect x="720" y="778" width="18" height="18" rx="3" fill="#2E3138"/>
  <text x="746" y="792" font-size="11" fill="#2E3138">armazenamento</text>

  <text x="200" y="820" font-size="10" fill="#6B7280">Infra as-built: 1 broker Kafka (KRaft), replication-factor 1, sem retenção configurada — ambiente de desenvolvimento e demonstração.</text>
</svg>

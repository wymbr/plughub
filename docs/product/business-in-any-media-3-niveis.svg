<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 840" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Business in Any Media — modelo de três níveis do PlugHub</title>
<desc id="d">Cliente em qualquer canal acessa o nível (c) agente de I/O, que reporta ao nível (b) fluxo de acesso aos canais, que serve o nível (a) fluxo negocial abstraído de canal; (a) integra sistemas via MCP. Serviços compartilhados à direita.</desc>
<style>
  :root{
    --bg: var(--color-background-primary, #ffffff);
    --ink: var(--color-text-primary, #16242f);
    --muted: var(--color-text-secondary, #5a6a78);
    --line: var(--color-border-tertiary, #d4dbe3);
    --primary:#1B4F8A; --secondary:#2D9CDB; --accent:#00B4D8;
    --green:#059669; --warning:#D97706;
  }
  .bg{fill:var(--bg)}
  .card{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
  .build{fill:var(--bg);stroke:var(--warning);stroke-width:1.8;stroke-dasharray:7 5}
  .hdr{fill:var(--primary)}
  .h1{fill:var(--primary);font-size:26px;font-weight:700}
  .sub{fill:var(--muted);font-size:14px}
  .tag{fill:var(--muted);font-size:11px}
  .lyr{fill:#fff;font-size:15px;font-weight:700}
  .lyrt{fill:#dce9f6;font-size:10.5px;font-weight:600}
  .body{fill:var(--ink);font-size:12.5px}
  .small{fill:var(--muted);font-size:11px}
  .chip{fill:#eef4fa;stroke:var(--line);stroke-width:1}
  .chipt{fill:var(--primary);font-size:11px;font-weight:600}
  .rail{fill:#f6f9fc;stroke:var(--line);stroke-width:1.2}
  .arr{stroke:var(--secondary);stroke-width:2;fill:none}
  .arrlbl{fill:var(--muted);font-size:11px;font-style:italic}
  .lab{fill:var(--ink);font-size:12px;font-weight:600}
</style>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2D9CDB"/></marker>
  <marker id="as" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 Z" fill="#2D9CDB"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="980" height="840"/>

<!-- Title -->
<text class="h1" x="40" y="46">Business in Any Media</text>
<text class="sub" x="41" y="68">nunca mais perca um negócio por causa de canal</text>
<text class="tag" x="938" y="40" text-anchor="end">PlugHub · modelo de 3 níveis</text>
<text class="tag" x="938" y="56" text-anchor="end">arquitetura-alvo · jun/2026</text>

<!-- Channels -->
<rect class="card" x="40" y="88" width="648" height="66" rx="10"/>
<text class="lab" x="56" y="110">Cliente / interlocutor — qualquer canal</text>
<g>
  <rect class="chip" x="56"  y="120" width="96" height="24" rx="12"/><text class="chipt" x="104" y="136" text-anchor="middle">WhatsApp</text>
  <rect class="chip" x="160" y="120" width="96" height="24" rx="12"/><text class="chipt" x="208" y="136" text-anchor="middle">Webchat</text>
  <rect class="chip" x="264" y="120" width="96" height="24" rx="12"/><text class="chipt" x="312" y="136" text-anchor="middle">WebRTC</text>
  <rect class="chip" x="368" y="120" width="96" height="24" rx="12"/><text class="chipt" x="416" y="136" text-anchor="middle">Voz / PSTN</text>
  <rect class="chip" x="472" y="120" width="96" height="24" rx="12"/><text class="chipt" x="520" y="136" text-anchor="middle">SMS</text>
  <rect class="chip" x="576" y="120" width="96" height="24" rx="12"/><text class="chipt" x="624" y="136" text-anchor="middle">E-mail</text>
</g>

<!-- arrow channels <-> c -->
<line class="arr" x1="364" y1="154" x2="364" y2="176" marker-end="url(#a)" marker-start="url(#as)"/>
<text class="arrlbl" x="376" y="170">in/out nativo</text>

<!-- Layer C -->
<rect class="card" x="40" y="178" width="648" height="84" rx="10"/>
<rect class="hdr" x="40" y="178" width="648" height="30" rx="10"/>
<rect class="hdr" x="40" y="194" width="648" height="14"/>
<text class="lyr" x="56" y="199">(c) Agente de I/O no canal</text>
<text class="lyrt" x="672" y="198" text-anchor="end">perfil agent · implementado</text>
<text class="body" x="56" y="228">menu · notify · masked input · render nativo do canal</text>
<text class="small" x="56" y="248">+ Channel Adapter (WS / webhook / bot-leg · STT/TTS · upload)</text>

<!-- arrow c <-> b -->
<line class="arr" x1="364" y1="262" x2="364" y2="300" marker-end="url(#a)" marker-start="url(#as)"/>
<text class="arrlbl" x="376" y="285">episódio de interação · resultado canônico</text>

<!-- Layer B (to build) -->
<rect class="build" x="40" y="302" width="648" height="126" rx="10"/>
<text class="lab" x="56" y="326">(b) Fluxo de acesso aos canais</text>
<text class="tag" x="672" y="326" text-anchor="end">perfil agent · a consolidar ⚠</text>
<rect class="chip" x="56"  y="338" width="290" height="26" rx="8"/><text class="chipt" x="68" y="355">identidade ↔ fluxo pendente (retomada cross-canal)</text>
<rect class="chip" x="56"  y="370" width="200" height="26" rx="8"/><text class="chipt" x="68" y="387">seleção / troca de canal</text>
<rect class="chip" x="266" y="370" width="280" height="26" rx="8"/><text class="chipt" x="278" y="387">chama negociação de mídia (Arc 16)</text>
<text class="small" x="56" y="416">concilia mudanças de canal · mantém o nível (a) sem saber por onde fala</text>

<!-- arrow b <-> a -->
<line class="arr" x1="364" y1="428" x2="364" y2="466" marker-end="url(#a)" marker-start="url(#as)"/>
<text class="arrlbl" x="376" y="451">contrato abstrato (collect / task) — sem canal</text>

<!-- Layer A -->
<rect class="card" x="40" y="468" width="648" height="92" rx="10"/>
<rect class="hdr" x="40" y="468" width="648" height="30" rx="10"/>
<rect class="hdr" x="40" y="484" width="648" height="14"/>
<text class="lyr" x="56" y="489">(a) Fluxo negocial — abstraído de canal</text>
<text class="lyrt" x="672" y="488" text-anchor="end">perfil workflow · implementado</text>
<text class="body" x="56" y="518">task · choice · catch · escalate · invoke · reason · suspend · collect · receive</text>
<text class="small" x="56" y="538">nunca menu/notify · session_id persistente · suspend/resume (Redis TTL)</text>

<!-- arrow a -> systems -->
<line class="arr" x1="364" y1="560" x2="364" y2="596" marker-end="url(#a)"/>
<text class="arrlbl" x="376" y="581">MCP · interception guard · audit (LGPD)</text>

<!-- Systems -->
<rect class="card" x="40" y="598" width="648" height="62" rx="10"/>
<text class="lab" x="56" y="624">Sistemas de negócio</text>
<text class="small" x="56" y="644">catálogo · estoque · preço · pagamento · ERP · transportadora · CRM</text>

<!-- Shared services rail -->
<rect class="rail" x="712" y="178" width="228" height="382" rx="10"/>
<text class="lab" x="726" y="204">Serviços compartilhados</text>
<text class="small" x="726" y="221">consumidos por todas as camadas</text>
<g>
  <rect class="chip" x="726" y="234" width="200" height="34" rx="8"/><text class="chipt" x="740" y="255">Routing Engine (SLA/skill/perf)</text>
  <rect class="chip" x="726" y="276" width="200" height="34" rx="8"/><text class="chipt" x="740" y="297">AI Gateway (multi-conta, BYO LLM)</text>
  <rect class="chip" x="726" y="318" width="200" height="34" rx="8"/><text class="chipt" x="740" y="339">ContextStore (@ctx.*)</text>
  <rect class="chip" x="726" y="360" width="200" height="34" rx="8"/><text class="chipt" x="740" y="381">Masking / LGPD by design</text>
  <rect class="chip" x="726" y="402" width="200" height="34" rx="8"/><text class="chipt" x="740" y="423">Quality · Bancada IA × Humano</text>
  <rect class="chip" x="726" y="444" width="200" height="34" rx="8"/><text class="chipt" x="740" y="465">Analytics (ClickHouse)</text>
  <rect class="chip" x="726" y="486" width="200" height="34" rx="8"/><text class="chipt" x="740" y="507">Especialista humano (conferência)</text>
</g>
<text class="small" x="726" y="540">humano + IA simétricos na</text>
<text class="small" x="726" y="554">mesma sessão, em qualquer nível</text>

<!-- Legend -->
<line x1="40" y1="690" x2="940" y2="690" stroke="var(--line)" stroke-width="1"/>
<rect x="40" y="706" width="26" height="16" rx="4" class="card"/><text class="small" x="74" y="718">implementado hoje</text>
<rect x="210" y="706" width="26" height="16" rx="4" class="build"/><text class="small" x="244" y="718">a construir / consolidar (nível b)</text>
<line class="arr" x1="470" y1="714" x2="500" y2="714" marker-end="url(#a)" marker-start="url(#as)"/><text class="small" x="508" y="718">contrato entre camadas (rótulos nas setas)</text>
<text class="small" x="40" y="744" font-style="italic">Princípio: a vitrine rica é um frontend/canal; a espinha transacional (a) é o workflow; navegação fica como leitura pura; o humano entra só na exceção.</text>
</svg>

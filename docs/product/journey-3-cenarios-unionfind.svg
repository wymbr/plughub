<svg viewBox="0 0 920 780" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, system-ui, sans-serif">
<title>Três cenários de associação de journey e a resolução canônica por union-find</title>
<desc>Cenário 1 top-down propaga a raiz sem merge; cenários 2 e 3 usam uma aresta de merge do mais novo para o mais antigo; a resolução canônica é union-find apontando para a raiz mais antiga.</desc>
<style>
  .card{fill:#f6f7f9;stroke:#dcdfe5;stroke-width:1;}
  .node{fill:#ffffff;stroke:#c4cad3;stroke-width:1.4;}
  .canon{fill:#e7eef6;stroke:#1B4F8A;stroke-width:1.8;}
  .t1{fill:#1b1f24;font-size:13px;font-weight:600;}
  .t2{fill:#5b6572;font-size:11px;}
  .lab{fill:#5b6572;font-size:10.5px;}
  .h{fill:#1b1f24;font-size:14px;font-weight:700;}
  .sc{fill:#1B4F8A;font-size:13px;font-weight:700;}
  .cap{fill:#5b6572;font-size:11px;}
  .prov{stroke:#5b6572;stroke-width:1.6;fill:none;}
  .merge{stroke:#C2410C;stroke-width:1.8;stroke-dasharray:6 4;fill:none;}
  .mlab{fill:#C2410C;font-size:11px;font-weight:600;}
</style>
<defs>
  <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6572"/></marker>
  <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#C2410C"/></marker>
</defs>
<text x="20" y="26" class="h">Journey · três cenários de associação → raiz canônica</text>
<line x1="20" y1="44" x2="52" y2="44" class="prov" marker-end="url(#ap)"/>
<text x="58" y="48" class="lab">proveniência (origin_session_id · 1 salto)</text>
<line x1="300" y1="44" x2="332" y2="44" class="merge" marker-end="url(#am)"/>
<text x="338" y="48" class="lab">merge (journey_aliases · novo→antigo)</text>
<rect x="590" y="38" width="16" height="12" class="canon"/>
<text x="612" y="48" class="lab">raiz canônica (mais antiga)</text>
<rect x="14" y="66" width="892" height="150" class="card"/>
<text x="30" y="92" class="sc">1 · Top-down</text>
<text x="30" y="112" class="cap">bem comportado</text>
<text x="30" y="130" class="cap">param propagado</text>
<text x="30" y="146" class="cap">sem merge</text>
<rect x="250" y="118" width="180" height="48" class="canon"/>
<text x="264" y="140" class="t1">S1 · workflow N3</text>
<text x="264" y="157" class="t2">root = S1 (canônica)</text>
<rect x="560" y="90" width="180" height="46" class="node"/>
<text x="574" y="111" class="t1">S2 · collect</text>
<text x="574" y="127" class="t2">root ← S1 (propagado)</text>
<rect x="560" y="150" width="180" height="46" class="node"/>
<text x="574" y="171" class="t1">S3 · delegate</text>
<text x="574" y="187" class="t2">root ← S1 (propagado)</text>
<path d="M430,138 C500,138 500,113 558,113" class="prov" marker-end="url(#ap)"/>
<path d="M430,146 C500,146 500,173 558,173" class="prov" marker-end="url(#ap)"/>
<rect x="14" y="224" width="892" height="150" class="card"/>
<text x="30" y="250" class="sc">2 · Unify</text>
<text x="30" y="270" class="cap">duas journeys</text>
<text x="30" y="286" class="cap">populadas → uma</text>
<text x="30" y="302" class="cap">o fluxo comanda</text>
<rect x="250" y="276" width="180" height="48" class="canon"/>
<text x="264" y="298" class="t1">S_A · root = A</text>
<text x="264" y="315" class="t2">mais antiga (sobrevive)</text>
<rect x="560" y="276" width="180" height="48" class="node"/>
<text x="574" y="298" class="t1">S_B · root = B</text>
<text x="574" y="315" class="t2">mais nova (absorvida)</text>
<path d="M558,300 L434,300" class="merge" marker-end="url(#am)"/>
<text x="452" y="290" class="mlab">journey_merge(B → A)</text>
<rect x="14" y="382" width="892" height="160" class="card"/>
<text x="30" y="408" class="sc">3 · Inbound</text>
<text x="30" y="428" class="cap">antes de saber</text>
<text x="30" y="444" class="cap">(caso comum)</text>
<text x="30" y="460" class="cap">intake sob a journey</text>
<rect x="250" y="440" width="190" height="48" class="canon"/>
<text x="264" y="462" class="t1">S_P · workflow pendente</text>
<text x="264" y="479" class="t2">root = jP (antiga)</text>
<rect x="560" y="440" width="190" height="48" class="node"/>
<text x="574" y="462" class="t1">S_I · intake</text>
<text x="574" y="479" class="t2">root = jI (nova, self)</text>
<text x="560" y="512" class="lab">resolve customer_id → pending_by_customer → jP</text>
<path d="M558,464 L444,464" class="merge" marker-end="url(#am)"/>
<text x="452" y="454" class="mlab">journey_merge(jI → jP)</text>
<rect x="14" y="550" width="892" height="212" class="card"/>
<text x="30" y="578" class="h">Resolução canônica — union-find (na leitura)</text>
<text x="30" y="600" class="cap">Arestas apontam sempre novo→antigo (ordem total por started_at) → floresta sem ciclo.</text>
<rect x="60" y="620" width="150" height="42" class="node"/>
<text x="74" y="646" class="t1">jI (intake)</text>
<rect x="330" y="620" width="150" height="42" class="canon"/>
<text x="344" y="646" class="t1">jP (canônica)</text>
<path d="M212,641 L328,641" class="merge" marker-end="url(#am)"/>
<text x="222" y="633" class="lab">find(jI) = jP</text>
<rect x="60" y="682" width="150" height="42" class="node"/>
<text x="74" y="708" class="t1">B</text>
<rect x="330" y="682" width="150" height="42" class="canon"/>
<text x="344" y="708" class="t1">A (canônica)</text>
<path d="M212,703 L328,703" class="merge" marker-end="url(#am)"/>
<text x="222" y="695" class="lab">find(B) = A</text>
<text x="540" y="640" class="cap">journey = componente conexa</text>
<text x="540" y="658" class="cap">sob (proveniência ∪ alias)</text>
<text x="540" y="682" class="cap">fonte de verdade: root_session_id</text>
<text x="540" y="700" class="cap">+ journey_aliases</text>
<text x="540" y="724" class="cap">sessions.journey_id = cache</text>
<text x="540" y="742" class="cap">eventualmente consistente</text>
</svg>

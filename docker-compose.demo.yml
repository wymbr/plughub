# docker-compose.demo.yml
# PlugHub Platform — Demo Environment (Arc 2 → Arc 12)
#
# Stack completa: infra + todos os módulos de aplicação + observabilidade
#
# Novidades neste build (2026-05-13):
#
#   • Console UX Redesign — Arc 11 fase de polimento
#     ParticipantFilterBar: barra horizontal de chips acima do chat.
#       Chips: "Todos" | "Cliente" | "Agente" | um por agente AI (com badge de
#       contagem). Clicar filtra as mensagens. AI que saiu aparece dimmed.
#       Supervisores/admin: chip "⚙️ Supervisão" expansível com intervenções
#       inline (injetar contexto + force-complete), substituindo a aba Orq.
#     CopilotBanner: banner compacto entre ChatArea e AgentInput com
#       sugestao_resposta, flags_risco e acoes_recomendadas. Botão ✕ descarta
#       para aquela janela de atualização. Substitui a aba Capacidades.
#     ActionBar redesenhado:
#       TransferCombo — dropdown ↗ Transferir ▾ com destinos de escalação
#         (pool_id, reason, estimativa de espera, badge Recomendado).
#       CollaborateCombo — unifica AdicionarEspecialista + Delegar em
#         "🤝 Colaborar ▾" com duas seções: "Convidar Especialista" (2-step)
#         e "Delegar Tarefa" (abre DelegarTarefaDrawer). Badge laranja com
#         count de mensagens selecionadas.
#     Painel direito: 3 abas Estado · Contexto · Histórico (eram 4/5 abas).
#       Aba Histórico migrada da coluna central para o painel direito.
#       Switcher "Atual/Histórico" da coluna central removido.
#     platform-ui: http://localhost:5174/agent-assist
#
#   • Bugfix — Pool Lifecycle Hooks (wrapup + NPS) + Resposta NPS não vaza ao agente
#     (1) server.ts: WS cancela subscrição só em reason=agent_done (era qualquer
#         session.closed); hooks on_human_end chegam corretamente ao Console.
#     (2) orchestrator-bridge main.py: on_human_start hooks agora gravam hook_conf
#         no Redis; G2 não bloqueia on_human_end indefinidamente.
#     (3) AgentAssistContext.tsx: message.text com author=customer ignorado após
#         sessionClosed=true; resposta "1" do NPS não aparece mais ao agente.
#     Validação: encerrar sessão → ver wrapup (agents_only) → cliente responde NPS
#     → agente NÃO vê a resposta do cliente.
#
# Novidades anteriores (2026-05-12):
#
#   • Arc 11 — Console: Superfície de Orquestração Humana (Fases A–D)
#     Console elevado de interface de atendimento para orquestrador de agentes AI.
#     F1 (Fase A): AiParticipantCard no EstadoTab — step atual, status e drawer
#       por participante AI; polling 3 s via GET /api/supervisor_state estendido.
#     F2 (Fase B): AdicionarEspecialistaButton no ActionBar — dropdown de agentes
#       disponíveis (GET /v1/pools/:id/mentionable-agents) + textarea de contexto.
#     F3 (Fase C): DelegarTarefaDrawer — hover checkboxes em MessageBubble,
#       toolbar de contagem no ChatArea, DelegarButton com badge numérico.
#     F4 (Fase D): OrchestrationTab — 5° tab gateado por role supervisor/admin;
#       linha do tempo de transições de step + intervenções de supervisor:
#       POST /api/inject-context (ContextStore) + POST /api/force-complete.
#     platform-ui: http://localhost:5174/agent-assist (login supervisor para F4)
#
#   • Arc 12 — Agent Business Events
#     MCP tool agent_event(category, value, tags?) para AI e humanos publicarem
#     KPIs de negócio estruturados; Kafka topic agent.events → ClickHouse
#     analytics.agent_business_events. Governança: namespace = pool_id, PII
#     keywords bloqueadas, rate limit 50 eventos/sessão.
#     analytics-api: /reports/agent-events/series, /summary, /categories.
#     platform-ui: dashboard cards agent_event_timeseries + agent_event_summary.
#     http://localhost:5174/dashboards (cards agent-event-*)
#
# Novidades anteriores (2026-05-11):
#
#   • Arc 10 — Journey: Multi-Session Service Automation (Fases A–E)
#     Journey como unidade de serviço que transcende a sessão.
#     workflow-api: tabela workflow.journeys + 6 endpoints /v1/journeys/**
#       (inclui POST /from-instance/{id}); Kafka topic journey.events.
#     mcp-server-plughub: tools journey_start, journey_link_session, journey_merge.
#     skill-flow-worker: flag creates_journey:true no YAML auto-cria Journey.
#     collect step: propaga journey_id para sessões filhas via collect.events.
#     analytics-api: consumer journey.events → journey_events ClickHouse;
#       GET /reports/journeys (KPI strip por skill_id);
#       4 display endpoints: journey-active-count, journey-resolution-rate,
#       journey-funnel, journey-median-duration.
#     platform-ui: ProcessosPage (tabs Jornadas/Instâncias + MergeButton);
#       HistoricoTab "Processos em aberto"; ActionBar "Iniciar Processo";
#       4 dashboard cards de jornada (catalog.ts).
#       http://localhost:5174/workflow/monitor (tab Jornadas)
#       http://localhost:5174/agent-assist (Console com Processos em aberto)
#       http://localhost:5174/dashboards (cards journey-*)
#
#   • Arc 9 — Agent Groups & Supervisor Scope
#     AgentGroup como entidade de gestão de pessoas ortogonal a Pool.
#     auth-api: 5 novas tabelas (agent_groups + sub-recursos); CRUD REST
#     /v1/groups/**; claims supervised_agent_types/groups/user_ids no JWT.
#     analytics-api: 5 report endpoints filtram por supervised_agent_types.
#     platform-ui: Config/Groups page em http://localhost:5174/config/groups
#     (list + drawer com tabs Info / Members / Supervisors / Shifts).
#
# Novidades anteriores (2026-05-09):
#
#   • Dashboard #35 — Sistema de Cards Genéricos configuráveis por JSON
#     Dashboards drag-and-drop com 7 tipos de display tool: metric_card,
#     bar_chart, line_chart, donut, table, agent_status, pool_status.
#     AddCardModal 3 etapas (escolher ferramenta → configurar → salvar).
#     FilterBar global por tenant/período/pool aplicado a todos os cards.
#     10 endpoints GET /reports/display/* no analytics-api com dados reais.
#     http://localhost:5174/dashboards
#
#   • Análise de Qualidade — página funcional
#     GET /reports/evaluations/summary com group_by (campanha/form/avaliador/data).
#     KPIs: total avaliações, nota média ponderada, % contestações.
#     Tabela sortável com ScoreBar mini-distribuição por quartil.
#     http://localhost:5174/analise/qualidade
#
#   • Análise de Processos — página funcional
#     GET /reports/workflow-summary com group_by (flow_id/campaign_id).
#     OutcomeBar proporcional + RateBar conclusão/falha. CSV export.
#     http://localhost:5174/analise/processos
#
#   • Agentes — sub-tab Relatório funcional
#     GET /reports/agent-performance/daily (Arc 5 MV).
#     Filtros data + pool + agente; KPIs ponderados; mini-bars por taxa.
#     http://localhost:5174/contacts/agents
#
#   • Eventos — stream unificado de auditoria
#     GET /reports/events: UNION ALL de sessions/messages/agent_events/
#     agent_pause_intervals/workflow_events. Filtros session_id, pool_id,
#     channel, event_type com branch pruning por event_type.
#     http://localhost:5174/contacts/events
#
#   • FlowMonitorPage — pools dinâmicos
#     Select de pool agora carrega GET /v1/pools do agent-registry (era hardcoded).
#
# Novidades anteriores (2026-05-07):
#   • Channel Endpoints — /config/channels
#     Entidade ChannelEndpoint mapeia endereço externo (slug, DID, número)
#     para pool_id por canal. Suporte a: webchat, whatsapp, voice, sms,
#     email, webhook. Webhook como canal de entrada (path-based routing
#     {host}/channel/webhook/{slug}) separado de workflow webhooks Arc 4.
#     WebChat config page e Webhook config page por sub-tab.
#
#   • Contacts — nova aba Agentes (disponibilidade + pausas)
#     Tab "Agents" em /contacts?tab=agents: pivot table de disponibilidade
#     por agente × dia (heatmap âmbar) + lista plana de pausas por motivo
#     com export CSV. Gateada por ABAC contacts.visualizar.
#     Backend Arc 8 (analytics-api /reports/agent-availability) pendente —
#     tab exibe estado de loading até endpoint estar disponível.
#
#   • Language Cleanup Fase 1 — identificadores em inglês
#     Rotas, navKeys, tab IDs, i18n keys e nomes de pasta migrados:
#     /config/canais → /config/channels, /atendimento → /service,
#     tab 'relatorio' → 'report', tab 'analise' → 'analysis'.
#     Redirects de compatibilidade mantidos para todas as rotas antigas.
#
#   • Agent Reports movido para Contacts → Agents
#     /config/agent-reports redireciona para /contacts?tab=agents.
#     Item removido da sidebar de Configuração.
#
#   • Calendar API — Fases 1–4 concluídas:
#     Fase 1: feriados recorrentes por MM-DD (sem ano fixo)
#     Fase 2: status 3-state open/closed/holiday
#     Fase 3: timezone por tenant (GET/PATCH /v1/tenant-config)
#     Fase 4: múltiplos intervalos de tempo por dia — WeeklyEditor
#             redesenhado permite N slots (ex: pausa de almoço 12–13h)
#
#   • Agent Assist unificado no Platform UI (http://localhost:5174/agent-assist)
#     Multi-pool WebSocket, Presence Sidebar, ContactList priorizada por SLA
#
# Uso:
#   docker compose -f docker-compose.demo.yml up --build                        # build + start
#   docker compose -f docker-compose.demo.yml up --build --scale e2e-runner=0  # sem runner
#   docker compose -f docker-compose.demo.yml logs -f e2e-runner               # acompanhar testes
#   docker compose -f docker-compose.demo.yml down -v                          # limpar ambiente
#
# Para forçar rebuild sem cache (ex: após mudanças de código não refletidas):
#   docker compose -f docker-compose.demo.yml build --no-cache platform-ui
#   docker compose -f docker-compose.demo.yml up
#   (ou: build --no-cache sem serviço específico para rebuildar tudo)
#
# ┌─ URLs de acesso ───────────────────────────────────────────────────────────┐
# │                                                                             │
# │  ★ Platform UI  (shell unificado — login real via auth-api)                │
# │    http://localhost:5174/login                                             │
# │                                                                             │
# │    Usuários demo:                                                           │
# │      admin@plughub.local      / changeme_admin      (roles: admin)         │
# │      supervisor@plughub.local / changeme_supervisor (roles: supervisor)    │
# │      operator@plughub.local   / changeme_operator   (roles: operator)      │
# │                                                                             │
# │    Módulos:                                                                 │
# │      Contatos (Lista/Relatório/Monitor/Análise/Agentes) · Agent Assist ·   │
# │      Fluxo/Editor · Avaliação · Dashboards · Faturamento ·                 │
# │      Config (Recursos/Plataforma/Canais/Calendários/Masking/Billing) ·     │
# │      Workflow · Acesso (Usuários + ABAC) · Grupos (Arc 9)                  │
# │                                                                             │
# │  ① Agent Assist — integrado no Platform UI (recomendado)                   │
# │    http://localhost:5174/agent-assist?pool=retencao_humano               │
# │                                                                             │
# │  ② Agent Assist UI — app legado (referência)                               │
# │    http://localhost:5173?pool=retencao_humano&agent=agente_humano_v1-001  │
# │                                                                             │
# │  ③ WebChat cliente  (consumidor final)                                     │
# │    http://localhost:5173/webchat-test.html                                │
# │                                                                             │
# │  Observabilidade                                                            │
# │    Kafdrop  (Kafka UI):         http://localhost:9002                     │
# │    Redis Commander (Redis UI):  http://localhost:8081                     │
# │                                                                             │
# │  APIs diretas (para debug)                                                 │
# │    auth-api:        http://localhost:3202/health                          │
# │    evaluation-api:  http://localhost:3400/health                          │
# │    knowledge-api:   http://localhost:3401/health                          │
# │    pricing-api:     http://localhost:3900/health                          │
# │    calendar-api:    http://localhost:3700/health                          │
# │    workflow-api:    http://localhost:3800/health                          │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Flags do runner (via E2E_EXTRA_ARGS):
#   E2E_EXTRA_ARGS="--demo"             # cenários 01–14 (padrão)
#   E2E_EXTRA_ARGS="--only 07"          # apenas cenário 07 (inbound full)
#   E2E_EXTRA_ARGS="--only 12"          # apenas cenário 12 (webchat)
#   E2E_EXTRA_ARGS="--only 13"          # apenas cenário 13 (workflow)
#   E2E_EXTRA_ARGS="--only 14"          # apenas cenário 14 (collect step)
#   E2E_EXTRA_ARGS="--conference"       # cenários 01–04 + 06
#   E2E_EXTRA_ARGS="--webchat"          # cenários 01–04 + 12
#   E2E_EXTRA_ARGS="--workflow"         # cenários 01–04 + 13 + 14
#   E2E_EXTRA_ARGS="--evaluation"       # cenários 01–04 + 24 + 25 (Arc 6)
#   E2E_EXTRA_ARGS="--hooks"            # cenário 22 (pool lifecycle hooks)
#   E2E_EXTRA_ARGS="--segments"         # cenário 23 (Arc 5 contact segments)
#   E2E_EXTRA_ARGS="--ctx"              # cenário 17 (ContextStore + resolve step)
#   E2E_EXTRA_ARGS="--permissions"      # cenário 27 (Arc 6 v2 ABAC permissions)
#   E2E_EXTRA_ARGS="--workflow-review"  # cenário 28 (Arc 6 v2 review/contestation cycle)
#   E2E_EXTRA_ARGS="--orchestration"    # cenário 29 (Arc 11 Console orchestration F1–F4)
#   E2E_EXTRA_ARGS="--agent-events"     # cenário 30 (Arc 12 agent business events)
#
# Variáveis de ambiente opcionais:
#   ANTHROPIC_API_KEY — para testes com inferência LLM real (cenários 19, 26)
#   OPENAI_API_KEY    — para embeddings reais no mcp-server-knowledge

name: plughub-demo

networks:
  plughub-demo:
    driver: bridge

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  clickhouse-data:
  attachment-data:
  minio-data:


  # Orchestrator Bridge — consumes conversations.routed from Kafka and publishes
  # conversation.assigned to Redis pub/sub pool:events:{poolId}.
  # Required for human agents: without this service, routed contacts never appear
  # in the Agent Assist UI.
  orchestrator-bridge:
    build:
      context: .
      dockerfile: packages/orchestrator-bridge/Dockerfile
    volumes:
      # Declarative registry config — RegistrySyncer reads this at startup and
      # upserts pools + agent types into the Agent Registry automatically.
      # No external seed script needed for a fresh environment.
      - ./infra/registry:/registry:ro
      # Skill YAMLs — mounted so RegistrySyncer picks up changes without rebuild.
      # Restart orchestrator-bridge after editing any skill_*.yaml or agente_*.yaml.
      - ./packages/skill-flow-engine/skills:/skills:ro
    environment:
      KAFKA_BROKERS:        kafka:29092
      REDIS_URL:            redis://redis:6379
      SKILL_FLOW_URL:       http://skill-flow-service:3460
      AGENT_REGISTRY_URL:   http://agent-registry:3300
      # Camada D (detach de hooks de finalização): disparo de hooks `detached` como
      # workflow webhook fire-and-forget (Arc 19 POST /v1/channels/webhook/pool/{id}).
      CHANNEL_GATEWAY_URL:  http://channel-gateway:8010
      # Fase B (ADR requeue, D1): o bridge consulta a POSSE no árbitro antes de
      # decidir o que fazer com a queda de transporte, e devolve item de fila pull
      # por work_task_release. Ausente ⇒ o holder falha e o bridge degrada para a
      # re-rota antiga COM LOG — o defeito volta, mas não em silêncio.
      ROUTING_ENGINE_URL:   http://routing-engine:3550
      # ⚠️ AUSENTE até 2026-08-25, e a ausência era MUDA. Sem esta linha o bridge
      # caía no default hardcoded `http://localhost:3500` — host errado (dentro do
      # container) E porta errada (3500 é a analytics-api; config-api é 3600) —,
      # então o namespace `session` NUNCA foi lido deste serviço: as seis chaves
      # de TTL editáveis na tela vinham todas do `_DEFAULTS` do código.
      # Todos os outros serviços do compose já tinham a linha; só o bridge não.
      CONFIG_API_URL:       http://config-api:3600
      AGENT_REGISTRY_SERVICE_TOKEN: changeme_agent_registry_service_token_demo   # G-PROBE — RegistrySyncer
      BOOTSTRAP_TENANT_IDS: tenant_demo
      REGISTRY_CONFIG_DIR:  /registry
      SKILLS_DIR:           /skills
      # Provisioning precedence (config-consolidation). Default (vazio) = seed-if-absent:
      # o YAML só semeia DB vazio; depois o DB é a verdade e o syncer NÃO sobrescreve —
      # é o que faz a edição da UI sobreviver ao restart.
      #
      # Consequência (mordeu no S2): **editar um skill_*.yaml já semeado não propaga**.
      # Para o loop de desenvolvimento a partir do arquivo, suba com o YAML vencendo:
      #     REGISTRY_SYNC_RECONCILE=true docker compose -f docker-compose.demo.yml up -d orchestrator-bridge
      # e volte ao default depois (um `up -d` sem a var). Em reconcile o YAML re-aplica
      # skills, pools e deploy-slots por cima do DB — inclusive por cima de edições da UI.
      REGISTRY_SYNC_RECONCILE: ${REGISTRY_SYNC_RECONCILE:-}
      # Fallback legado de resolução de flow (`resolve_flow_for_agent`): sem slot
      # `current` no pool, executa a definição VIVA do skill. Declarado aqui — e
      # VAZIO por defeito — só para poder ser LIGADO numa medição:
      #     ALLOW_LIVE_FLOW_FALLBACK=true docker compose -f docker-compose.demo.yml up -d orchestrator-bridge
      # É a única variável que separa os dois desfechos do Problema 34 no
      # `retencao_humano` (pool sem slot): desligado ⇒ o agente de fila não roda e o
      # segmento fecha em milissegundos; ligado ⇒ roda `skill_fila_v1` e trava no
      # `menu timeout_s:0`. Ligar em produção faz edição de skill vazar sem deploy.
      ALLOW_LIVE_FLOW_FALLBACK: ${ALLOW_LIVE_FLOW_FALLBACK:-}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
      skill-flow-service:
        condition: service_healthy
      # ALW-12 — ACOPLAMENTO DELIBERADO, e ele existe para um defeito FUTURO.
      # O RegistrySyncer publica os 44 skills no boot. Quando a V4 ligar o portão
      # de publish sobre o cadastro, um skill que escreva tag não declarada será
      # RECUSADO — e o syncer `never blocks startup on skill sync errors`
      # (registry_syncer.py:623): a stack subiria com os skills sem publicar e o
      # único sinal seria o contador `skills_errors`.
      #
      # O preço é real e está aceito: falha do seed passa a impedir o bridge de
      # subir. É a troca certa — falha barulhenta de provisionamento contra runtime
      # mudo e quebrado.
      context-map-seed:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - plughub-demo

  # ─── evaluation-api (Arc 6 — quality evaluation platform) ──────────────────
  evaluation-api:

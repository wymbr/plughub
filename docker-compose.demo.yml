#   @copilot (agente_copilot_v1 / pool copilot_sac):
#     - Abra Agent Assist UI no pool retencao_humano
#     - Abra webchat-test.html e conecte ao pool retencao_humano
#     - O agente humano digita "@copilot" → co-pilot entra em standby (agents_only)
#     - "@copilot ativa" → co-pilot analisa contexto e envia sugestão (agents_only)
#     - "@copilot para"  → co-pilot encerra
#
#   agente_auth_ia_v1 (pool auth_ia — fluxo masked PIN):
#     - Abra webchat-test.html e conecte ao pool auth_ia
#     - O agente solicita PIN via campo mascarado (overlay no webchat)
#     - PIN válido: 6 dígitos começando com "1" (ex: 123456)
#     - PIN de teste de falha: 999999

# ─────────────────────────────────────────────────────────────────────────────
# Infra
# ─────────────────────────────────────────────────────────────────────────────

services:

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 6379 pode estar em uso pela infra existente
    command: redis-server --save "" --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - plughub-demo

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"   # 5432 pode estar em uso pela infra existente
    environment:
      POSTGRES_DB: plughub_demo
      POSTGRES_USER: plughub
      POSTGRES_PASSWORD: plughub
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Init scripts run automatically on first start (empty data volume).
      # 01_platform_config.sql creates the platform_config table that config-api needs.
      - ./infra/demo/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plughub -d plughub_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - plughub-demo

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9093:9092"   # 9092 pode estar em uso pela infra existente
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - plughub-demo

  # Cria todos os tópicos Kafka necessários para a demo
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - plughub-demo
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        KAFKA=/opt/kafka/bin/kafka-topics.sh
        BROKER=kafka:29092
        TOPICS="
          conversations.inbound
          conversations.outbound
          conversations.routed
          conversations.queued
          conversations.dequeued
          conversations.abandoned
          conversations.events
          conversations.message_sent
          conversations.session_opened
          conversations.session_closed
          conversations.participants
          agent.lifecycle
          agent.done
          agent.registry.events
          queue.position_updated
          rules.escalation_triggered
          rules.notification_triggered
          rules.session_tagged
          gateway.heartbeat
          mcp.audit
          registry.changed
          config.changed
          evaluation.events
          usage.events
          usage.cycle_reset
          sentiment.updated
          workflow.events
          calendar.events
          collect.events
          journey.events
          agent.events
          session.signals
          calibration.events
          pool.occupancy
        "
        for topic in $$TOPICS; do
          $$KAFKA --bootstrap-server $$BROKER --create --if-not-exists \
            --topic $$topic --partitions 3 --replication-factor 1
          echo "topic $$topic OK"
        done
        echo "All Kafka topics created."
    restart: "no"

# ─────────────────────────────────────────────────────────────────────────────
# Application Services
# ─────────────────────────────────────────────────────────────────────────────

  agent-registry:
    build:
      context: .
      dockerfile: packages/agent-registry/Dockerfile
    ports:
      - "3300:3300"
    environment:
      DATABASE_URL:   postgresql://plughub:plughub@postgres:5432/plughub_demo
      PORT:           "3300"
      JWT_SECRET:     demo_plughub_secret_32chars__
      KAFKA_BROKERS:  kafka:29092
      REDIS_URL:      redis://redis:6379
      CONFIG_API_URL: http://config-api:3600   # item 7a — teto do buffer (queue_max_total)
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3300/v1/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - plughub-demo

  mcp-server-plughub:
    build:
      context: .
      dockerfile: packages/mcp-server-plughub/Dockerfile
    ports:
      - "3100:3100"
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3100"
      JWT_SECRET: demo_plughub_secret_32chars__
      KAFKA_BROKERS: kafka:29092
      AGENT_REGISTRY_URL: http://agent-registry:3300
      ANALYTICS_API_URL: http://analytics-api:3500   # R5 — tool_trace via GET /v1/audit/mcp-calls
      SKILL_FLOW_URL: http://skill-flow-service:3460
      CALENDAR_API_URL: http://calendar-api:3700
      WORKFLOW_API_URL: http://workflow-api:3800
      CONFIG_API_URL: http://config-api:3600   # masking context_rules via HTTP (config-http-propagation arc)
      PLUGHUB_TENANT_ID: tenant_demo
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      agent-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const r=require('http').get('http://localhost:3100/sse');r.on('response',s=>{s.destroy();process.exit(s.statusCode<500?0:1)});r.on('error',()=>process.exit(1));setTimeout(()=>{r.destroy();process.exit(1)},2000)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plughub-demo

  routing-engine:
    build:
      context: .
      dockerfile: packages/routing-engine/Dockerfile
    environment:
      PLUGHUB_REDIS_URL: redis://redis:6379
      PLUGHUB_KAFKA_BROKERS: kafka:29092
      PLUGHUB_AGENT_REGISTRY_URL: http://agent-registry:3300
      # PLUGHUB_INSTANCE_TTL_SECONDS removido (config-consolidation F1.2): tuning não
      # vive em env. instance_ttl_seconds usa o default do código (30s, conforme spec);
      # se precisar ser configurável, vira chave no config-api (não env).
      # Fix (2026-06-05): faltava — o RoutingConfigCache tentava localhost:3600 no
      # boot e caía nos defaults hard-coded (mensagens/limites custom do tenant
      # via Config API não chegavam ao routing até um config.changed bem-sucedido).
      PLUGHUB_CONFIG_API_URL: http://config-api:3600
      PLUGHUB_TENANT_ID: tenant_demo   # GET /config/{ns} exige ?tenant_id=
      # F2 (bancada): faltava — o EvaluationConsumer usava o default
      # localhost:3400 tanto no fallback de load quanto no POST /execute do
      # despacho do avaliador (mesmo padrão do bug do CONFIG_API_URL, 2026-06-05).
      PLUGHUB_SKILL_FLOW_SERVICE_URL: http://skill-flow-service:3460
    volumes:
      # F2 (bancada): o load primário do flow de avaliação é de DISCO
      # (packages/skill-flow-engine/skills/{skill}.yaml) e a imagem só copia o
      # próprio pacote. Mount ro no path que _skills_dir() resolve em /app —
      # mesmo padrão do skill-flow-service (YAML atualiza sem rebuild).
      - ./packages/skill-flow-engine/skills:/app/packages/skill-flow-engine/skills:ro
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      agent-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - plughub-demo
    restart: on-failure

  ai-gateway:
    build:
      context: .
      dockerfile: packages/ai-gateway/Dockerfile
    ports:
      - "3200:3200"
    environment:
      PLUGHUB_REDIS_URL: redis://redis:6379
      PLUGHUB_PORT: "3200"
      PLUGHUB_WORKERS: "1"
      PLUGHUB_ANTHROPIC_API_KEY: ${PLUGHUB_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3200/v1/health', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plughub-demo

  rules-engine:
    build:
      context: .
      dockerfile: packages/rules-engine/Dockerfile
    ports:
      - "3201:3201"
    environment:
      PLUGHUB_REDIS_URL: redis://redis:6379
      PLUGHUB_MCP_SERVER_URL: http://mcp-server-plughub:3100
      PLUGHUB_API_PORT: "3201"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3201/rules?tenant_id=health_probe', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - plughub-demo

  mcp-server-auth:
    build:
      context: packages/mcp-server-auth
      dockerfile: Dockerfile
    ports:
      - "3150:3150"
    environment:
      PORT: "3150"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3150/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - plughub-demo

  skill-flow-service:
    build:
      context: .
      dockerfile: packages/e2e-tests/services/skill-flow-service/Dockerfile
    # Porta interna 3460 — evaluation-api ocupa 3400 externamente
    # Sem mapeamento externo: somente acessível via rede interna plughub-demo
    volumes:
      # Mount skills directory so YAML changes take effect without rebuilding.
      # Changes to skill_*.yaml and agente_*.yaml files are picked up on the
      # next skill-flow-service restart (or orchestrator-bridge restart which
      # re-syncs all skills via RegistrySyncer).
      - ./packages/skill-flow-engine/skills:/app/skills:ro
    environment:
      REDIS_URL: redis://redis:6379
      MCP_SERVER_URL: http://mcp-server-plughub:3100
      MCP_AUTH_URL:   http://mcp-server-auth:3150
      AI_GATEWAY_URL: http://ai-gateway:3200
      CALENDAR_API_URL: http://calendar-api:3700
      CHANNEL_GATEWAY_URL: http://channel-gateway:8010
      PORT: "3460"
      SKILLS_DIR: /app/skills
    depends_on:
      redis:
        condition: service_healthy
      mcp-server-plughub:
        condition: service_healthy
      mcp-server-auth:
        condition: service_healthy
      channel-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3460/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - plughub-demo

  session-replayer:
    build:
      context: .
      dockerfile: packages/session-replayer/Dockerfile
    environment:
      KAFKA_BROKERS:   kafka:29092
      REDIS_URL:       redis://redis:6379
      DATABASE_URL:    postgresql://plughub:plughub@postgres:5432/plughub_demo
      CONFIG_API_URL:  http://config-api:3600
      # S2.2 Slice B: Replayer busca o EvaluationForm da campanha (GET /v1/evaluation/forms/{id})
      # para injetar no ReplayContext. Dentro da rede docker o host é o nome do serviço.
      EVALUATION_API_URL: http://evaluation-api:3400
      PLUGHUB_TENANT_ID: tenant_demo
      # EVALUATOR_POOL / REPLAY_SPEED_FACTOR removidos (config-consolidation item 7b):
      # vêm do config-api namespace `evaluation` (evaluator_pool=avaliacao_ia,
      # replay_speed_factor=10.0), lidos no startup via GET /config/evaluation.
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # item 7b: espera o config-api ficar healthy antes do startup, senão o fetch
      # de config (evaluator_pool, replay_speed, TTLs) corre e cai no default.
      config-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - plughub-demo
    restart: on-failure

  usage-aggregator:
    build:
      context: packages/usage-aggregator
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS:  kafka:29092
      KAFKA_GROUP_ID: usage-aggregator-demo
      REDIS_URL:      redis://redis:6379
      DATABASE_URL:   postgresql://plughub:plughub@postgres:5432/plughub_demo
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - plughub-demo
    restart: on-failure

  auth-api:
    build:
      context: packages/auth-api
      dockerfile: Dockerfile
    ports:
      - "3202:3200"
    volumes:
      # modules.yaml não está no contexto de build (packages/auth-api/).
      # O volume mount torna o arquivo acessível em /infra/modules.yaml dentro
      # do container, que é o path que main.py resolve via seed_modules_from_yaml().
      - ./infra/modules.yaml:/infra/modules.yaml:ro
    environment:
      PLUGHUB_AUTH_DATABASE_URL:        postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_AUTH_JWT_SECRET:          changeme_auth_jwt_secret_demo_32c
      PLUGHUB_AUTH_ADMIN_TOKEN:         changeme_auth_admin_token_demo
      PLUGHUB_AUTH_SEED_ADMIN_EMAIL:    admin@plughub.local
      PLUGHUB_AUTH_SEED_ADMIN_PASSWORD: changeme_admin
      PLUGHUB_AUTH_SEED_TENANT_ID:      tenant_demo
      # Path do modules.yaml montado — override tem prioridade sobre a heurística parents[4]
      # do main.py (que, em layout site-packages, resolveria p/ um path errado → registry vazio).
      PLUGHUB_AUTH_MODULES_YAML:        /infra/modules.yaml
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:3200/health', timeout=3); assert b'ok' in r.read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plughub-demo
    restart: on-failure

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DB:                       plughub_demo
      CLICKHOUSE_USER:                     plughub
      CLICKHOUSE_PASSWORD:                 plughub
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping 2>/dev/null | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - plughub-demo

  analytics-api:
    build:
      context: .
      dockerfile: packages/analytics-api/Dockerfile
    ports:
      - "3500:3500"
    environment:
      PLUGHUB_KAFKA_BROKERS:       kafka:29092
      PLUGHUB_KAFKA_GROUP_ID:      analytics-demo
      PLUGHUB_REDIS_URL:           redis://redis:6379
      PLUGHUB_CLICKHOUSE_HOST:     clickhouse
      PLUGHUB_CLICKHOUSE_PORT:     "8123"
      PLUGHUB_CLICKHOUSE_USER:     plughub
      PLUGHUB_CLICKHOUSE_PASSWORD: plughub
      PLUGHUB_CLICKHOUSE_DATABASE: plughub_demo
      PLUGHUB_ADMIN_JWT_SECRET:    demo_analytics_admin_secret
      PLUGHUB_ANALYTICS_OPEN_ACCESS: "true"   # bypass JWT auth in demo — dashboard accessible without token
      PLUGHUB_PRICING_API_URL:     http://pricing-api:3900   # Fase 2 Pools — teto configurado do total (fallback gracioso p/ provisionada)
      PLUGHUB_AGENT_REGISTRY_URL:  http://agent-registry:3300   # Arc 6 Fase 2 — lente deploy lê skill_deployments (markers); indisponível → série sem markers
      PLUGHUB_CONFIG_API_URL:      http://config-api:3600   # R8b — limiar de divergência + N mínimo (namespace evaluation)
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3500/v1/health', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plughub-demo


  config-api:
    build:
      context: .
      dockerfile: packages/config-api/Dockerfile
    ports:
      - "3600:3600"
    environment:
      PLUGHUB_CONFIG_DATABASE_URL:  postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_CONFIG_REDIS_URL:     redis://redis:6379
      PLUGHUB_CONFIG_ADMIN_TOKEN:   demo_config_admin_token
      PLUGHUB_CONFIG_KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3600/v1/health', timeout=5)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 60s
    restart: on-failure
    networks:
      - plughub-demo

  config-seed:
    build:
      context: .
      dockerfile: packages/config-api/Dockerfile
    environment:
      PLUGHUB_CONFIG_DATABASE_URL: postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_CONFIG_REDIS_URL:    redis://redis:6379
    command: ["plughub-config-seed"]
    depends_on:
      config-api:
        condition: service_healthy
    networks:
      - plughub-demo
    restart: "no"

  # demo-seed REMOVIDO (config-consolidation F1.1b, 2026-06-11): provisionamento de
  # pools/channel_endpoints é via RegistrySyncer (orchestrator-bridge) a partir de
  # infra/registry/tenant_demo.yaml. agent_types entidade aposentada; Redis derivado
  # do routing-engine via registry.changed. Ver docs/arcos/config-consolidation.md.

  # Recursos contratados do demo (capacity-governance item 6) — coerentes com
  # os deploys do tenant_demo.yaml: ai_agent×300 + human_agent×10 → C=310.
  # Não-destrutivo: pula se o tenant já tiver resources (ajustes preservados).
  pricing-seed:
    image: python:3.11-slim
    volumes:
      - ./infra/seed:/seed:ro
    environment:
      PRICING_API_URL:     http://pricing-api:3900
      PRICING_ADMIN_TOKEN: demo_pricing_admin_token
      TENANT_ID:           tenant_demo
      SEED_MAX_WAIT:       "120"
    command: ["python", "/seed/seed_pricing.py"]
    depends_on:
      pricing-api:
        condition: service_healthy
    networks:
      - plughub-demo
    restart: "no"

  # Cria usuários demo no auth-api com module_config (ABAC).
  # supervisor@plughub.local — pode revisar avaliações + ver analytics
  # operator@plughub.local   — pode contestar avaliações + ver analytics
  auth-seed:
    image: python:3.11-slim
    volumes:
      - ./infra/seed:/seed:ro
    environment:
      AUTH_API_URL:       http://auth-api:3200
      AUTH_ADMIN_TOKEN:   changeme_auth_admin_token_demo
      TENANT_ID:          tenant_demo
      SEED_MAX_WAIT:      "120"
    command: ["python", "/seed/seed_auth.py"]
    depends_on:
      auth-api:
        condition: service_healthy
    networks:
      - plughub-demo
    restart: "no"

  # Cria formulário e campanha de avaliação demo.
  # Formulário "SAC Padrão" com 4 critérios.
  # Campanha "Demo SAC — Avaliação Contínua" com skill_revisao_simples_v1.
  eval-seed:
    image: python:3.11-slim
    volumes:
      - ./infra/seed:/seed:ro
    environment:
      EVALUATION_API_URL: http://evaluation-api:3400
      AUTH_ADMIN_TOKEN:   changeme_eval_admin_token_demo
      TENANT_ID:          tenant_demo
      SEED_MAX_WAIT:      "120"
    command: ["python", "/seed/seed_evaluation.py"]
    depends_on:
      evaluation-api:
        condition: service_healthy
    networks:
      - plughub-demo
    restart: "no"

  pricing-api:
    build:
      context: .
      dockerfile: packages/pricing-api/Dockerfile
    ports:
      - "3900:3900"
    environment:
      PLUGHUB_PRICING_DATABASE_URL:    postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_PRICING_CONFIG_API_URL:  http://config-api:3600
      PLUGHUB_PRICING_ADMIN_TOKEN:     demo_pricing_admin_token
      PLUGHUB_PRICING_REDIS_URL:       redis://redis:6379   # quota sync — {t}:quota:max_concurrent_sessions
    depends_on:
      postgres:
        condition: service_healthy
      config-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3900/health', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
    networks:
      - plughub-demo

  # ─── MinIO — S3-compatible object storage (sem custo, roda localmente) ────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console web → http://localhost:9001 (plughub / plughub123)
    environment:
      MINIO_ROOT_USER:     plughub
      MINIO_ROOT_PASSWORD: plughub123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - plughub-demo

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 plughub plughub123 &&
        mc mb --ignore-existing local/plughub-attachments &&
        echo 'MinIO bucket plughub-attachments criado.' &&
        exit 0
      "
    networks:
      - plughub-demo

  channel-gateway:
    build:
      context: .
      dockerfile: packages/channel-gateway/Dockerfile
    ports:
      - "8010:8010"
    environment:
      PLUGHUB_KAFKA_BROKERS:              kafka:29092
      PLUGHUB_REDIS_URL:                  redis://redis:6379
      PLUGHUB_JWT_SECRET:                 changeme_32chars_webchat_secret!
      PLUGHUB_CONFIG_API_URL:             http://config-api:3600
      # auth_timeout_s (F2-TTL) e attachment_expiry_days (F1.2) vêm do config-api via
      # WebchatConfigCache HTTP (config-http-propagation arc): GET /config/webchat +
      # invalidação config.changed. Os envs PLUGHUB_WS_AUTH_TIMEOUT_S /
      # PLUGHUB_ATTACHMENT_EXPIRY_DAYS continuam removidos (default no código é fallback).
      PLUGHUB_DATABASE_URL:               postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_WEBCHAT_SERVING_BASE_URL:   http://localhost:8010/webchat/v1/attachments
      PLUGHUB_WEBCHAT_UPLOAD_BASE_URL:    http://localhost:8010/webchat/v1/upload
      PLUGHUB_TENANT_ID:                  tenant_demo
      PLUGHUB_KAFKA_TOPIC_INBOUND:        conversations.inbound
      PLUGHUB_KAFKA_TOPIC_OUTBOUND:       conversations.outbound
      PLUGHUB_KAFKA_TOPIC_EVENTS:         conversations.events
      # S3/MinIO storage backend (fase 2)
      PLUGHUB_ATTACHMENT_STORE_TYPE:      s3
      PLUGHUB_S3_ENDPOINT_URL:            http://minio:9000
      PLUGHUB_S3_BUCKET:                  plughub-attachments
      PLUGHUB_S3_ACCESS_KEY:              plughub
      PLUGHUB_S3_SECRET_KEY:              plughub123
      PLUGHUB_S3_REGION:                  us-east-1
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plughub-demo

  calendar-api:
    build:
      context: .
      dockerfile: packages/calendar-api/Dockerfile
    ports:
      - "3700:3700"
    environment:
      PLUGHUB_CALENDAR_DATABASE_URL:  postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_CALENDAR_REDIS_URL:     redis://redis:6379
      PLUGHUB_CALENDAR_KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3700/v1/health', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
    networks:
      - plughub-demo

  workflow-api:
    build:
      context: packages/workflow-api
      dockerfile: Dockerfile
    ports:
      - "3800:3800"
    environment:
      PLUGHUB_WORKFLOW_DATABASE_URL:     postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_WORKFLOW_REDIS_URL:        redis://redis:6379
      PLUGHUB_WORKFLOW_KAFKA_BROKERS:    kafka:29092
      PLUGHUB_WORKFLOW_KAFKA_TOPIC:      workflow.events
      PLUGHUB_WORKFLOW_COLLECT_TOPIC:    collect.events
      PLUGHUB_WORKFLOW_JOURNEY_TOPIC:    journey.events
      PLUGHUB_WORKFLOW_CALENDAR_API_URL:      http://calendar-api:3700
      PLUGHUB_WORKFLOW_AGENT_REGISTRY_URL:   http://agent-registry:3300
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      calendar-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3800/v1/health', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
    networks:
      - plughub-demo

  skill-flow-worker:
    build:
      context: .
      dockerfile: packages/skill-flow-worker/Dockerfile
    environment:
      KAFKA_BROKERS:    kafka:29092
      REDIS_URL:        redis://redis:6379
      WORKFLOW_API_URL: http://workflow-api:3800
      MCP_SERVER_URL:   http://mcp-server-plughub:3100
      AI_GATEWAY_URL:   http://ai-gateway:3200
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      workflow-api:
        condition: service_healthy
      mcp-server-plughub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    networks:
      - plughub-demo

  # Orchestrator Bridge — consumes conversations.routed from Kafka and publishes
  # conversation.assigned to Redis pub/sub pool:events:{poolId}.
  # Required for human agents: without this service, routed contacts never appear
  # in the Agent Assist UI.
  orchestrator-bridge:
    build:
      context: .
      dockerfile: packages/orchestrator-bridge/Dockerfile
    volumes:
      # Declarative registry config — RegistrySyncer reads this at startup and
      # upserts pools + agent types into the Agent Registry automatically.
      # No external seed script needed for a fresh environment.
      - ./infra/registry:/registry:ro
      # Skill YAMLs — mounted so RegistrySyncer picks up changes without rebuild.
      # Restart orchestrator-bridge after editing any skill_*.yaml or agente_*.yaml.
      - ./packages/skill-flow-engine/skills:/skills:ro
    environment:
      KAFKA_BROKERS:        kafka:29092
      REDIS_URL:            redis://redis:6379
      SKILL_FLOW_URL:       http://skill-flow-service:3460
      AGENT_REGISTRY_URL:   http://agent-registry:3300
      BOOTSTRAP_TENANT_IDS: tenant_demo
      REGISTRY_CONFIG_DIR:  /registry
      SKILLS_DIR:           /skills
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
      skill-flow-service:
        condition: service_healthy
    restart: on-failure
    networks:
      - plughub-demo

  # ─── evaluation-api (Arc 6 — quality evaluation platform) ──────────────────
  evaluation-api:
    build:
      context: .
      dockerfile: packages/evaluation-api/Dockerfile
    ports:
      - "3400:3400"
    environment:
      PLUGHUB_EVALUATION_DATABASE_URL:        postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_EVALUATION_REDIS_URL:           redis://redis:6379
      PLUGHUB_EVALUATION_KAFKA_BROKERS:       kafka:29092
      PLUGHUB_EVALUATION_ADMIN_TOKEN:         changeme_eval_admin_token_demo
      PLUGHUB_EVALUATION_JWT_SECRET:          changeme_auth_jwt_secret_demo_32c
      PLUGHUB_EVALUATION_CALENDAR_API_URL:    http://calendar-api:3700
      PLUGHUB_EVALUATION_WORKFLOW_API_URL:    http://workflow-api:3800
      PLUGHUB_EVALUATION_SESSION_REPLAYER_URL: http://mcp-server-plughub:3100
      PLUGHUB_EVALUATION_ANALYTICS_API_URL:   http://analytics-api:3500
      PLUGHUB_EVALUATION_AGENT_REGISTRY_URL:  http://agent-registry:3300   # R9d — resolve deploy_version por flow_id
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3400/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
    networks:
      - plughub-demo

  # ─── mcp-server-knowledge (Arc 6 — RAG knowledge base) ──────────────────
  mcp-server-knowledge:
    build:
      context: .
      dockerfile: packages/mcp-server-knowledge/Dockerfile
    ports:
      - "3401:3401"
    environment:
      PORT:             "3401"
      DATABASE_URL:     postgresql://plughub:plughub@postgres:5432/plughub_demo
      ADMIN_TOKEN:      changeme_knowledge_admin_token_demo
      # EMBEDDING_PROVIDER: openai       # descomente para habilitar embeddings reais
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3401/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure
    networks:
      - plughub-demo

  # ─── platform-ui (shell unificado — porta 5174) ──────────────────────────
  #   http://localhost:5174/login          ← login com credenciais reais (auth-api)
  #   http://localhost:5174/monitor        ← monitor operacional
  #   http://localhost:5174/agent-assist   ← agent assist integrado
  #   http://localhost:5174/evaluation     ← plataforma de avaliação Arc 6
  #   http://localhost:5174/config/billing ← faturamento Arc 2
  platform-ui:
    build:
      context: .
      dockerfile: packages/platform-ui/Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      auth-api:
        condition: service_healthy
      mcp-server-plughub:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
      analytics-api:
        condition: service_healthy
      config-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
    networks:
      - plughub-demo

  agent-assist-ui:
    build:
      context: .
      dockerfile: packages/agent-assist-ui/Dockerfile
    ports:
      - "5173:5173"
    environment:
      # VITE_DEFAULT_POOL removido (config-consolidation item 7a): env morto — não é
      # lido em lugar nenhum (agent-assist-ui usa só VITE_MCP_WS_URL/VITE_ANALYTICS_URL/
      # VITE_TENANT_ID; a unificação no platform-ui não consome esse default).
      VITE_TENANT_ID:      tenant_demo
    depends_on:
      mcp-server-plughub:
        condition: service_healthy
      analytics-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - plughub-demo

# ─────────────────────────────────────────────────────────────────────────────
# Observability
# ─────────────────────────────────────────────────────────────────────────────

  # Kafdrop  (Kafka UI):         http://localhost:9002
  # NOTA: kafdrop 4.x tem incompatibilidade com Kafka 3.7 KRaft (kafkaHighLevelConsumer
  # falha no init). Usamos 3.31.0 que funciona corretamente com Kafka 3.x.
  kafdrop:
    image: obsidiandynamics/kafdrop:3.31.0
    ports:
      - "9002:9000"   # 9000/9001 podem estar em uso pela infra existente
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXTPATH: "/"
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - plughub-demo

  # Redis Commander — Redis UI. Acesse: http://localhost:8081
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - plughub-demo

# ─────────────────────────────────────────────────────────────────────────────
# E2E Test Runner — executa os cenários e encerra
# ─────────────────────────────────────────────────────────────────────────────

  e2e-runner:
    build:
      context: .
      dockerfile: packages/e2e-tests/Dockerfile
    environment:
      MCP_SERVER_URL:           http://mcp-server-plughub:3100
      AGENT_REGISTRY_URL:       http://agent-registry:3300
      SKILL_FLOW_URL:           http://skill-flow-service:3460
      RULES_ENGINE_URL:         http://rules-engine:3201
      AI_GATEWAY_URL:           http://ai-gateway:3200
      AUTH_API_URL:             http://auth-api:3200
      EVALUATION_API_URL:       http://evaluation-api:3400
      CHANNEL_GATEWAY_WS_URL:   ws://channel-gateway:8010
      CHANNEL_GATEWAY_HTTP_URL: http://channel-gateway:8010
      WORKFLOW_API_URL:         http://workflow-api:3800
      CALENDAR_API_URL:         http://calendar-api:3700
      ANALYTICS_API_URL:        http://analytics-api:3500
      REDIS_URL:                redis://redis:6379
      KAFKA_BROKERS:            kafka:29092
      TENANT_ID:                tenant_demo
      JWT_SECRET:               demo_plughub_secret_32chars__
      AUTH_JWT_SECRET:          changeme_auth_jwt_secret_demo_32c
      AUTH_ADMIN_TOKEN:         changeme_auth_admin_token_demo
      EVAL_ADMIN_TOKEN:         changeme_eval_admin_token_demo
      E2E_REPORT_PATH:          /app/e2e-report.json
      # E2E_EXTRA_ARGS exemplos:
      #   --demo              cenários 01–14 (padrão)
      #   --evaluation        Arc 6: cenários 01–04 + 24 + 25
      #   --permissions       Arc 6 v2: cenário 27 (ABAC permissions)
      #   --workflow-review   Arc 6 v2: cenário 28 (review/contestation workflow cycle)
      #   --hooks             Arc 5 hooks: cenário 22
      #   --segments          Arc 5 segments: cenário 23
      #   --conference, --webchat, --workflow, --collect, --ctx
      E2E_EXTRA_ARGS:           ${E2E_EXTRA_ARGS:---demo}
    depends_on:
      mcp-server-plughub:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
      routing-engine:
        condition: service_healthy
      skill-flow-service:
        condition: service_healthy
      rules-engine:
        condition: service_healthy
      channel-gateway:
        condition: service_healthy
      workflow-api:
        condition: service_healthy
      analytics-api:
        condition: service_healthy
      evaluation-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
    networks:
      - plughub-demo
    restart: "no"

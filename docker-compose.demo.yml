#   @copilot (agente_copilot_v1 / pool copilot_sac):
#     - Abra Agent Assist UI no pool retencao_humano
#     - Abra webchat-test.html e conecte ao pool retencao_humano
#     - O agente humano digita "@copilot" → co-pilot entra em standby (agents_only)
#     - "@copilot ativa" → co-pilot analisa contexto e envia sugestão (agents_only)
#     - "@copilot para"  → co-pilot encerra
#
#   agente_auth_ia_v1 (pool auth_ia — fluxo masked PIN):
#     - Abra webchat-test.html e conecte ao pool auth_ia
#     - O agente solicita PIN via campo mascarado (overlay no webchat)
#     - PIN válido: 6 dígitos começando com "1" (ex: 123456)
#     - PIN de teste de falha: 999999

# ─────────────────────────────────────────────────────────────────────────────
# Infra
# ─────────────────────────────────────────────────────────────────────────────

services:

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 6379 pode estar em uso pela infra existente
    command: redis-server --save "" --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - plughub-demo

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"   # 5432 pode estar em uso pela infra existente
    environment:
      POSTGRES_DB: plughub_demo
      POSTGRES_USER: plughub
      POSTGRES_PASSWORD: plughub
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Init scripts run automatically on first start (empty data volume).
      # 01_platform_config.sql creates the platform_config table that config-api needs.
      - ./infra/demo/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plughub -d plughub_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - plughub-demo

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9093:9092"   # 9092 pode estar em uso pela infra existente
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - plughub-demo

  # Cria todos os tópicos Kafka necessários para a demo
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - plughub-demo
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        KAFKA=/opt/kafka/bin/kafka-topics.sh
        BROKER=kafka:29092
        TOPICS="
          conversations.inbound
          conversations.outbound
          conversations.routed
          conversations.queued
          conversations.dequeued
          conversations.abandoned
          conversations.events
          conversations.message_sent
          conversations.session_opened
          conversations.session_closed
          conversations.participants
          agent.lifecycle
          agent.registry.events
          queue.position_updated
          rules.escalation_triggered
          rules.notification_triggered
          rules.session_tagged
          gateway.heartbeat
          mcp.audit
          registry.changed
          config.changed
          evaluation.events
          usage.events
          usage.cycle_reset
          sentiment.updated
          workflow.events
          calendar.events
          collect.events
          journey.merges
          agent.events
          session.signals
          calibration.events
          pool.occupancy
        "
        for topic in $$TOPICS; do
          $$KAFKA --bootstrap-server $$BROKER --create --if-not-exists \
            --topic $$topic --partitions 3 --replication-factor 1
          echo "topic $$topic OK"
        done
        echo "All Kafka topics created."
    restart: "no"

# ─────────────────────────────────────────────────────────────────────────────
# Application Services
# ─────────────────────────────────────────────────────────────────────────────

  agent-registry:
    build:
      context: .
      dockerfile: packages/agent-registry/Dockerfile
    ports:
      - "3300:3300"
    environment:
      # ISOLADO em banco próprio: o agent-registry roda `prisma db push --accept-data-loss`
      # no boot, que DROPA tabelas do schema public fora do seu Prisma (config-api
      # platform_config, auth, calendar, …). Apontá-lo a um DB dedicado impede o clobber
      # do plughub_demo. (Ver TODO: agent-registry db push clobbera tabelas de outros serviços.)
      DATABASE_URL:   postgresql://plughub:plughub@postgres:5432/plughub_registry
      PORT:           "3300"
      JWT_SECRET:     demo_plughub_secret_32chars__
      # G-PROBE platform-wide: gate dual das mutações de config (pools/skills/channels/
      # channel-endpoints). PLUGHUB_JWT_SECRET valida o Bearer da UI (= segredo da auth-api);
      # AGENT_REGISTRY_SERVICE_TOKEN é a credencial dos callers internos (RegistrySyncer/deploy).
      PLUGHUB_JWT_SECRET:           changeme_auth_jwt_secret_demo_32c
      AGENT_REGISTRY_SERVICE_TOKEN: changeme_agent_registry_service_token_demo
      # sessões vivas antes do deploy; sem isto ele devolve 0 em silêncio).
      # ⚠️ Esta URL FALTAVA, e sem ela o `handoff-status` nunca funcionou neste
      # deploy: o default do código é `http://localhost:3500`, que dentro do
      # container é ele mesmo. O `catch {}` engolia o `fetch failed` e devolvia
      # `active_sessions: 0` — medido em 2026-08-30, a resposta certa era 23.
      # Defeito ANTERIOR ao fechamento de credencial de 2026-08-29, e mais grave:
      # é o endpoint que existe para decidir se um deploy é seguro.
      ANALYTICS_API_URL: http://analytics-api:3500
      ANALYTICS_SERVICE_TOKEN: changeme_analytics_service_token_demo
      KAFKA_BROKERS:  kafka:29092
      REDIS_URL:      redis://redis:6379
      CONFIG_API_URL: http://config-api:3600   # item 7a — teto do buffer (queue_max_total)
      # F4b — rollup de capacidade ESCOPADO ao domínio de pools do usuário. A
      # deduplicação por instância distinta não projeta sobre um subconjunto depois de
      # agregada, então a conta restrita é refeita no engine (dono da regra) em vez de
      # reimplementada aqui. Indisponível → capacity_unavailable, nunca Σ das linhas.
      ROUTING_ENGINE_URL: http://routing-engine:3550
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3300/v1/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - plughub-demo

  mcp-server-plughub:
    build:
      context: .
      dockerfile: packages/mcp-server-plughub/Dockerfile
    # ── CAP-13 (2026-09-01): a 3100 escuta em LOOPBACK, não em toda interface ────
    # `"3100:3100"` faz o Docker publicar em `0.0.0.0`, e isso NÃO é teórico: medido
    # nesta máquina, `Test-NetConnection 192.168.1.124:3100` respondia **ACEITA** —
    # qualquer aparelho no mesmo Wi-Fi alcançava a porta. O que há atrás dela é o
    # transporte MCP (`/sse`), que é **anônimo por construção** e serve as 72 tools no
    # `tools/list`, das quais 48 não verificam credencial nenhuma (CAP-09) — e o
    # `agent_login` é AUTO-SERVIÇO: quem alcança a porta cunha um `session_token`
    # assinado nomeando qualquer `skill_id`.
    #
    # ⚠️ A borda NÃO é substituto disto. Ela não publica `/sse` (medido: pela 5174 o
    # `/sse` devolve `text/html`, o fallback SPA), então fechar a porta não move a
    # exposição para a 5174 — ela some. Foi por isso que a CAP-12 (rotas `/api/*`) veio
    # ANTES: aquelas continuavam expostas pela borda com esta porta fechada, e portanto
    # topologia nunca as alcançaria.
    #
    # Nenhum contêiner precisa desta publicação — todos falam por nome de serviço
    # (`mcp-server-plughub:3100`), inclusive o nginx do platform-ui. Quem precisa é o
    # HOST, e só em desenvolvimento: o proxy do `vite.config.ts`, a suíte e2e
    # (`MCP_SERVER_URL`) e os probes de `infra/test/` — todos usando `localhost`, que
    # o loopback continua servindo.
    #
    # ⚠️ Este é um PASSO INTERMEDIÁRIO, decidido em 2026-09-01. Eliminar a publicação
    # de vez exige mover os probes para dentro da rede do compose; e se o alvo virar
    # deploy DISTRIBUÍDO, a porta volta a ser necessária e a resposta deixa de ser
    # topologia — vira autenticação de transporte (o padrão já existe na casa:
    # `MCP_INTERNAL_SERVICE_TOKEN`, falhando FECHADO). Ver `pending.md` CAP-13.
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3100"
      # ⚠️ DOIS segredos, emissores DIFERENTES — os nomes convidam ao erro:
      #
      #   JWT_SECRET          → token de AGENTE (`session_token` do agent_login),
      #                         emitido e verificado pelo próprio mcp-server.
      #   PLUGHUB_JWT_SECRET  → Bearer da UI, emitido pela AUTH-API. Tem de ser o MESMO
      #                         valor do `PLUGHUB_AUTH_JWT_SECRET` dos demais serviços.
      JWT_SECRET: demo_plughub_secret_32chars__
      # Ligado em 2026-08-03. Sem ele, `verifyJwtPayload` caía no fallback de
      # desenvolvimento — decodifica o payload SEM verificar assinatura — e isso valia
      # para TODAS as rotas de UI do BFF, inclusive os gates `supervisor|admin`
      # (`/api/force-complete`, `/api/work_queue/expire`). Duas consequências, e a
      # segunda é a que passava despercebida:
      #   1. assinatura forjada era aceita → qualquer um podia se declarar admin;
      #   2. o decode-only **nem olha `exp`** → token EXPIRADO seguia válido para
      #      sempre, o que anula o TTL de 1 h do access token.
      # O gate era de intenção, não de autenticação.
      PLUGHUB_JWT_SECRET: changeme_auth_jwt_secret_demo_32c   # == auth-api
      KAFKA_BROKERS: kafka:29092
      AGENT_REGISTRY_URL: http://agent-registry:3300
      ANALYTICS_API_URL: http://analytics-api:3500   # R5 — tool_trace via GET /v1/audit/mcp-calls
      EVALUATION_API_URL: http://evaluation-api:3400   # G-PROBE fase 2 — base p/ pre-review
      PLUGHUB_EVALUATION_SERVICE_TOKEN: changeme_eval_service_token_demo   # G-PROBE fase 2 — credencial de serviço
      AGENT_REGISTRY_SERVICE_TOKEN: changeme_agent_registry_service_token_demo   # G-PROBE — skill_deploy (deploy.ts)
      # F5 — credencial do `POST /internal/context-snapshot`, que devolve o ctx
      # MASCARADO de uma sessão ao ContextStorePersister. Ausente ⇒ o endpoint
      # RECUSA (503) e loga; nunca fica aberto por env não setado. DEVE casar com o
      # MCP_INTERNAL_SERVICE_TOKEN do session-replayer.
      MCP_INTERNAL_SERVICE_TOKEN: changeme_mcp_internal_service_token_demo
      SKILL_FLOW_URL: http://skill-flow-service:3460
      CALENDAR_API_URL: http://calendar-api:3700
      WORKFLOW_API_URL: http://workflow-api:3800
      DIALOG_API_URL: http://dialog-api:3760   # dialog primitive — form_get (survey + OTP)
      MAILING_API_URL: http://mailing-api:3660   # outbound Fase 1 — mailing_add/campaign_drain/campaign_delivery_result
      CONFIG_API_URL: http://config-api:3600   # masking context_rules via HTTP (config-http-propagation arc)
      CHANNEL_GATEWAY_URL: http://channel-gateway:8010   # I5 — gatilho de supervisor retoma a workflow pelo ingress do gateway
      PLUGHUB_TENANT_ID: tenant_demo
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      agent-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const r=require('http').get('http://localhost:3100/sse');r.on('response',s=>{s.destroy();process.exit(s.statusCode<500?0:1)});r.on('error',()=>process.exit(1));setTimeout(()=>{r.destroy();process.exit(1)},2000)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plughub-demo
    restart: on-failure   # sem política, perder a corrida de arranque some sem erro

  routing-engine:
    build:
      context: .
      dockerfile: packages/routing-engine/Dockerfile
    environment:
      PLUGHUB_REDIS_URL: redis://redis:6379
      PLUGHUB_KAFKA_BROKERS: kafka:29092
      PLUGHUB_AGENT_REGISTRY_URL: http://agent-registry:3300
      # PLUGHUB_INSTANCE_TTL_SECONDS removido (config-consolidation F1.2): tuning não
      # vive em env. instance_ttl_seconds usa o default do código (30s, conforme spec);
      # se precisar ser configurável, vira chave no config-api (não env).
      # Fix (2026-06-05): faltava — o RoutingConfigCache tentava localhost:3600 no
      # boot e caía nos defaults hard-coded (mensagens/limites custom do tenant
      # via Config API não chegavam ao routing até um config.changed bem-sucedido).
      PLUGHUB_CONFIG_API_URL: http://config-api:3600
      PLUGHUB_TENANT_ID: tenant_demo   # GET /config/{ns} exige ?tenant_id=
      # F2 (bancada): faltava — o EvaluationConsumer usava o default
      # localhost:3400 tanto no fallback de load quanto no POST /execute do
      # despacho do avaliador (mesmo padrão do bug do CONFIG_API_URL, 2026-06-05).
      PLUGHUB_SKILL_FLOW_SERVICE_URL: http://skill-flow-service:3460
    volumes:
      # F2 (bancada): o load primário do flow de avaliação é de DISCO
      # (packages/skill-flow-engine/skills/{skill}.yaml) e a imagem só copia o
      # próprio pacote. Mount ro no path que _skills_dir() resolve em /app —
      # mesmo padrão do skill-flow-service (YAML atualiza sem rebuild).
      - ./packages/skill-flow-engine/skills:/app/packages/skill-flow-engine/skills:ro
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      agent-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - plughub-demo
    restart: on-failure

  ai-gateway:
    build:
      context: .
      dockerfile: packages/ai-gateway/Dockerfile
    ports:
      - "3200:3200"
    # A credencial de LLM entra por AQUI, e não pelo bloco `environment:` abaixo.
    # Motivo (medido 2026-08-24): `environment:` vence `env_file:`, e a linha antiga
    #   PLUGHUB_ANTHROPIC_API_KEY: ${PLUGHUB_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}
    # interpolava da SHELL de quem rodou o `up -d`. Uma chave exportada e revogada no
    # perfil do host vencia em silêncio o valor do `.env.demo`, e o sintoma era
    # "a chave do arquivo é inválida" — quando o arquivo nem estava sendo lido.
    # Estado da shell não é entrada declarada; `.env.demo` (gitignored) é.
    env_file:
      - .env.demo
    environment:
      PLUGHUB_REDIS_URL: redis://redis:6379
      PLUGHUB_PORT: "3200"
      PLUGHUB_WORKERS: "1"
      # ── Broker (T1, 2026-08-28) — o ai-gateway era o ÚNICO serviço sem esta linha.
      # Sem ela ele caía no default hardcoded `kafka:9092` (config.py:78), que é o
      # listener PLAINTEXT — e ele ANUNCIA `localhost:9093` (linha 464 deste arquivo).
      # O produtor conectava, recebia metadata apontando para um endereço que não
      # existe dentro do container, e o `send` BLOQUEAVA em vez de levantar.
      # Consequência medida: nenhuma publicação do gateway jamais chegou ao Kafka
      # neste ambiente — inclusive `sentiment.updated`, cujos 40 s de bloqueio o
      # CLAUDE.md registrava como "broker momentaneamente inalcançável". Não era
      # momentâneo: era fiação. Outros 19 serviços já usam `kafka:29092`.
      PLUGHUB_KAFKA_BROKERS: kafka:29092
      # LLM Accounts — catalog fetch (namespace llm_accounts); graceful fallback to
      # PLUGHUB_ANTHROPIC_API_KEY above when the catalog is empty/unreachable.
      PLUGHUB_CONFIG_API_URL: http://config-api:3600
      PLUGHUB_TENANT_ID: tenant_demo
      # Sonda de credencial no boot: uma chamada mínima por conta, uma vez por
      # start. `false` para subir offline — e nesse caso o /v1/health reporta
      # `unknown`, nunca `ok`.
      PLUGHUB_LLM_BOOT_PROBE: "${PLUGHUB_LLM_BOOT_PROBE:-true}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # `urlopen` levanta em 4xx/5xx, então o 503 do /v1/health (credencial
      # configurada e RECUSADA pelo provedor, ou redis fora) marca o container
      # unhealthy — que é o ponto: até 2026-08-23 este serviço ficava verde no
      # `docker ps` durante 124 recusas seguidas de credencial.
      # Chave AUSENTE não reprova (200 `degraded`): rodar a demo sem LLM é escolha
      # legítima. Chave PRESENTE e recusada reprova: alguém pretendia ter LLM.
      # Nenhum serviço tem `depends_on: ai-gateway`, logo isto não bloqueia o boot.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3200/v1/health', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plughub-demo

  rules-engine:
    build:
      context: .
      dockerfile: packages/rules-engine/Dockerfile
    ports:
      - "3201:3201"
    environment:
      PLUGHUB_REDIS_URL: redis://redis:6379
      PLUGHUB_MCP_SERVER_URL: http://mcp-server-plughub:3100
      PLUGHUB_API_PORT: "3201"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3201/rules?tenant_id=health_probe', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - plughub-demo

  mcp-server-auth:
    build:
      context: packages/mcp-server-auth
      dockerfile: Dockerfile
    ports:
      - "3150:3150"
    environment:
      PORT: "3150"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3150/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - plughub-demo
    restart: on-failure   # sem política, perder a corrida de arranque some sem erro

  skill-flow-service:
    build:
      context: .
      dockerfile: packages/e2e-tests/services/skill-flow-service/Dockerfile
    # Porta interna 3460 — evaluation-api ocupa 3400 externamente
    # Sem mapeamento externo: somente acessível via rede interna plughub-demo
    volumes:
      # Mount skills directory so YAML changes take effect without rebuilding.
      # Changes to skill_*.yaml and agente_*.yaml files are picked up on the
      # next skill-flow-service restart (or orchestrator-bridge restart which
      # re-syncs all skills via RegistrySyncer).
      - ./packages/skill-flow-engine/skills:/app/skills:ro
    environment:
      REDIS_URL: redis://redis:6379
      MCP_SERVER_URL: http://mcp-server-plughub:3100
      MCP_AUTH_URL:   http://mcp-server-auth:3150
      # CTX-02 — sem esta env a AUDITORIA DE PLATEIA nao roda, e o censo de
      # runtime sai VAZIO (que nao e o mesmo que zero achados). E a primeira das
      # tres camadas que o CLAUDE.md documenta para o bridge: env ausente, porta
      # errada no default, e GET sem tenant_id. As tres degradam para "usa o
      # default", e consertar a de cima nao move o numero.
      CONFIG_API_URL: http://config-api:3600
      AI_GATEWAY_URL: http://ai-gateway:3200
      CALENDAR_API_URL: http://calendar-api:3700
      CHANNEL_GATEWAY_URL: http://channel-gateway:8010
      PORT: "3460"
      SKILLS_DIR: /app/skills
    depends_on:
      redis:
        condition: service_healthy
      mcp-server-plughub:
        condition: service_healthy
      mcp-server-auth:
        condition: service_healthy
      channel-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3460/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - plughub-demo
    restart: on-failure   # sem política, perder a corrida de arranque some sem erro

  session-replayer:
    build:
      context: .
      dockerfile: packages/session-replayer/Dockerfile
    environment:
      KAFKA_BROKERS:   kafka:29092
      REDIS_URL:       redis://redis:6379
      DATABASE_URL:    postgresql://plughub:plughub@postgres:5432/plughub_demo
      CONFIG_API_URL:  http://config-api:3600
      # S2.2 Slice B: Replayer busca o EvaluationForm da campanha (GET /v1/evaluation/forms/{id})
      # para injetar no ReplayContext. Dentro da rede docker o host é o nome do serviço.
      EVALUATION_API_URL: http://evaluation-api:3400
      PLUGHUB_TENANT_ID: tenant_demo
      # EVALUATOR_POOL / REPLAY_SPEED_FACTOR removidos (config-consolidation item 7b):
      # vêm do config-api namespace `evaluation` (evaluator_pool=avaliacao_ia,
      # replay_speed_factor=10.0), lidos no startup via GET /config/evaluation.
      # F5 — ContextStorePersister: pede o ctx MASCARADO ao mcp-server, porque o
      # masking existe só lá. DEVE casar com o MCP_INTERNAL_SERVICE_TOKEN do
      # mcp-server; divergir faz o persister receber 401 e gravar ZERO linhas.
      # ⚠️ O serviço chama-se `mcp-server-plughub` — `mcp-server` NÃO resolve.
      # A grafia certa já era a convenção em quatro serviços (751, 801, 1454, 1784);
      # esta linha nasceu com a quinta e o sintoma foi `Name or service not known`
      # a cada fechamento de sessão. Duas grafias da mesma coisa é o defeito de
      # sempre — aqui não ficou mudo só porque o `except` nomeia o motivo.
      MCP_SERVER_URL:             http://mcp-server-plughub:3100
      MCP_INTERNAL_SERVICE_TOKEN: changeme_mcp_internal_service_token_demo
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # item 7b: espera o config-api ficar healthy antes do startup, senão o fetch
      # de config (evaluator_pool, replay_speed, TTLs) corre e cai no default.
      config-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - plughub-demo
    restart: on-failure

  usage-aggregator:
    build:
      context: packages/usage-aggregator
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS:  kafka:29092
      KAFKA_GROUP_ID: usage-aggregator-demo
      REDIS_URL:      redis://redis:6379
      DATABASE_URL:   postgresql://plughub:plughub@postgres:5432/plughub_demo
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - plughub-demo
    restart: on-failure

  auth-api:
    build:
      # Contexto = raiz do monorepo desde 2026-08-28: sem isso o `packages/py-authz`
      # (verificador canônico) e o `infra/modules.yaml` ficam fora do build. Ver o
      # cabeçalho do Dockerfile.
      context: .
      dockerfile: packages/auth-api/Dockerfile
    ports:
      - "3202:3200"
    volumes:
      # ⚠️ Este mount deixou de ser NECESSÁRIO em 2026-08-28: o Dockerfile agora copia
      # `infra/modules.yaml` para o mesmo caminho, e a imagem basta sozinha (era o que
      # faltava ao `docker-compose.full.yml`, que subia com o registry de módulos
      # vazio). Ele FICA por ergonomia de dev — editar o YAML e reiniciar aplica sem
      # rebuild, o mesmo padrão do `./infra/registry` no orchestrator-bridge —, e
      # apenas sobrepõe o arquivo da imagem.
      - ./infra/modules.yaml:/infra/modules.yaml:ro
    environment:
      PLUGHUB_AUTH_DATABASE_URL:        postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_AUTH_JWT_SECRET:          changeme_auth_jwt_secret_demo_32c
      PLUGHUB_AUTH_ADMIN_TOKEN:         changeme_auth_admin_token_demo
      PLUGHUB_AUTH_SEED_ADMIN_EMAIL:    admin@plughub.local
      PLUGHUB_AUTH_SEED_ADMIN_PASSWORD: changeme_admin
      PLUGHUB_AUTH_SEED_TENANT_ID:      tenant_demo
      # Path do modules.yaml montado — override tem prioridade sobre a heurística parents[4]
      # do main.py (que, em layout site-packages, resolveria p/ um path errado → registry vazio).
      PLUGHUB_AUTH_MODULES_YAML:        /infra/modules.yaml
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:3200/health', timeout=3); assert b'ok' in r.read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plughub-demo
    restart: on-failure

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DB:                       plughub_demo
      CLICKHOUSE_USER:                     plughub
      CLICKHOUSE_PASSWORD:                 plughub
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping 2>/dev/null | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - plughub-demo

  analytics-api:
    build:
      context: .
      dockerfile: packages/analytics-api/Dockerfile
    ports:
      - "3500:3500"
    environment:
      # Credencial dos chamadores INTERNOS desta API (evaluation-api, agent-registry).
      # O fechamento de credencial de 2026-08-29 gateou as rotas e NAO migrou os
      # chamadores: os tres ficaram 401, e tres deles degradavam para um ZERO
      # plausivel. Os TRES envs deste segredo terminam em ANALYTICS_SERVICE_TOKEN
      # (prefixos diferentes por servico) e DEVEM casar.
      PLUGHUB_ANALYTICS_SERVICE_TOKEN: changeme_analytics_service_token_demo
      PLUGHUB_KAFKA_BROKERS:       kafka:29092
      PLUGHUB_KAFKA_GROUP_ID:      analytics-demo
      PLUGHUB_REDIS_URL:           redis://redis:6379
      PLUGHUB_CLICKHOUSE_HOST:     clickhouse
      PLUGHUB_CLICKHOUSE_PORT:     "8123"
      PLUGHUB_CLICKHOUSE_USER:     plughub
      PLUGHUB_CLICKHOUSE_PASSWORD: plughub
      PLUGHUB_CLICKHOUSE_DATABASE: plughub_demo
      PLUGHUB_ADMIN_JWT_SECRET:    demo_analytics_admin_secret
      # open_access = bypass AMPLO de demo (audit/admin/transcript acessíveis sem token).
      # MANTIDO true p/ não quebrar a Auditoria e o tool_trace do avaliador. O pool-scoping
      # foi DESACOPLADO deste flag (pool_auth): agora enforça sempre que há segredo + token.
      # Endurecido em 2026-08-27. Era `"true"` cravado, e o `true` existia porque os
      # scripts de verificacao chamavam a analytics SEM credencial — o que deixou de
      # ser verdade: 30 scripts autenticam (12 sozinhos, 18 pelo shim de `_auth.sh`) e
      # os dois que comparavam agregado contra ledger usam o principal irrestrito
      # DECLARADO (`probe@plughub.local`). Default estrito; o bypass e pedido por env,
      # e ai fica no historico do shell em vez de ficar no arquivo.
      PLUGHUB_ANALYTICS_OPEN_ACCESS: "${PLUGHUB_ANALYTICS_OPEN_ACCESS:-false}"
      # Segurança Fase A/E — o MESMO segredo do auth-api p/ o optional_pool_principal
      # verificar o Bearer e enforçar accessible_pools em /reports/*. Sem isto (ou sem token)
      # o scoping degrada p/ irrestrito. Sem token (dashboards/embeds) segue irrestrito.
      PLUGHUB_AUTH_JWT_SECRET:      changeme_auth_jwt_secret_demo_32c   # == auth-api
      PLUGHUB_PRICING_API_URL:     http://pricing-api:3900   # Fase 2 Pools — teto configurado do total (fallback gracioso p/ provisionada)
      PLUGHUB_AGENT_REGISTRY_URL:  http://agent-registry:3300   # Arc 6 Fase 2 — lente deploy lê skill_deployments (markers); indisponível → série sem markers
      PLUGHUB_CONFIG_API_URL:      http://config-api:3600   # R8b — limiar de divergência + N mínimo (namespace evaluation)
      PLUGHUB_EVALUATION_API_URL:  http://evaluation-api:3400   # micro-fatia 1b — epoch overlay (provisória + pendentes por versão); indisponível → epoch só finalizada
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3500/v1/health', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plughub-demo


  config-api:
    build:
      context: .
      dockerfile: packages/config-api/Dockerfile
    ports:
      - "3600:3600"
    environment:
      PLUGHUB_CONFIG_DATABASE_URL:  postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_CONFIG_REDIS_URL:     redis://redis:6379
      PLUGHUB_CONFIG_ADMIN_TOKEN:   demo_config_admin_token
      PLUGHUB_CONFIG_JWT_SECRET:    changeme_auth_jwt_secret_demo_32c   # G-PROBE — valida Bearer+ABAC (mesmo segredo da auth-api)
      PLUGHUB_CONFIG_KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3600/v1/health', timeout=5)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 60s
    restart: on-failure
    networks:
      - plughub-demo

  config-seed:
    build:
      context: .
      dockerfile: packages/config-api/Dockerfile
    environment:
      PLUGHUB_CONFIG_DATABASE_URL: postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_CONFIG_REDIS_URL:    redis://redis:6379
      # Faltava: sem broker o seed escreve no DB e NÃO publica config.changed.
      # No boot é inócuo, mas numa reaplicação com a stack de pé
      # (`--only ns.key --overwrite`) o mcp-server seguiria servindo o valor
      # antigo do seu cache HTTP — mudança aplicada e sem efeito, sem erro.
      PLUGHUB_CONFIG_KAFKA_BROKERS: kafka:29092
    command: ["plughub-config-seed"]
    depends_on:
      config-api:
        condition: service_healthy
      # O emitter abre o producer no arranque; broker fora do ar aborta o seed.
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - plughub-demo
    restart: "no"

  # ─── context-map-seed (ALW-12) ─────────────────────────────────────────────
  #
  # Provisiona os DOMÍNIOS DE NEGÓCIO do tenant no `masking.context_map`. A
  # semente da plataforma (config-seed, acima) traz só o vocabulário da
  # PLATAFORMA — decisão da ALW-04, e correta. Sem este container, os 20 campos
  # de `cartao`/`conta`/`portabilidade`/`processo`/`reembolso` só existem porque
  # alguém os escreveu pela API uma vez, e um `--wipe` os perde: medido em
  # 2026-09-02, 17 das 52 escritas de skill voltam a NÃO DECLARADAS.
  #
  # Roda DEPOIS do config-seed porque acrescenta ao mapa dele — sozinho, sobre um
  # store vazio, ele recusa (o GET dá 404 e o seed sai dizendo por quê, em vez de
  # publicar um mapa sem os domínios de plataforma).
  context-map-seed:
    image: python:3.11-slim
    volumes:
      - ./infra/seed:/seed:ro
      - ./infra/context-map:/context-map:ro
    environment:
      CONFIG_API_URL:   http://config-api:3600
      CONTEXT_MAP_DIR:  /context-map
      TENANT_ID:        tenant_demo
      SEED_MAX_WAIT:    "120"
      # ESPELHO de PLUGHUB_CONFIG_ADMIN_TOKEN do serviço config-api. Os dois nomes
      # diferem porque o serviço usa env_prefix `PLUGHUB_CONFIG_` (pydantic-settings)
      # e o seed lê a env crua — mesma armadilha que o dialog-seed documenta.
      CONFIG_ADMIN_TOKEN: demo_config_admin_token
      # Inverte a precedência: o arquivo vence, domínio a domínio.
      CONTEXT_MAP_SEED_RECONCILE: ${CONTEXT_MAP_SEED_RECONCILE:-}
    command: ["python", "/seed/seed_context_map.py"]
    depends_on:
      config-api:
        condition: service_healthy
      config-seed:
        condition: service_completed_successfully
    networks:
      - plughub-demo
    restart: "no"

  # demo-seed REMOVIDO (config-consolidation F1.1b, 2026-06-11): provisionamento de
  # pools/channel_endpoints é via RegistrySyncer (orchestrator-bridge) a partir de
  # infra/registry/tenant_demo.yaml. agent_types entidade aposentada; Redis derivado
  # do routing-engine via registry.changed. Ver docs/arcos/config-consolidation.md.

  # Recursos contratados do demo (capacity-governance item 6) — coerentes com
  # os deploys do tenant_demo.yaml: ai_agent×300 + human_agent×10 → C=310.
  # Não-destrutivo: pula se o tenant já tiver resources (ajustes preservados).
  pricing-seed:
    image: python:3.11-slim
    volumes:
      - ./infra/seed:/seed:ro
    environment:
      PRICING_API_URL:     http://pricing-api:3900
      PRICING_ADMIN_TOKEN: demo_pricing_admin_token
      TENANT_ID:           tenant_demo
      SEED_MAX_WAIT:       "120"
    command: ["python", "/seed/seed_pricing.py"]
    depends_on:
      pricing-api:
        condition: service_healthy
    networks:
      - plughub-demo
    restart: "no"

  # Cria usuários demo no auth-api com module_config (ABAC).
  # supervisor@plughub.local — pode revisar avaliações + ver analytics
  # operator@plughub.local   — pode contestar avaliações + ver analytics
  auth-seed:
    image: python:3.11-slim
    volumes:
      - ./infra/seed:/seed:ro
    environment:
      AUTH_API_URL:       http://auth-api:3200
      AUTH_ADMIN_TOKEN:   changeme_auth_admin_token_demo
      TENANT_ID:          tenant_demo
      SEED_MAX_WAIT:      "120"
    command: ["python", "/seed/seed_auth.py"]
    depends_on:
      auth-api:
        condition: service_healthy
      # Sem healthcheck HTTP (o bridge sinaliza prontidão escrevendo
      # `{tenant}:bootstrap:ready` no Redis), então só `service_started`. Está
      # aqui porque o cenário 29 depende dele para DUAS coisas — ativar o agente
      # de fila (`process_queued`) e entregar a fala do cliente
      # (`process_inbound`) — e sem a dependência declarada a falha apareceria
      # como timeout de ativação, que aponta para o lugar errado.
      orchestrator-bridge:
        condition: service_started
    networks:
      - plughub-demo
    restart: "no"

  # Cria formulário e campanha de avaliação demo.
  # Formulário "SAC Padrão" com 4 critérios.
  # Campanha "Demo SAC — Avaliação Contínua" com skill_revisao_simples_v1.
  eval-seed:
    image: python:3.11-slim
    volumes:
      - ./infra/seed:/seed:ro
    environment:
      EVALUATION_API_URL: http://evaluation-api:3400
      AUTH_ADMIN_TOKEN:   changeme_eval_admin_token_demo
      # G-PROBE fase 2 — credencial de serviço; as escritas de form/campaign não
      # aceitam mais X-Admin-Token. DEVE casar com PLUGHUB_EVALUATION_SERVICE_TOKEN.
      EVALUATION_SERVICE_TOKEN: changeme_eval_service_token_demo
      TENANT_ID:          tenant_demo
      SEED_MAX_WAIT:      "120"
    command: ["python", "/seed/seed_evaluation.py"]
    depends_on:
      evaluation-api:
        condition: service_healthy
    networks:
      - plughub-demo
    restart: "no"

  # Provisiona os DialogForms declarativos de ./infra/dialog/*.json na dialog-api,
  # via API oficial e SEED-IF-ABSENT (form já publicado não é tocado — o DB vence,
  # então formulário editado em /config/dialog-forms sobrevive a rebuild).
  #
  # Sem este job, um banco NOVO sobe sem nenhum DialogForm e os consumidores
  # degradam EM SILÊNCIO: o NPS de fim-de-contato (agente_nps_v1 → form_get 404 →
  # on_failure) simplesmente não aparece para o cliente, e o wrap-up no Console
  # abre o painel SEM formulário (DialogFormRenderer → 404 → setForm(null)).
  #
  # Para fazer o ARQUIVO vencer o DB (dev/GitOps): DIALOG_SEED_RECONCILE=true.
  dialog-seed:
    image: python:3.11-slim
    volumes:
      - ./infra/seed:/seed:ro
      - ./infra/dialog:/dialog:ro
    environment:
      DIALOG_API_URL:   http://dialog-api:3760
      DIALOG_FORMS_DIR: /dialog
      TENANT_ID:        tenant_demo
      SEED_MAX_WAIT:    "120"
      # ESPELHO de PLUGHUB_DIALOG_ADMIN_TOKEN do servico dialog-api. Os dois nomes
      # diferem porque o servico usa env_prefix `PLUGHUB_DIALOG_` (pydantic-settings) e
      # o seed le a env crua; divergir aqui faz o seed levar 401 e a base nova subir
      # SEM formulario nenhum — o NPS de fim-de-contato cairia no `on_failure` do
      # `form_get` e o wrap-up abriria o painel vazio.
      DIALOG_ADMIN_TOKEN: demo_dialog_admin_token
    command: ["python", "/seed/seed_dialog.py"]
    depends_on:
      dialog-api:
        condition: service_healthy
    networks:
      - plughub-demo
    restart: "no"

  pricing-api:
    build:
      context: .
      dockerfile: packages/pricing-api/Dockerfile
    ports:
      - "3900:3900"
    environment:
      PLUGHUB_PRICING_DATABASE_URL:    postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_PRICING_CONFIG_API_URL:  http://config-api:3600
      PLUGHUB_PRICING_ADMIN_TOKEN:     demo_pricing_admin_token
      PLUGHUB_PRICING_JWT_SECRET:      changeme_auth_jwt_secret_demo_32c   # G-PROBE — Bearer+ABAC config.plataforma
      PLUGHUB_PRICING_REDIS_URL:       redis://redis:6379   # quota sync — {t}:quota:max_concurrent_sessions
    depends_on:
      postgres:
        condition: service_healthy
      config-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3900/health', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
    networks:
      - plughub-demo

  # ─── MinIO — S3-compatible object storage (sem custo, roda localmente) ────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console web → http://localhost:9001 (plughub / plughub123)
    environment:
      MINIO_ROOT_USER:     plughub
      MINIO_ROOT_PASSWORD: plughub123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - plughub-demo

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 plughub plughub123 &&
        mc mb --ignore-existing local/plughub-attachments &&
        echo 'MinIO bucket plughub-attachments criado.' &&
        exit 0
      "
    networks:
      - plughub-demo

  channel-gateway:
    build:
      context: .
      dockerfile: packages/channel-gateway/Dockerfile
    ports:
      - "8010:8010"
    environment:
      PLUGHUB_KAFKA_BROKERS:              kafka:29092
      PLUGHUB_REDIS_URL:                  redis://redis:6379
      PLUGHUB_JWT_SECRET:                 changeme_32chars_webchat_secret!
      # A5 — segredo do auth-api (= PLUGHUB_AUTH_JWT_SECRET do auth-api) p/ verificar o
      # JWT do aprovador no resume interno → grau possessed + ABAC. Sem isto, a decisão
      # é registrada como claimed (e o gate de limiar possessed a recusa).
      PLUGHUB_AUTH_JWT_SECRET:            changeme_auth_jwt_secret_demo_32c
      # A5 — routing HTTP API (holder da claim lease p/ caller==claimant). Degrada
      # gracioso se indisponível (lease de TTL curto ausente não bloqueia).
      PLUGHUB_ROUTING_ENGINE_URL:         http://routing-engine:3550
      # Identity Resolver (Fase A · Slice 1). Salt is a SECRET → env only.
      PLUGHUB_IDENTITY_RESOLVER_ENABLED:  "true"
      PLUGHUB_IDENTITY_SALT:              changeme_identity_salt_demo
      PLUGHUB_DIALOG_API_URL:             http://dialog-api:3760   # survey web vehicle — snapshot do DialogForm
      PLUGHUB_EVALUATION_API_URL:         http://evaluation-api:3400   # survey response store (S8/S9) — persist-first
      PLUGHUB_EVALUATION_SERVICE_TOKEN:   changeme_eval_service_token_demo   # _require_service da evaluation-api
      PLUGHUB_CONFIG_API_URL:             http://config-api:3600
      # Channel-endpoint resolution (slug→pool) for webchat/voice/webrtc/webhook.
      # Without this the default (localhost:3000) points at the container itself →
      # resolve_pool always fails. Webchat/voice fall back to identifier=pool_id;
      # the webhook slug endpoint has no fallback and 404s. Arc 19.
      PLUGHUB_AGENT_REGISTRY_URL:         http://agent-registry:3300
      # Credencial de serviço (= AGENT_REGISTRY_SERVICE_TOKEN do agent-registry).
      # Arco webhook-endpoint-auth: sem ela o registry OMITE o `token_hash` do
      # endpoint — material de credencial não sai na leitura geral, que é a mesma
      # que a UI consome. Sem o hash o gateway não tem contra o quê comparar e
      # RECUSA (fail-closed) disparo em endpoint com `auth_required`.
      PLUGHUB_AGENT_REGISTRY_SERVICE_TOKEN: changeme_agent_registry_service_token_demo
      # auth_timeout_s (F2-TTL) e attachment_expiry_days (F1.2) vêm do config-api via
      # WebchatConfigCache HTTP (config-http-propagation arc): GET /config/webchat +
      # invalidação config.changed. Os envs PLUGHUB_WS_AUTH_TIMEOUT_S /
      # PLUGHUB_ATTACHMENT_EXPIRY_DAYS continuam removidos (default no código é fallback).
      PLUGHUB_DATABASE_URL:               postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_WEBCHAT_SERVING_BASE_URL:   http://localhost:8010/webchat/v1/attachments
      PLUGHUB_WEBCHAT_UPLOAD_BASE_URL:    http://localhost:8010/webchat/v1/upload
      PLUGHUB_TENANT_ID:                  tenant_demo
      PLUGHUB_KAFKA_TOPIC_INBOUND:        conversations.inbound
      PLUGHUB_KAFKA_TOPIC_OUTBOUND:       conversations.outbound
      PLUGHUB_KAFKA_TOPIC_EVENTS:         conversations.events
      # S3/MinIO storage backend (fase 2)
      PLUGHUB_ATTACHMENT_STORE_TYPE:      s3
      PLUGHUB_S3_ENDPOINT_URL:            http://minio:9000
      PLUGHUB_S3_BUCKET:                  plughub-attachments
      PLUGHUB_S3_ACCESS_KEY:              plughub
      PLUGHUB_S3_SECRET_KEY:              plughub123
      PLUGHUB_S3_REGION:                  us-east-1
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

      PLUGHUB_EVALUATION_ANALYTICS_SERVICE_TOKEN: changeme_analytics_service_token_demo
      # ALW-02 / decisão #6 — o funil do ContextStore e o catálogo de máscara leem daqui.
      # FALTAVA: medido em 2026-09-02, este era o único dos cinco serviços do funil sem a
      # variável, e sem ela o carregador cai em `localhost:3600` (o próprio container) e
      # carimba com o mapa EMBUTIDO — `atributo.fallback: true`, em silêncio.
      PLUGHUB_CONFIG_API_URL:                 http://config-api:3600
      PLUGHUB_EVALUATION_DATABASE_URL:        postgresql://plughub:plughub@postgres:5432/plughub_demo
      PLUGHUB_EVALUATION_REDIS_URL:           redis://redis:6379
      PLUGHUB_EVALUATION_KAFKA_BROKERS:       kafka:29092
      PLUGHUB_EVALUATION_ADMIN_TOKEN:         changeme_eval_admin_token_demo
      PLUGHUB_EVALUATION_SERVICE_TOKEN:       changeme_eval_service_token_demo   # G-PROBE fase 2 — credencial de serviço (sistema/agente/e2e)
      PLUGHUB_EVALUATION_KNOWLEDGE_SERVICE_TOKEN: changeme_knowledge_service_token_demo   # G-PROBE — publish de CalibrationNote no KB gateado
      PLUGHUB_EVALUATION_JWT_SECRET:          changeme_auth_jwt_secret_demo_32c
      PLUGHUB_EVALUATION_CALENDAR_API_URL:    http://calendar-api:3700
      PLUGHUB_EVALUATION_WORKFLOW_API_URL:    http://workflow-api:3800
      # Fase 4a — resume direto no channel-gateway (a workflow-api só reencaminhava).
      PLUGHUB_EVALUATION_CHANNEL_GATEWAY_URL: http://channel-gateway:8010
      PLUGHUB_EVALUATION_SESSION_REPLAYER_URL: http://mcp-server-plughub:3100
      PLUGHUB_EVALUATION_ANALYTICS_API_URL:   http://analytics-api:3500
      PLUGHUB_EVALUATION_AGENT_REGISTRY_URL:  http://agent-registry:3300   # R9d — resolve deploy_version por flow_id
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3400/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
    networks:
      - plughub-demo

  # ─── quality-ingest (R13a — pluggable contact-history reader) ──────────────
  #   Open ingestion_event_v1 endpoint (anti-corruption boundary). Pure producer
  #   of internal canonical events — reuses the existing analytics + sampling
  #   pipeline. POST http://localhost:3850/v1/ingest/events  (header X-Tenant-ID).
  quality-ingest:
    build:
      context: packages/quality-ingest
      dockerfile: Dockerfile
    ports:
      - "3850:3850"
    environment:
      PLUGHUB_QUALITY_INGEST_KAFKA_BROKERS:  kafka:29092
      PLUGHUB_QUALITY_INGEST_CONFIG_API_URL: http://config-api:3600   # R13c — source_map
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      config-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3850/v1/health', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure
    networks:
      - plughub-demo

  # ─── quality-export (R13d — internal history → re-evaluation) ───────────────
  #   Reads ClickHouse session history and re-emits ingestion_event_v1 through the
  #   quality-ingest contract. POST http://localhost:3852/v1/export/sessions
  #   {tenant_id, session_ids, source?}. Reuses original pool (§7).
  quality-export:
    build:
      context: packages/quality-export
      dockerfile: Dockerfile
    ports:
      - "3852:3852"
    environment:
      PLUGHUB_QUALITY_EXPORT_CLICKHOUSE_URL:      http://clickhouse:8123
      PLUGHUB_QUALITY_EXPORT_CLICKHOUSE_DB:       plughub_demo
      PLUGHUB_QUALITY_EXPORT_CLICKHOUSE_USER:     plughub
      PLUGHUB_QUALITY_EXPORT_CLICKHOUSE_PASSWORD: plughub
      PLUGHUB_QUALITY_EXPORT_QUALITY_INGEST_URL:  http://quality-ingest:3850
    depends_on:
      clickhouse:
        condition: service_healthy
      quality-ingest:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:3852/v1/health', timeout=3)\" 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure
    networks:
      - plughub-demo

  # ─── mcp-server-knowledge (Arc 6 — RAG knowledge base) ──────────────────
  mcp-server-knowledge:
    build:
      context: .
      dockerfile: packages/mcp-server-knowledge/Dockerfile
    ports:
      - "3401:3401"
    environment:
      PORT:             "3401"
      DATABASE_URL:     postgresql://plughub:plughub@postgres:5432/plughub_demo
      ADMIN_TOKEN:      changeme_knowledge_admin_token_demo
      # G-PROBE platform-wide: gate dual do REST /v1/knowledge. PLUGHUB_JWT_SECRET valida o
      # Bearer da UI (= segredo auth-api); KNOWLEDGE_SERVICE_TOKEN é o caller interno (eval-api).
      PLUGHUB_JWT_SECRET:      changeme_auth_jwt_secret_demo_32c
      KNOWLEDGE_SERVICE_TOKEN: changeme_knowledge_service_token_demo
      # EMBEDDING_PROVIDER: openai       # descomente para habilitar embeddings reais
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3401/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure
    networks:
      - plughub-demo

  # ─── platform-ui (shell unificado — porta 5174) ──────────────────────────
  #   http://localhost:5174/login          ← login com credenciais reais (auth-api)
  #   http://localhost:5174/monitor        ← monitor operacional
  #   http://localhost:5174/agent-assist   ← agent assist integrado
  #   http://localhost:5174/evaluation     ← plataforma de avaliação Arc 6
  #   http://localhost:5174/config/billing ← faturamento Arc 2
  platform-ui:
    build:
      context: .
      dockerfile: packages/platform-ui/Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      auth-api:
        condition: service_healthy
      mcp-server-plughub:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
      analytics-api:
        condition: service_healthy
      config-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
    networks:
      - plughub-demo

  # ── Ativos de demo (estático) ────────────────────────────────────────────
  # Substituiu o `agent-assist-ui` em 2026-08-27. Aquele app React duplicava 1:1 as
  # 4 abas que o platform-ui já tem (`/agent-assist`), não tinha autenticação nenhuma
  # e violava a invariante do CLAUDE.md ("never create a new packages/my-ui/
  # standalone frontend app"). Ver CHANGELOG.
  #
  # O que sobreviveu são as PÁGINAS de demo que viviam dentro dele — o simulador de
  # cliente acima de tudo. Mesma porta de propósito: todas as URLs de roteiro e
  # documentação (`http://localhost:5173/webchat-test.html`) seguem valendo.
  #
  # Sem proxy: as páginas falam direto com o channel-gateway. Os proxies `/api/`,
  # `/agent-ws` e `/analytics/` do nginx antigo serviam o app React e foram embora
  # com ele.
  demo-assets:
    image: nginx:alpine
    ports:
      - "5173:5173"
    volumes:
      # `infra/demo/web`, NAO `infra/demo`: o diretorio pai tem `initdb/` com SQL de
      # criacao de banco, e servi-lo como estatico publicaria aquilo por HTTP.
      - ./infra/demo/web:/usr/share/nginx/html:ro
    command: >
      sh -c "printf 'server {\n listen 5173;\n root /usr/share/nginx/html;\n
      autoindex on;\n}\n' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - plughub-demo
    restart: on-failure

# ─────────────────────────────────────────────────────────────────────────────
# Observability
# ─────────────────────────────────────────────────────────────────────────────

  # Kafdrop  (Kafka UI):         http://localhost:9002
  # NOTA: kafdrop 4.x tem incompatibilidade com Kafka 3.7 KRaft (kafkaHighLevelConsumer
  # falha no init). Usamos 3.31.0 que funciona corretamente com Kafka 3.x.
  kafdrop:
    image: obsidiandynamics/kafdrop:3.31.0
    ports:
      - "9002:9000"   # 9000/9001 podem estar em uso pela infra existente
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXTPATH: "/"
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - plughub-demo

  # Redis Commander — Redis UI. Acesse: http://localhost:8081
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - plughub-demo

# ─────────────────────────────────────────────────────────────────────────────
# E2E Test Runner — executa os cenários e encerra
# ─────────────────────────────────────────────────────────────────────────────

  e2e-runner:
    build:
      context: .
      dockerfile: packages/e2e-tests/Dockerfile
    environment:
      MCP_SERVER_URL:           http://mcp-server-plughub:3100
      AGENT_REGISTRY_URL:       http://agent-registry:3300
      SKILL_FLOW_URL:           http://skill-flow-service:3460
      RULES_ENGINE_URL:         http://rules-engine:3201
      AI_GATEWAY_URL:           http://ai-gateway:3200
      AUTH_API_URL:             http://auth-api:3200
      EVALUATION_API_URL:       http://evaluation-api:3400
      CHANNEL_GATEWAY_WS_URL:   ws://channel-gateway:8010
      CHANNEL_GATEWAY_HTTP_URL: http://channel-gateway:8010
      WORKFLOW_API_URL:         http://workflow-api:3800
      CALENDAR_API_URL:         http://calendar-api:3700
      ANALYTICS_API_URL:        http://analytics-api:3500
      # ⚠️ Faltavam (medido 2026-08-25). O runner cai em `http://localhost:3600`
      # quando a env não vem (`runner.ts` §139), e dentro do container `localhost`
      # é o PRÓPRIO runner: o `--demo` morria no `waitForService` do config-api
      # ANTES do primeiro cenário, com `fetch failed`. Não é erro de cenário — é
      # env ausente, e o modo de falha (fatal, na espera) escondia que o `--demo`
      # nunca completou nesta stack.
      CONFIG_API_URL:           http://config-api:3600
      CONFIG_API_ADMIN_TOKEN:   demo_config_admin_token   # == PLUGHUB_CONFIG_ADMIN_TOKEN §1001
      REDIS_URL:                redis://redis:6379
      KAFKA_BROKERS:            kafka:29092
      TENANT_ID:                tenant_demo
      JWT_SECRET:               demo_plughub_secret_32chars__
      # Segredo com que o runner ASSINA o JWT do webchat. Tem de bater com o que o
      # channel-gateway usa para VERIFICAR, e ele resolve em dois passos
      # (`webchat.py:466`): Redis `{tenant}:config:webchat:jwt_secret` primeiro,
      # `PLUGHUB_JWT_SECRET` como fallback. O `flushTestData` do runner apaga
      # `{tenant}:*` antes de cada cenário — a chave do Redis some junto —, então o
      # que vale em e2e é SEMPRE o fallback, e este valor espelha §1229.
      # (Os cenários leem a chave do Redis quando ela existe, para não depender de
      # duas linhas mantidas iguais à mão.)
      WEBCHAT_JWT_SECRET:       changeme_32chars_webchat_secret!
      AUTH_JWT_SECRET:          changeme_auth_jwt_secret_demo_32c
      AUTH_ADMIN_TOKEN:         changeme_auth_admin_token_demo
      EVAL_ADMIN_TOKEN:         changeme_eval_admin_token_demo
      # Credencial de serviço do agent-registry: as MUTAÇÕES de /v1/pools e
      # /v1/skills são gateadas por `requireResourceWrite`, e o seed do runner
      # morria em 401 sem ela (TODO §101 → e2e → §1055). Mesmo valor de §559/619/1403.
      AGENT_REGISTRY_SERVICE_TOKEN: changeme_agent_registry_service_token_demo
      E2E_REPORT_PATH:          /app/e2e-report.json
      # E2E_EXTRA_ARGS exemplos:
      #   --demo              cenários 01–14 (padrão)
      #   --evaluation        Arc 6: cenários 01–04 + 24 + 25
      #   --permissions       Arc 6 v2: cenário 27 (ABAC permissions)
      #   --workflow-review   Arc 6 v2: cenário 28 (review/contestation workflow cycle)
      #   --hooks             Arc 5 hooks: cenário 22
      #   --segments          Arc 5 segments: cenário 23
      #   --conference, --webchat, --workflow, --collect, --ctx
      E2E_EXTRA_ARGS:           ${E2E_EXTRA_ARGS:---demo}
    depends_on:
      mcp-server-plughub:
        condition: service_healthy
      agent-registry:
        condition: service_healthy
      routing-engine:
        condition: service_healthy
      skill-flow-service:
        condition: service_healthy
      rules-engine:
        condition: service_healthy
      channel-gateway:
        condition: service_healthy
      workflow-api:
        condition: service_healthy
      analytics-api:
        condition: service_healthy
      evaluation-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
    networks:
      - plughub-demo
    restart: "no"
